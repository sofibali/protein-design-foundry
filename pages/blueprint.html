<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Blueprint</title>
<style>
  :root {
    --bg:#fff; --ink:#1d1d1f; --muted:#8e8e93; --rule:#d2d2d7; --tab-bg:#f2f2f4;
    --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
    /* the drawing is a technical drawing: blueprint paper in either theme */
    --paper:#0f1b2a; --grid:#24415e; --line:#e8eef5; --dim:#8fa6bd; --accent:#56B4E9;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme=light]){
    --bg:#141416; --ink:#f2f2f4; --muted:#8e8e93; --rule:#3a3a3d; --tab-bg:#242427;
  }}
  :root[data-theme=dark]{ --bg:#141416; --ink:#f2f2f4; --rule:#3a3a3d; --tab-bg:#242427; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 16px 56px}
  header{text-align:center;margin-bottom:18px}
  h1{font-weight:400;font-size:clamp(22px,3vw,34px);margin:0;letter-spacing:-.01em}
  .sub{font-size:clamp(15px,2vw,19px);margin-top:3px}
  .note{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.5}
  .nav{text-align:center;font-size:13px;margin-top:10px}
  .nav a{color:var(--muted)}
  .nav a:hover{color:var(--ink)}

  /* a drawn panel: what the cart does, in page colours rather than on paper */
  .cfig{margin:13px 0 0;border:1px solid var(--rule);border-radius:9px;padding:8px 10px}
  .cfig figcaption{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
                   color:var(--muted);margin-bottom:4px}
  .cfig svg{display:block;width:100%;height:auto;font-family:var(--font)}
  svg .ln{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-linejoin:round;stroke-linecap:round}
  svg .mu{fill:none;stroke:var(--muted);stroke-width:1}
  svg .dash{stroke-dasharray:3 2.5}
  svg .fl,svg .none{stroke:none}
  svg text.lb{font-size:8.5px;fill:var(--ink)}
  svg text.sm{font-size:7.5px;fill:var(--muted)}

  /* the sheet */
  .sheet{background:var(--paper);border-radius:14px;padding:6px;overflow:hidden;
         box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .sheet svg{display:block;width:100%;height:auto;font-family:var(--font)}
  .cart-l{font-size:12.5px;fill:var(--line)}
  .cart-n{font-size:10px;fill:var(--dim);font-variant-numeric:tabular-nums}
  .io-l{font-size:8.5px;fill:var(--dim);letter-spacing:.04em}
  .tile{cursor:pointer}
  .tile rect.box{fill:#16263a;stroke:var(--line);stroke-width:1.3}
  .tile:hover rect.box{fill:#21384f}
  .tile[aria-pressed=true] rect.box{fill:#27405a;stroke:var(--accent);stroke-width:2}
  .tile.dim{opacity:.3}
  .glyph{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

  /* legend */
  .bar{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12.5px;color:var(--muted);
       margin:14px 2px 0;align-items:center}
  .bar span{display:inline-flex;align-items:center;gap:7px}
  .key{width:17px;height:12px;border-radius:3px;flex:none;border:1.3px solid var(--ink)}
  .key.inst{background:var(--tab-bg)}
  .key.io{width:12px;height:12px;border-radius:999px}

  /* ---------- the cart detail sheet ---------- */
  .detail{border:1px solid var(--rule);border-radius:12px;margin-top:16px;overflow:hidden}
  .ttl{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--rule);
       font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}
  .ttl .r{margin-left:auto;letter-spacing:.09em}
  .dbody{padding:15px 16px 17px}
  .dhd{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
  .dhd h3{font-size:19px;font-weight:400;margin:0;letter-spacing:-.01em}
  .dhd .no{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
  .classes{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .cls{font-size:11.5px;border-radius:999px;padding:2px 10px;border:1px solid;
       text-transform:lowercase;letter-spacing:.01em}
  .detail p.lead{font-size:13.5px;line-height:1.52;margin:11px 0 0;max-width:76ch}
  .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
       color:var(--muted);margin-top:16px;font-weight:500}
  .split{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;margin-top:7px;
         align-items:start}
  .elev{background:var(--paper);border-radius:9px;padding:5px}
  .elev svg{display:block;width:100%;height:auto;font-family:var(--font)}
  .el-l{font-size:9px;fill:var(--dim);letter-spacing:.03em}
  .el-i{font-size:10px;fill:var(--line)}
  .el-d{font-size:8.5px;fill:var(--dim);font-variant-numeric:tabular-nums}
  .spec{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:8px}
  .spec:first-child{margin-top:0}
  .spec b{color:var(--ink);font-weight:500}

  /* a spec is a table of rows, not a paragraph to pick apart */
  .kv{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
  .kv td{padding:6px 0;border-top:1px solid var(--rule);vertical-align:top;line-height:1.45}
  .kv tr:first-child td{border-top:0}
  .kv td.k{color:var(--muted);width:38%;padding-right:16px;word-break:break-word}
  .kv td.v{color:var(--ink)}
  .kv td.v em{font-style:normal;color:var(--muted)}

  /* everything past the first paragraph is behind a disclosure, so a cart
     opens at a glance and goes deeper only when asked */
  .dd{border-top:1px solid var(--rule)}
  .dd:last-of-type{border-bottom:1px solid var(--rule)}
  .dd>summary{list-style:none;cursor:pointer;padding:10px 0;display:flex;
              align-items:baseline;gap:9px;font-size:13px}
  .dd>summary::-webkit-details-marker{display:none}
  .dd>summary::before{content:"";flex:none;width:7px;height:7px;margin-top:4px;
       border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);
       transform:rotate(-45deg);transition:transform .15s}
  .dd[open]>summary::before{transform:rotate(45deg)}
  .dd>summary:hover{color:var(--accent)}
  .dd .cnt{margin-left:auto;color:var(--muted);font-size:11.5px;
           font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .dd .sv{color:var(--muted);font-size:12px}
  .ddb{padding:2px 0 14px}
  .prose{font-size:12.5px;color:var(--muted);line-height:1.5;margin:11px 0 0;max-width:76ch}
  .more{display:inline-block;margin-top:11px;font-size:12px;color:var(--accent);
        text-decoration:none;border-bottom:1px solid transparent}
  .more:hover{border-bottom-color:var(--accent)}

  .ptab{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
  .ptab th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
           font-weight:500;text-align:left;padding:0 0 6px;border-bottom:1px solid var(--rule)}
  .ptab td{padding:6px 0;border-top:1px solid var(--rule);line-height:1.4;vertical-align:top}
  .ptab td.id{width:46px;color:var(--muted);font-variant-numeric:tabular-nums}
  .ptab td.ph{width:112px}
  .ptab .dot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;
             vertical-align:middle}
  .ptab th.id{width:46px} .ptab th.ph{width:112px}

  .protos{display:grid;gap:5px;margin-top:6px}
  .pr{display:grid;grid-template-columns:34px minmax(0,1fr);gap:9px;font-size:12.5px;
      align-items:baseline;border-left:3px solid;padding:3px 0 3px 9px}
  .pr .pid{color:var(--muted);font-variant-numeric:tabular-nums}
  .empty{color:var(--muted);font-size:13px;line-height:1.55;margin:0}

  /* ---------- phase 2 ---------- */
  .p2sec{margin-top:40px}
  .p2sec > h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:500;
              margin:0 0 4px;padding-bottom:6px;border-bottom:2px solid var(--rule)}
  .p2sec .intro{color:var(--muted);font-size:12.5px;margin:10px 0 14px;max-width:78ch;line-height:1.55}
  .p2grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:11px}
  .p2card{border:1px dashed var(--rule);border-radius:11px;padding:13px 14px 14px}
  .p2card .ph{display:flex;align-items:center;gap:10px}
  .p2card .mini{width:40px;height:40px;border-radius:9px;border:1.3px dashed var(--muted);
                flex:none;display:grid;place-items:center}
  .p2card .mini svg{display:block;width:24px;height:24px}
  .p2card .mini path{fill:none;stroke:var(--muted);stroke-width:1.5;
                     stroke-linecap:round;stroke-linejoin:round}
  .p2card h3{font-size:14.5px;font-weight:500;margin:0;letter-spacing:-.005em}
  .p2card .n2{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px}
  .p2card p{font-size:12.5px;line-height:1.5;color:var(--muted);margin:10px 0 0}
  .p2card .classes{margin-top:10px}

  .foot{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:28px;
        border-top:1px solid var(--rule);padding-top:12px}
  .foot b{color:var(--ink);font-weight:500}
  @media (max-width:700px){ .split{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="t"></h1>
    <div class="sub" id="s"></div>
    <div class="note" id="n"></div>
    <div class="nav"><a href="foundry.html">what happens here</a>
      &nbsp;&middot;&nbsp; <a href="workflows.html">sample protocols</a>
      &nbsp;&middot;&nbsp; <a href="intake.html">propose a campaign</a>
      &nbsp;&middot;&nbsp; <a href="{{SITE}}/">foundry site</a></div>
  </header>

  <div class="sheet"><div id="sheet"></div></div>
  <div class="bar" id="legend"></div>
  <div class="detail" id="detail"></div>

  <section class="p2sec">
    <h2>Phase 2 &middot; pending</h2>
    <div class="intro" id="p2intro"></div>
    <div class="p2grid" id="p2"></div>
  </section>

  <div class="foot" id="foot"></div>
</div>

<script src="figkit.js"></script>
<script src="blueprint.js"></script>
<script>
(() => {
  const B = window.BLUEPRINT;
  const RACS  = B.racs.filter(r => r.status === 'installed');
  const PEND  = B.racs.filter(r => r.status === 'phase2');
  const INST = {}; B.instruments.forEach(i => { INST[i.id] = i; });
  const WF   = {}; B.workflows.forEach(w => { WF[w.id] = w; });
  const PH   = {}; B.phases.forEach(p => { PH[p.id] = p; });
  const esc = t => String(t).replace(/[&<>"]/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

  // the drawing kit (pages/figkit.js, inlined by the build)
  const G = window.FIGKIT.G, svg = window.FIGKIT.svg, rnd = window.FIGKIT.rnd;

  // CART FIGURES START
  const CART = {

  'echo': {
    s: c => {
      let b = G.t(160, 12, 'destination plate, inverted', {c: 'sm'})
        + G.plate(70, 16, 180, 18, 12, 1, {f: c});
      [2, 6, 10].map(i => 73 + (174 / 12) * (i + .5)).forEach(x => {
        b += G.dot(x, 44, 1.5) + G.dot(x, 54, 1.8) + G.dot(x, 64, 2.1);
      });
      b += G.plate(70, 74, 180, 18, 12, 1, {well: (i) => ([2, 6, 10].indexOf(i) >= 0 ? c : null)});
      return b + G.p('M146 98H174L169 110H151Z', {f: c, o: .3})
        + G.p('M148 96Q160 89 172 96', {c: 'mu'})
        + G.t(258, 58, 'picked wells', {c: 'sm', a: 'start'})
        + G.t(258, 68, 'only', {c: 'sm', a: 'start'})
        + G.t(160, 126, 'the transducer fires 2.5 nL at a time - no tip, no contact', {c: 'sm'});
    }
  },

  'multiflo': {
    s: c => {
      let b = G.c(34, 44, 16, {c: 'mu'}) + G.c(34, 44, 8, {c: 'mu'})
        + G.t(34, 22, 'cassette', {c: 'sm'})
        + G.p('M50 44H64Q72 44 72 36V32', {c: 'mu'})
        + G.r(72, 26, 216, 11, {r: 2, f: c});
      for (let i = 0; i < 12; i++) {
        const x = 82 + i * 18.6;
        b += G.l(x, 37, x, 44) + G.l(x, 48, x, 62, {c: 'mu dash'});
      }
      return b + G.plate(72, 64, 216, 28, 12, 2, {f: c, well: () => c})
        + G.t(180, 108, 'every well, same volume', {c: 'lb'})
        + G.t(180, 124, 'three cassettes cover 1 uL to 3 mL; a 1536 plate at 1 uL a well takes 21 s', {c: 'sm'});
    }
  },

  'bravo': {
    s: c => {
      let b = G.r(16, 18, 116, 14, {r: 2, f: c});
      for (let i = 0; i < 12; i++) b += G.l(24 + i * 9.5, 32, 24 + i * 9.5, 48);
      b += G.plate(16, 52, 116, 26, 12, 2, {f: c})
        + G.t(74, 94, '96 channels, one stamp', {c: 'lb'})
        + G.t(74, 106, 'the system throughput ceiling', {c: 'sm'});
      const nest = (x, lbl, fill) => G.r(x, 40, 54, 26, {r: 3, f: fill, o: .22})
        + G.t(x + 27, 56, lbl, {c: 'lb'});
      b += nest(154, '4 C', '#0072B2') + nest(214, '42 C', '#D55E00')
        + G.r(274, 40, 34, 26, {r: 3, f: c})
        + G.p('M280 52Q286 46 292 52T304 52', {c: 'mu'})
        + G.r(276, 58, 30, 4, {r: 1, f: 'var(--ink)', o: 1, c: 'fl'})
        + G.t(291, 76, 'shake', {c: 'sm'}) + G.t(291, 86, '+ magnet', {c: 'sm'})
        + G.a(208, 32, 214, 32, {h: 3.5}) + G.t(184, 30, '45 s', {c: 'sm'})
        + G.t(231, 94, 'two fixed nests', {c: 'lb'})
        + G.t(231, 106, 'make heat shock a plate move', {c: 'sm'});
      return b + G.t(160, 126, 'on-deck: the plate never leaves the head to be heated, shaken or held', {c: 'sm'});
    }
  },

  'magniflex': {
    s: c => {
      let b = G.r(40, 20, 250, 10, {r: 2, f: c});
      // two channels close together over a tube, two spread over a plate
      [60, 74].forEach(x => { b += G.l(x, 30, x, 46) + G.p(`M${x - 3} 46H${x + 3}L${x} 56Z`, {c: 'ln'}); });
      [196, 266].forEach(x => { b += G.l(x, 30, x, 54) + G.p(`M${x - 3} 54H${x + 3}L${x} 64Z`, {c: 'ln'}); });
      b += G.p('M50 58H84V86Q67 98 50 86Z', {f: c, o: .22}) + G.t(67, 110, 'from a tube', {c: 'sm'})
        + G.plate(160, 66, 142, 22, 8, 1, {f: c}) + G.t(231, 110, 'into a plate', {c: 'sm'});
      return b + G.a(96, 40, 186, 40, {h: 3.5}) + G.a(186, 40, 96, 40, {h: 3.5})
        + G.t(141, 36, 'spacing 9-445 mm', {c: 'sm'})
        + G.t(160, 128, '2, 4 or 8 independent channels, piston pumps over 5-1000 uL', {c: 'sm'});
    }
  },

  'lynx': {
    s: c => {
      let b = G.r(30, 18, 180, 11, {r: 2, f: c});
      for (let i = 0; i < 8; i++) {
        const x = 42 + i * 22;
        b += G.l(x, 29, x, 40) + G.r(x - 4.5, 40, 9, 9, {r: 1.5, f: c, o: .5})
          + G.l(x, 49, x, 60) + G.dot(x, 64, 1.6);
      }
      b += G.t(120, 104, 'a flow sensor in every channel', {c: 'lb'})
        + G.plate(30, 68, 180, 24, 8, 2, {f: c})
        + G.r(226, 36, 84, 44, {r: 4, c: 'mu'})
        + G.t(268, 52, 'channel 3', {c: 'sm'}) + G.t(268, 66, '1.02 uL', {c: 'lb'})
        + G.p('M292 60L296 64L304 54', {c: 'ln'})
        + G.t(268, 92, 'measured, per channel', {c: 'sm'});
      return b + G.t(160, 126, 'so a normalised plate is measured rather than nominal', {c: 'sm'});
    }
  },

  'thermal': {
    s: c => {
      let b = '';
      [['96', '10-100 uL'], ['96', '10-100 uL'], ['96', '10-100 uL'], ['384', '5-20 uL']].forEach((blk, i) => {
        const x = 14 + i * 77;
        // each block runs its own program
        const pts = [], base = 46;
        for (let k = 0; k <= 12; k++) {
          const u = k / 12;
          const hi = i === 0 ? (k % 2 ? 16 : 0)                       // fast cycling
            : i === 1 ? (k % 4 < 2 ? 15 : 2)                          // long holds
            : i === 2 ? 16 * u                                        // a ramp
            : (k < 2 ? 2 : 14);                                       // hold at one temperature
          pts.push([x + 4 + k * 5, base - hi]);
        }
        b += G.poly(pts, {c: 'mu'})
          + G.r(x, 54, 68, 30, {r: 3, f: c}) + G.l(x, 62, x + 68, 62, {c: 'mu'});
        for (let k = 0; k < 4; k++) b += G.c(x + 12 + k * 15, 73, 4, {c: 'mu'});
        b += G.t(x + 34, 98, blk[0] + '-well', {c: 'lb'}) + G.t(x + 34, 109, blk[1], {c: 'sm'});
      });
      return b + G.t(160, 128, 'four blocks, four independent programs at once', {c: 'sm'});
    }
  },

  'sealpeel': {
    s: c => {
      // apply: foil off a roll, pressed on by a heated head
      let b = G.c(34, 32, 15, {c: 'mu'}) + G.c(34, 32, 5, {c: 'mu'})
        + G.l(49, 32, 92, 32, {c: 'mu'})
        + G.r(58, 36, 70, 12, {r: 2, f: '#D55E00', o: .25}) + G.t(93, 45, 'heat', {c: 'sm'})
        + G.a(93, 52, 93, 60, {h: 3.5})
        + G.plate(58, 62, 70, 22, 6, 2, {f: c})
        + G.t(93, 100, 'PlateLoc', {c: 'lb'}) + G.t(93, 111, 'foil, 30-200 C', {c: 'sm'});
      b += G.a(140, 62, 166, 62);
      // peel: the seal lifted off at an angle
      b += G.plate(192, 62, 70, 22, 6, 2, {f: c})
        + G.p('M192 60H250L286 34', {c: 'ln'})
        + G.p('M286 34Q298 30 300 22', {c: 'mu'})
        + G.t(276, 48, 'seal off', {c: 'sm', a: 'start'})
        + G.t(227, 100, 'XPeel', {c: 'lb'}) + G.t(227, 111, 'up to 200 seals an hour', {c: 'sm'});
      return b + G.t(160, 128, 'Ginkgo gives sealing and peeling a cart each; ours shares one', {c: 'sm'});
    }
  },

  'breathable': {
    s: c => {
      let b = G.r(24, 44, 110, 40, {r: 2, f: c})
        + [0, 1, 2, 3].map(i => G.well(32 + i * 26, 48, 20, 32)
            + G.liq(32 + i * 26, 48, 20, 32, 58, c)).join('')
        + G.l(22, 44, 136, 44, {c: 'ln dash'})
        + G.t(79, 34, 'gas-permeable', {c: 'sm'})
        + G.a(50, 40, 50, 22, {h: 3.5}) + G.a(108, 22, 108, 40, {h: 3.5})
        + G.t(79, 100, 'air moves, 20 h unattended', {c: 'lb'});
      b += G.r(186, 44, 110, 40, {r: 2, f: c})
        + [0, 1, 2, 3].map(i => G.well(194 + i * 26, 48, 20, 32)
            + G.liq(194 + i * 26, 48, 20, 32, 58, c)).join('')
        + G.l(184, 44, 298, 44, {c: 'ln'})
        + G.t(241, 34, 'foil', {c: 'sm'})
        + G.l(234, 12, 248, 26, {c: 'mu'}) + G.l(248, 12, 234, 26, {c: 'mu'})
        + G.t(241, 100, 'anaerobic by morning', {c: 'lb'});
      return b + G.t(160, 124, 'the second sealer is what keeps both rolls resident, with no changeover', {c: 'sm'});
    }
  },

  'spin': {
    s: c => {
      const cx = 96, cy = 62;
      let b = G.c(cx, cy, 46, {c: 'mu'}) + G.c(cx, cy, 7, {f: c, o: .6})
        + G.p(`M${cx - 44} ${cy}L${cx + 44} ${cy}`, {c: 'mu dash'});
      [[-1, -14], [1, 14]].forEach(s => {
        b += G.r(cx + s[0] * 44 - 13, cy - 11, 26, 22, {r: 2, f: c, o: .4});
      });
      b += G.arc(cx, cy, 56, 200, 330, 'var(--muted)', 1.4)
        + G.a(cx + 50, cy - 26, cx + 56, cy - 14, {h: 4})
        + G.t(cx, 124, '2 plates a run, 5000 g, about 20 s to speed', {c: 'sm'});
      // what it leaves behind
      b += G.well(212, 34, 44, 46) + G.liq(212, 34, 44, 46, 46, c)
        + G.p('M218 74Q234 66 250 74Q250 80 244 80H224Q218 80 218 74Z', {f: 'var(--ink)', o: .55, c: 'ln'})
        + G.t(234, 24, 'cell harvest', {c: 'lb'}) + G.t(234, 96, 'pellet, then lysis', {c: 'sm'});

  const VW = 1200, TILE = 74, LBL = 170, GAPV = 26;
  const n = RACS.length;
  const topN = Math.min(4, Math.ceil(n / 5));
  const botN = Math.min(4, Math.max(1, Math.floor((n - topN) / 5)));
  const side = Math.floor((n - topN - botN) / 2);
  const botTotal = botN + (n - topN - botN - 2 * side);

  const trackL = LBL, trackR = VW - LBL - TILE;
  const trackT = 120, trackH = Math.max(1, side) * (TILE + GAPV) - GAPV;
  const trackB = trackT + trackH;
  const yTop = trackT - 58, yBot = trackB + 58;

  const pos = [];
  {
    const span = trackR - trackL;
    for (let i = 0; i < topN; i++)
      pos.push({x: trackL + span * (i + 1) / (topN + 1), y: yTop, at: 'top'});
    for (let i = 0; i < side; i++)
      pos.push({x: trackR, y: trackT + i * (TILE + GAPV), at: 'right'});
    for (let i = 0; i < botTotal; i++)
      pos.push({x: trackR - span * (i + 1) / (botTotal + 1), y: yBot, at: 'bottom'});
    for (let i = side - 1; i >= 0; i--)
      pos.push({x: trackL, y: trackT + i * (TILE + GAPV), at: 'left'});
  }
  const H = yBot + TILE + 62;

  function wrap(text, max) {
    const words = String(text).split(' '), lines = [];
    let cur = '';
    for (const w of words) {
      if ((cur + ' ' + w).trim().length > max && cur) { lines.push(cur); cur = w; }
      else cur = (cur + ' ' + w).trim();
    }
    if (cur) lines.push(cur);
    return lines;
  }

  function sheet() {
    const parts = [];
    parts.push(`<defs><pattern id="gr" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="var(--grid)" stroke-width="0.6"
        opacity="0.55"/></pattern></defs>`);
    parts.push(`<rect width="${VW}" height="${H}" fill="var(--paper)"/>`);
    parts.push(`<rect width="${VW}" height="${H}" fill="url(#gr)"/>`);

    const c = TILE / 2;
    const x0 = trackL + c, x1 = trackR + c, y0 = yTop + c, y1 = yBot + c;
    parts.push(`<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}"
      rx="56" fill="none" stroke="var(--line)" stroke-width="3" opacity="0.9"/>`);

    RACS.forEach((r, i) => {
      const p = pos[i]; if (!p) return;
      const cxp = p.x + TILE / 2, cyp = p.y + TILE / 2;

      let lx, ly, anchor, lines;
      if (p.at === 'left' || p.at === 'right') {
        lines = wrap(r.unitop, 18);
        lx = p.at === 'right' ? p.x + TILE + 16 : p.x - 16;
        anchor = p.at === 'right' ? 'start' : 'end';
        ly = cyp + 4.5 - (lines.length - 1) * 7.5;
      } else {
        lines = wrap(r.unitop, 17);
        lx = cxp; anchor = 'middle';
        ly = p.at === 'top' ? p.y - 12 - (lines.length - 1) * 15 : p.y + TILE + 24;
      }
      const label = lines.map((t, k) =>
        `<text x="${lx}" y="${ly + k * 15}" text-anchor="${anchor}"
           class="cart-l">${esc(t)}</text>`).join('');

      let ix = cxp, iy = cyp;
      if (p.at === 'top') iy = p.y + TILE + 22;
      else if (p.at === 'bottom') iy = p.y - 22;
      else if (p.at === 'left') ix = p.x + TILE + 22;

        </g>${label}${io}</g>`);
    });

    return `<svg viewBox="0 0 ${VW} ${H}" role="img"

      <!-- base -->
      <line x1="${X}" y1="${Y + CH}" x2="${X + CW}" y2="${Y + CH}" stroke="var(--line)"
        stroke-width="1.4"/>
      <circle cx="${X + 16}" cy="${Y + CH + 5}" r="4.5" fill="none" stroke="var(--dim)"/>
      <circle cx="${X + CW - 16}" cy="${Y + CH + 5}" r="4.5" fill="none" stroke="var(--dim)"/>
      <!-- the one real dimension -->
      <line x1="${X - 26}" y1="${Y}" x2="${X - 26}" y2="${Y + CH}" stroke="var(--dim)"
        stroke-width="0.9"/>
      <line x1="${X - 30}" y1="${Y}" x2="${X - 22}" y2="${Y}" stroke="var(--dim)" stroke-width="0.9"/>
      <line x1="${X - 30}" y1="${Y + CH}" x2="${X - 22}" y2="${Y + CH}" stroke="var(--dim)"
        stroke-width="0.9"/>
      <text x="${X - 32}" y="${Y + CH / 2}" text-anchor="middle" class="el-d"
        transform="rotate(-90 ${X - 32} ${Y + CH / 2})">1800 mm</text>
      <text x="${X + CW / 2}" y="${HT - 4}" text-anchor="middle" class="el-l"
        >SCHEMATIC ELEVATION &middot; RAC ${r.n}</text>
    </svg>`;
  }

  const detail = document.getElementById('detail');
  function show(id) {
    const r = RACS.find(x => x.id === id);
    if (!r) {
      detail.innerHTML = `<div class="dbody"><p class="empty">Each cart is named for its unit
        operation rather than its instrument — the way Ginkgo draws its own published
        Application Blueprints, and the altitude that lets someone plan against the machine
        without knowing the model numbers. <b>Click a cart</b> for what it can do, which
        protocols run through it, and a schematic elevation of how it is built.</p></div>`;
      return;
    }
    // One disclosure per instrument. The summary is the name, the vendor and
    // what it is for; opening it gives the spec sheet's own rows as a table
    // and the paragraph underneath, so the detail is there without being in
    // the way. The first is open so a cart never opens onto nothing.
    const insts = r.instruments.map(i => INST[i]).filter(Boolean);
    const specs = insts.map((i, n) => {
      const rows = (i.rows || []).map(s =>
        `<tr><td class="k">${esc(s.label)}</td><td class="v">${esc(s.value)}</td></tr>`
      ).join('');
      return `<details class="dd"${n === 0 ? ' open' : ''}>
        <summary><span>${esc(i.label)}</span>
          <span class="sv">${i.vendor ? esc(i.vendor) : ''}</span>
          <span class="cnt">${rows ? i.rows.length + ' specs' : 'no spec sheet'}</span></summary>
        <div class="ddb">
          ${i.role ? `<p class="prose" style="margin-top:0">${esc(i.role)}</p>` : ''}
          ${rows ? `<table class="kv">${rows}</table>` : ''}
          ${/* The paragraph and the table are the same facts twice over - the
                Bravo's 8 min, 32 min and ~75 protocols are rows above and a
                sentence below. Where there are rows, they are the better form
                and the paragraph is dropped. Where there is no spec sheet the
                paragraph is all there is, so it stays. */ ''}
          ${!rows && i.spec ? `<p class="prose">${esc(i.spec)}</p>` : ''}
          ${rows ? `<a class="more" href="${esc(i.url || '#')}">Full specification sheet &rarr;</a>` : ''}
        </div></details>`;
    }).join('');

    // The protocol list was the longest thing on the sheet. As a table it is
    // three narrow columns and reads at a glance; the phase is a named column
    // rather than a colour you have to decode against the legend.
    const protos = (r.runs || []).map(w => {
      const wf = WF[w], ph = wf && PH[wf.phase];
      return `<tr><td class="id">${esc(w)}</td>
        <td>${esc(wf ? wf.name : w)}</td>
        <td class="ph"><span class="dot" style="background:${ph ? ph.c : 'var(--rule)'}"></span>${
          esc(ph ? ph.label : '—')}</td></tr>`;
    }).join('');
    detail.innerHTML = `
      <div class="ttl"><span>Fraser Lab &middot; UCSF</span>
        <span>Cart detail</span><span class="r">RAC ${r.n}</span></div>
      <div class="dbody">
        <div class="dhd"><h3>${esc(r.unitop)}</h3><span class="no">cart ${r.n}</span></div>
        <div class="classes">${classChips(r)}${r.io
          ? '<span class="cls" style="color:var(--muted);border-color:var(--rule)">hand I/O</span>'
          : ''}</div>
        <p class="lead">${esc(r.note)}</p>
        ${cartFig(r)}
        <table class="kv" style="margin-top:13px">
          <tr><td class="k">Unit operation</td><td class="v">${esc(r.unitop)}</td></tr>
          <tr><td class="k">Cart class</td><td class="v">${esc((r.class || []).join(', ') || '—')}</td></tr>
          <tr><td class="k">On the cart</td><td class="v">${
            insts.length ? insts.map(i => esc(i.label)).join(', ') : '—'}</td></tr>
          <tr><td class="k">Protocols through it</td><td class="v">${
            (r.runs || []).length}${(r.runs || []).length ? ' of ' + B.workflows.length : ''}</td></tr>
          <tr><td class="k">Material by hand</td><td class="v">${
            r.io ? 'Yes — this is where material enters or leaves' : '<em>No — the track feeds it</em>'}</td></tr>
        </table>
        <div class="lbl">What it can do</div>
        ${specs}
        ${protos ? `<details class="dd"><summary><span>Protocols that run through it</span>
            <span class="cnt">${r.runs.length}</span></summary>
          <div class="ddb"><table class="ptab">
            <tr><th class="id">No.</th><th>Protocol</th><th class="ph">Phase</th></tr>
            ${protos}</table></div></details>` : ''}
        <details class="dd"><summary><span>How it is built</span>
          <span class="cnt">elevation</span></summary>
          <div class="ddb"><div class="elev" style="max-width:300px">${elevation(r)}</div></div>
        </details>
      </div>`;
  }
  show(null);

  let sel = null;
  function pick(id) {
    sel = (sel === id) ? null : id;
    document.querySelectorAll('.tile').forEach(t => {
      t.setAttribute('aria-pressed', String(t.dataset.r === sel));
      t.classList.toggle('dim', !!sel && t.dataset.r !== sel);
    });
    show(sel);
  }
  document.getElementById('sheet').addEventListener('click', e => {
    const t = e.target.closest('.tile'); if (t) pick(t.dataset.r);
  });
  document.getElementById('sheet').addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const t = e.target.closest('.tile'); if (t) { e.preventDefault(); pick(t.dataset.r); }
  });

  // ---- phase 2, in its own section ----
  document.getElementById('p2intro').textContent =
    `Four carts the floor plan reserves, all of them driven by crystallography. They are ` +
    `not on the track above because they are not on the track: the room is laid out for ` +
    `them and the system grows from ${RACS.length} carts to ${B.racs.length} when they land.`;

  document.getElementById('p2').innerHTML = PEND.map(r => `
    <article class="p2card">
      <div class="ph">
        <span class="mini"><svg viewBox="0 0 24 24"><path d="${gpath(r.unitop)}"/></svg></span>
        <span><h3>${esc(r.unitop)}</h3><div class="n2">cart ${r.n} &middot; phase 2</div></span>
      </div>
      <p>${esc(r.note)}</p>
      ${cartFig(r)}
      <div class="classes">${classChips(r)}</div>
    </article>`).join('');

  const placed = RACS.reduce((a, r) => a + r.instruments.length, 0);
  document.getElementById('foot').innerHTML =
    `<b>${placed} instruments across ${RACS.length} carts</b>, generated from the same
     <code>_data/protocols.yml</code> that drives the campaign planner — the build fails if an
     instrument is on the capability map and on no cart, or on two. The shape is borrowed from
     Ginkgo's published Application Blueprints, which label a cart by its unit operation rather
     than its instrument; where they have a term for something we have, the term here is theirs.
     <br><br>
     <b>What this is not:</b> a floor plan. Cart order here reads as a workflow loop rather than
     as the physical layout. The real block is 8,338&nbsp;mm long and 3,900&nbsp;mm wide at
     ${RACS.length} carts, 1,800&nbsp;mm high, about 32.5&nbsp;m², and its orientation in room 515
     is forced. The elevation on each cart detail is schematic: the height is the system figure,
     the width is drawn to fit the page.`;
})();
</script>
</body>
</html>
