<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protein Design Foundry</title>
<style>
  /* --muted carries most of the explanatory text on this page. At #8e8e93 on
     white it is 3.26:1, under the 4.5:1 WCAG AA needs for body text. #6e6e73
     is 5.07:1 and passes. It cannot be one value for both themes: #6e6e73 on
     the dark background is only 3.63:1, so dark keeps #8e8e93, which is
     5.64:1 there. */

  /* A visible focus ring on everything keyboard-reachable. The cart tiles are
     SVG <g role=button>, which gets no focus ring at all in Safari, so the
     fifteen of them were invisible to a keyboard user. */
  a:focus-visible, button:focus-visible, summary:focus-visible,
  [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--ink); outline-offset:2px; border-radius:3px}
  .tile:focus{outline:none}
  .tile:focus-visible rect.box{stroke:#fff;stroke-width:3}
  .tile:focus-visible{outline:2px solid #fff;outline-offset:2px}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition-duration:.01ms !important;
      animation-duration:.01ms !important;scroll-behavior:auto !important}
  }

  /* These pages get printed for meetings, and <details> prints collapsed by
     default - which on the blueprint means fifteen headings and no specs. */
  @media print{
    :root{--bg:#fff;--ink:#000;--muted:#333;--rule:#999}
    .path,.next,.skip,.nav{display:none !important}
    details{display:block !important}
    details > *{display:revert !important}
    details .ddb,details .why,details .gitems,.egd .eg{display:block !important}
    .sheet,.elev{background:#fff !important}
    a[href^="http"]::after{content:" (" attr(href) ")";font-size:10px;color:#555}
    section,article,.ty,.head1,.pf,.gi,.wf{break-inside:avoid}
  }

  :root {
    --bg:#fff; --ink:#1d1d1f; --muted:#6e6e73; --rule:#d2d2d7; --tab-bg:#f2f2f4;
    --fillop:0.14;
    --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme=light]){
    --bg:#141416; --ink:#f2f2f4; --muted:#8e8e93; --rule:#3a3a3d; --tab-bg:#242427;
    --fillop:0.24;
  }}
  /* --muted has to flip with the theme and cannot be one value for both:
     #6e6e73 is 5.07:1 on white and 3.63:1 here, #8e8e93 is 5.64:1 here and
     3.26:1 on white. This block exists so the attribute can override the OS
     preference, so it has to carry every token the media query carries. */
  :root[data-theme=dark]{ --bg:#141416; --ink:#f2f2f4; --muted:#8e8e93;
    --rule:#3a3a3d; --tab-bg:#242427; --fillop:0.24; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:1150px;margin:0 auto;padding:0 16px 56px}

  /* ---- hero ---- */
  .hero{padding:40px 0 4px;border-bottom:1px solid var(--rule);margin-bottom:6px}
  h1{font-weight:400;font-size:clamp(26px,4.4vw,44px);margin:0;letter-spacing:-.022em;
     line-height:1.08}
  .hero .sub{font-size:clamp(15px,2.1vw,20px);margin-top:7px;color:var(--muted)}
  .hero .lede{font-size:clamp(15px,1.8vw,17px);line-height:1.5;margin:18px 0 0;max-width:66ch}
  .hero .note{color:var(--muted);font-size:13px;margin:16px 0 20px;
              display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
  .hero .note i{font-style:normal;opacity:.45}
  nav.top{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:22px}
  nav.top a{font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--rule);
            border-radius:999px;padding:5px 13px;transition:border-color .12s,background .12s}
  nav.top a:hover{border-color:var(--ink);background:var(--tab-bg)}

  /* ---- the two halves: the lab, and the design platform ---- */
  .heads{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
  .head1{border:1px solid var(--rule);border-radius:12px;padding:14px 16px 16px}
  .head1 .fig{font-size:clamp(18px,2.5vw,24px);font-weight:500;letter-spacing:-.02em;
              line-height:1.14;text-wrap:balance}
  .head1 h3{font-size:12.5px;font-weight:500;margin:7px 0 0;color:var(--muted)}
  .head1 p{margin:9px 0 0;font-size:12.5px;line-height:1.5;color:var(--muted)}

  /* ---- where numbers live ----
     A figure on this page gets a table, a grid or a graphic. It does not get
     a sentence: a digit inside a paragraph is the hardest thing on the page
     to find, to compare against anything, or to keep current. Prose carries
     the meaning and the table carries the digits, and neither repeats the
     other. */
  /* Capped rather than full-bleed: a label on the left of a 1100px row and
     its figure on the right is a table you have to track across with a
     finger. The cap is what makes the pair readable as a pair. */
  .tscroll{overflow-x:auto;margin:4px 0 0;min-width:0;max-width:620px}
  table.cmp{border-collapse:collapse;font-size:13.5px;min-width:100%}
  table.cmp th,table.cmp td{padding:8px 16px 8px 0;text-align:left;
       border-bottom:1px solid var(--rule)}
  table.cmp tr:last-child td{border-bottom:0}
  table.cmp th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;
       color:var(--muted);font-weight:500}
  table.cmp td.num,table.cmp th.num{text-align:right;padding-right:0;
       font-variant-numeric:tabular-nums}
  table.cmp td.num{font-size:17px;font-weight:500;letter-spacing:-.02em}

  dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 18px;
        font-size:13.5px;margin:4px 0 0;max-width:860px}
  dl.kv dt{color:var(--muted);font-size:11px;text-transform:uppercase;
       letter-spacing:.07em;padding-top:3px;white-space:nowrap}
  dl.kv dd{margin:0;line-height:1.5}

  /* The five experimental types as one strip: a count over a label, in the
     order a campaign runs through them. */
  .funnel{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 0}
  .step{border:1px solid var(--rule);border-top-width:3px;border-radius:9px;
        padding:11px 13px 12px;min-width:104px;flex:1 1 104px}
  .step b{display:block;font-size:21px;font-weight:500;letter-spacing:-.02em;
          font-variant-numeric:tabular-nums;line-height:1.1}
  .step span{display:block;margin-top:3px;font-size:10.5px;text-transform:uppercase;
          letter-spacing:.05em;color:var(--muted)}

  .tag{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;
       border-radius:4px;background:var(--tab-bg);color:var(--muted);align-self:center;
       flex:none}
  .hint.off{border-left:2px solid var(--rule);padding-left:13px;max-width:66ch}
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .pills span{font-size:12px;border:1px solid var(--rule);border-radius:999px;
       padding:3px 10px;color:var(--ink)}
  @media (max-width:460px){ dl.kv{grid-template-columns:1fr;gap:3px 0}
       dl.kv dd{margin-bottom:10px} }

  /* ---- the sign on the door ---- */
  .sign{border:1px solid var(--rule);border-radius:12px;padding:17px 19px 18px;
        display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline}
  .sign .when{font-size:clamp(19px,2.6vw,25px);font-weight:500;letter-spacing:-.02em}
  .sign p{margin:0;flex:1 1 300px;font-size:13px;line-height:1.5;color:var(--muted)}

  /* ---- the four test projects ---- */
  .proofs{display:grid;grid-template-columns:repeat(auto-fit,minmax(242px,1fr));gap:12px}
  .pf{border:1px solid var(--rule);border-radius:12px;padding:13px 15px 14px;
      display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;
      transition:border-color .12s}
  .pf:hover{border-color:var(--ink)}
  .pf h3{font-size:14.5px;font-weight:500;margin:0;letter-spacing:-.008em;line-height:1.3}
  .pf p{margin:0;font-size:12.5px;line-height:1.5;color:var(--muted);flex:1}

  /* ---- section furniture ---- */
  section.band{margin-top:46px;scroll-margin-top:12px}
  .bandhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
            border-bottom:1px solid var(--rule);padding-bottom:7px;margin-bottom:16px}
  .bandhead h2{font-size:21px;font-weight:500;margin:0;letter-spacing:-.012em}
  .bandhead .lede{color:var(--muted);font-size:13px;max-width:60ch;flex:1 1 300px}
  .kicker{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
          font-weight:500;margin-bottom:5px}

  /* ---- the loop diagram ---- */
  .main{display:flex;gap:20px;align-items:flex-start}
  .stage{flex:1;min-width:0}
  /* The loop is 900 units wide and will not shrink below 620px without its
     labels becoming unreadable, so on a narrow screen it scrolls sideways.
     The fault that needs fixing is not the scrolling - it is that a reader
     sees two and a bit stages with nothing saying there are four. The band
     head above says "four stages"; this is the other half, an edge that says
     the figure continues. It appears only when there is something to scroll
     to, so at desktop width it is not there at all. */
  .figwrap{position:relative}
  .scroller{overflow-x:auto;overscroll-behavior-x:contain}
  .scroller:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
  .figwrap::after{content:"";position:absolute;top:0;right:0;bottom:0;width:64px;
    background:linear-gradient(to right,rgba(255,255,255,0),var(--bg) 78%);
    pointer-events:none;opacity:0;transition:opacity .18s}
  .figwrap[data-more="yes"]::after{opacity:1}
  @media (prefers-color-scheme:dark){ :root:not([data-theme=light]) .figwrap::after{
    background:linear-gradient(to right,rgba(20,20,22,0),var(--bg) 78%)} }
  :root[data-theme=dark] .figwrap::after{
    background:linear-gradient(to right,rgba(20,20,22,0),var(--bg) 78%)}
  @media print{ .figwrap::after{display:none} }
  svg#loop{display:block;width:100%;min-width:620px;height:auto;font-family:var(--font)}
  .node:focus{outline:none}
  .node:focus-visible .nodebox{stroke-width:3}
  .nodebox{cursor:pointer;transition:stroke-width .15s}
  .nodebox:hover{stroke-width:2.5}
  .sel .nodebox{stroke-width:3}
  .lbl{font-size:15px;font-weight:500;fill:var(--ink)}
  .slbl{font-size:12.5px;fill:var(--muted)}
  .rlbl{font-size:12.5px;fill:var(--muted)}
  #panel{flex:none;width:330px;border:1px solid var(--rule);border-radius:12px;
         padding:16px 18px 20px;font-size:14px;line-height:1.45;position:sticky;top:12px;
         max-height:calc(100vh - 24px);overflow-y:auto;background:var(--bg)}
  #panel[hidden]{display:none}
  #panel .close{float:right;border:0;background:var(--tab-bg);border-radius:999px;
                width:26px;height:26px;font-size:15px;line-height:1;cursor:pointer;color:var(--ink)}
  #panel h2{font-size:19px;margin:0;font-weight:500}
  #panel .where{font-size:12px;color:var(--muted);margin-top:2px}
  #panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
            font-weight:500;margin:17px 0 6px}
  #panel p{margin:9px 0 0}
  .gate{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;margin-bottom:7px}
  .gate b{font-weight:500}
  .gate .gid{color:var(--muted);font-size:12px;margin-right:5px}
  .gate dl{margin:6px 0 0;font-size:12.5px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
  .gate dt{color:var(--muted)} .gate dd{margin:0}
  .gate .by{color:var(--muted);font-size:11.5px;margin-top:5px}
  ul.plain{list-style:none;padding:0;margin:0}
  ul.plain li{padding:3px 0;display:flex;gap:8px;align-items:baseline}
  .chip{font-size:11px;border:1px solid var(--rule);border-radius:999px;padding:1px 7px;
        color:var(--muted);flex:none}
  .legend{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;font-size:13px;
          margin-top:14px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .sw{width:13px;height:13px;border-radius:3px;border:1px solid}
  .hint{color:var(--muted);font-size:12px;margin-top:10px}

  /* ---- project styles ---- */
  .progs{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:12px}
  .prog{border:1px solid var(--rule);border-radius:12px;padding:0;overflow:hidden;
        display:flex;flex-direction:column;background:var(--bg);text-align:left;
        font:inherit;color:inherit;cursor:pointer;transition:border-color .12s,box-shadow .12s}
  .prog:hover{border-color:var(--ink)}
  .prog[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
  .prog .ph{padding:13px 15px 0}
  .prog h3{font-size:16.5px;font-weight:500;margin:0;letter-spacing:-.008em}
  .prog .psub{color:var(--muted);font-size:12.5px;margin-top:2px}
  /* .areas takes the flex:1 the problem paragraph used to carry, so every
     card's footer still lines up along the bottom of the row. */
  .prog .areas{padding:11px 15px 12px;flex:1;align-content:flex-start}
  .prog .pfoot{padding:9px 15px 12px;border-top:1px solid var(--rule);display:flex;
               flex-wrap:wrap;gap:5px;align-items:center}
  .st{font-size:11px;border-radius:999px;padding:1px 9px;border:1px solid;white-space:nowrap}
  .areas{display:flex;flex-wrap:wrap;gap:5px;padding:0 15px 12px}
  .area{font-size:11.5px;background:var(--tab-bg);border-radius:6px;padding:2px 8px;color:var(--muted)}

  .detail{border:1px solid var(--rule);border-radius:12px;margin-top:14px;padding:17px 19px 19px}
  .detail[hidden]{display:none}
  .detail .dh{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
  .detail .dh h3{font-size:19px;font-weight:500;margin:0}
  .detail .dclose{margin-left:auto;border:0;background:var(--tab-bg);border-radius:999px;
                  width:26px;height:26px;font-size:15px;line-height:1;cursor:pointer;color:var(--ink)}
  .detail .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
               color:var(--muted);margin-top:15px;font-weight:500}
  .detail p{font-size:13.5px;line-height:1.52;margin:5px 0 0}
  .detail .scroll{overflow-x:auto;margin-top:6px}
  .detail svg.lp{display:block;width:100%;min-width:520px;height:auto;font-family:var(--font)}
  .lp-lbl{font-size:12.5px;fill:var(--ink)}
  .lp-arc{font-size:11.5px;fill:var(--muted)}
  .exch{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}
  .exch .box{border:1px solid var(--rule);border-radius:9px;padding:10px 12px}
  .exch .box .lbl{margin-top:0}
  .gbar{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .gpill{font-size:11.5px;border:1px solid var(--rule);border-radius:5px;padding:2px 7px;
         font-variant-numeric:tabular-nums;cursor:help}

  /* The one disclosure style on the page. Everything detailed is behind one
     of these and every one of them is shut until it is asked for. */
  .egd,.disc{margin-top:14px;border-top:1px solid var(--rule);padding-top:9px}
  .egd>summary,.disc>summary{list-style:none;cursor:pointer;font-size:11.5px;
               color:var(--muted);text-transform:uppercase;letter-spacing:.06em;
               display:flex;align-items:center;gap:7px}
  .egd>summary::-webkit-details-marker,
  .disc>summary::-webkit-details-marker{display:none}
  .egd>summary::before,.disc>summary::before{content:"";flex:none;width:6px;height:6px;
       border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);
       transform:rotate(-45deg);transition:transform .15s}
  .egd[open]>summary::before,.disc[open]>summary::before{transform:rotate(45deg)}
  .egd>summary:hover,.disc>summary:hover{color:var(--ink)}
  .disc>summary:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .disc .body{margin-top:12px}

  .aside{border-left:3px solid var(--rule);padding:2px 0 2px 14px;margin-top:18px;
         font-size:13px;line-height:1.52;color:var(--muted);max-width:72ch}
  .aside b{color:var(--ink);font-weight:500}
  .foot{margin-top:46px;border-top:1px solid var(--rule);padding-top:13px;
        font-size:12.5px;color:var(--muted);line-height:1.55}

  @media (max-width:820px){ .exch{grid-template-columns:1fr} }
  @media (max-width:860px){ .main{flex-direction:column} .stage{width:100%;max-width:100%}
       #panel{width:100%;position:static;max-height:none} }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="wrap">
{{PATH}}
<main id="main">

  <div class="hero">
    <h1 id="t"></h1>
    <div class="sub" id="s"></div>
    <p class="lede" id="lede"></p>
    <div class="note" id="n"></div>
    <nav class="top" aria-label="On this page">
      <a href="#what">What it is</a>
      <a href="#goals">Project goals</a>
      <a href="#types">Experimental types</a>
      <a href="#soon">Coming soon</a>
    </nav>
  </div>

  <section class="band" id="what" style="margin-top:34px">
    <div class="bandhead"><h2 id="hd-t"></h2><span class="tag">in build</span>
      <span class="lede" id="hd-lede"></span></div>
    <div class="heads" id="heads"></div>

    <div class="kicker" style="margin-top:28px" id="fx-t"></div>
    <div class="tscroll"><table class="cmp" id="fx"></table></div>
    <div class="hint off" style="margin-top:12px" id="fx-note"></div>

    <div class="kicker" style="margin-top:30px" id="stage-lede"></div>
    <div class="main">
      <div class="stage">
        <div class="figwrap">
          <div class="scroller" id="scroller">
            <svg id="loop" viewBox="0 0 900 250" role="img" aria-label="The foundry design-test loop"></svg>
          </div>
        </div>
        <div class="legend" id="legend"></div>
        <div class="hint">Every result goes back into the models. Failures included &mdash; most designs fail,
          and a failure that was measured is worth more than a design that was never made.</div>
      </div>
      <aside id="panel" hidden><button class="close" aria-label="Close">&times;</button><div id="pc"></div></aside>
    </div>
  </section>

  <section class="band" id="goals">
    <div class="bandhead"><h2>Project goals</h2>
      <span class="lede" id="pr-lede"></span></div>
    <div class="progs" id="progs"></div>
    <div class="detail" id="pdetail" hidden></div>
    <div class="aside" id="pr-aside"></div>

    <details class="disc">
      <summary id="pf-t"></summary>
      <div class="body">
        <p class="hint" style="margin:0 0 12px" id="pf-lede"></p>
        <div class="proofs" id="proofs"></div>
      </div>
    </details>
  </section>

  <section class="band" id="types">
    <div class="bandhead"><h2 id="ty-t"></h2>
      <span class="lede" id="ty-lede"></span></div>
    <div class="funnel" id="tys"></div>
    <div class="hint off" style="margin-top:14px" id="ty-note"></div>
    <dl class="kv" id="ty-kv" style="margin-top:18px"></dl>
  </section>

  <section class="band" id="soon">
    <div class="bandhead"><h2 id="sn-t"></h2><span class="tag">tentative</span></div>
    <div class="sign">
      <span class="when" id="sn-when"></span>
      <p id="sn-say"></p>
    </div>
  </section>

  {{NEXT}}
</main>
  <div class="foot" id="foot"></div>
</div>

<script src="data.js"></script>
<script>
(() => {
  const F = window.FOUNDRY, S = F.stages;
  const WHERE = {
    compute:  {c:'#0072B2', label:'yours to build'},
    rac:      {c:'#009E73', label:'on the Ginkgo'},
    offrac:   {c:'#999999', label:'off the rack'}
  };
  const esc = t => String(t).replace(/[&<>"]/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  // A count the build did not produce shows as a dash, not as the word
  // undefined, which is what a missing key would otherwise print into a cell.
  const num = v => (v == null ? '\u2014' : v);
  const PFC = {running: '#009E73', proposed: '#0072B2'};
  const PH = {}; (F.phases || []).forEach(p => { PH[p.id] = p; });
  const LOOPS = {}; (F.loops || []).forEach(l => { LOOPS[l.id] = l; });
  const ROUTES = {}; (F.routes || []).forEach(r => { ROUTES[r.id] = r; });

  document.getElementById('t').textContent = F.title;
  document.getElementById('s').textContent = F.subtitle;
  document.getElementById('lede').textContent = F.programmes.lede;
  document.getElementById('n').innerHTML = F.note.split('·').map(x => esc(x.trim()))
    .join('<i>·</i>');

  // ===================== what it is, in two halves =====================
  // The only figure on this page is the cart count, and it is not written
  // down anywhere: an item carrying `count` names a value the build computed
  // off _data/, so the number cannot disagree with the data it came from.
  // Nothing planned, modelled, or arithmetic over hardware that is not
  // installed goes on this page - see the comment above `what:` in
  // _data/stages.yml for why.
  const HD = F.what;
  document.getElementById('hd-t').textContent = HD.title;
  document.getElementById('hd-lede').textContent = HD.lede;
  document.getElementById('heads').innerHTML = HD.halves.map(h =>
    `<div class="head1"><div class="fig">${esc(h.fig)}</div>
      <h3>${esc(h.name)}</h3>
      <p>${esc(h.say)}</p></div>`).join('');

  // Every figure in this section, in one table with the digits in a column of
  // their own. Nothing here is typed into stages.yml: each row names a count
  // the build worked out from _data/, so a row cannot disagree with its data.
  const FX = F.facts;
  document.getElementById('fx-t').textContent = FX.title;
  document.getElementById('fx-note').textContent = FX.note;
  document.getElementById('fx').innerHTML =
    `<thead><tr><th>${esc(FX.head)}</th><th class="num">${esc(FX.headn)}</th></tr></thead>`
    + `<tbody>${FX.rows.map(r => `<tr><td>${esc(r.k)}</td>`
        + `<td class="num">${esc(num(F.counts[r.count]))}</td></tr>`).join('')}</tbody>`;

  // ==================== the four test projects ========================
  // The evidence under the goals, shut by default. Each card is the short
  // form of a page that already exists on the site, so it links to that page
  // rather than restating it.
  const PF = F.proof;
  document.getElementById('pf-t').textContent = PF.title + ' · ' + PF.items.length;
  document.getElementById('pf-lede').textContent = PF.lede;
  document.getElementById('proofs').innerHTML = PF.items.map(x => {
    const c = PFC[x.status] || 'var(--muted)';
    return `<a class="pf" href="${esc(F.site)}/projects/${esc(x.id)}/">
      <h3>${esc(x.name)}</h3><p>${esc(x.say)}</p>
      <span class="st" style="color:${c};border-color:${c};align-self:flex-start"
        >${esc(x.status)}</span></a>`;
  }).join('');

  // =========================== the loop ===============================
  const svg = document.getElementById('loop');
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a) => { const e = document.createElementNS(NS, n);
    for (const k in a) e.setAttribute(k, a[k]); return e; };

  const W = 170, H = 64, Y = 58, N = S.length;
  const GAP = (820 - N * W) / (N - 1);
  const xOf = i => 40 + i * (W + GAP);

  svg.appendChild((() => { const d = el('defs');
    const m = el('marker', {id:'ar', viewBox:'0 0 10 10', refX:'8', refY:'5',
      markerWidth:'7', markerHeight:'7', orient:'auto-start-reverse'});
    m.appendChild(el('path', {d:'M2 1L8 5L2 9', fill:'none', stroke:'var(--muted)',
      'stroke-width':'1.6', 'stroke-linecap':'round', 'stroke-linejoin':'round'}));
    d.appendChild(m); return d; })());

  S.forEach((st, i) => {
    const x = xOf(i), col = WHERE[st.where].c;
    const g = el('g', {class:'node', tabindex:'0', role:'button',
      'aria-label':st.label, 'data-id':st.id});
    g.appendChild(el('rect', {x, y:Y, width:W, height:H, rx:10, class:'nodebox',
      fill:col, 'fill-opacity':'var(--fillop)', stroke:col, 'stroke-width':'1.2'}));
    const tx = x + W / 2;
    const t1 = el('text', {x:tx, y:Y + 26, 'text-anchor':'middle', class:'lbl'});
    t1.textContent = st.label; g.appendChild(t1);
    const t2 = el('text', {x:tx, y:Y + 46, 'text-anchor':'middle', class:'slbl'});
    t2.textContent = st.sub; g.appendChild(t2);
    const t3 = el('text', {x:tx, y:Y + H + 20, 'text-anchor':'middle', class:'rlbl'});
    t3.textContent = st.gates.join(' · '); g.appendChild(t3);
    g.addEventListener('click', () => openStage(st.id));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ')
      { e.preventDefault(); openStage(st.id); } });
    svg.appendChild(g);
    if (i < N - 1) svg.appendChild(el('line', {x1:x + W + 7, y1:Y + H / 2,
      x2:x + W + GAP - 7, y2:Y + H / 2, stroke:'var(--muted)', 'stroke-width':'1.4',
      'marker-end':'url(#ar)'}));
  });

  const cx0 = xOf(0) + W / 2, cxN = xOf(N - 1) + W / 2, by = Y + H + 46;
  svg.appendChild(el('path', {d:`M${cxN} ${Y + H + 28} L${cxN} ${by} L${cx0} ${by} L${cx0} ${Y + H + 30}`,
    fill:'none', stroke:'var(--muted)', 'stroke-width':'1.4', 'marker-end':'url(#ar)'}));
  const rtx = el('text', {x:450, y:by + 26, 'text-anchor':'middle', class:'rlbl'});
  rtx.textContent = 'every result goes back into the models, failures included';
  svg.appendChild(rtx);

  // Does the figure continue past the right edge, and has the reader got
  // there yet? Both answers come from the scroller, so neither can go stale.
  // The fade is one half of the affordance; the other half is that a keyboard
  // reaches the figure at all, which a plain overflow box does not give you.
  // Both are attached only while there is something to scroll, so a desktop
  // reader does not tab into a box that cannot move.
  document.getElementById('stage-lede').textContent =
    `How the two halves meet · click a stage`;

  const scroller = document.getElementById('scroller');
  const figwrap = document.querySelector('.figwrap');
  function scrollState() {
    if (!scroller || !figwrap) return;
    const slack = scroller.scrollWidth - scroller.clientWidth;
    const more = slack - scroller.scrollLeft > 2;
    figwrap.dataset.more = more ? 'yes' : 'no';
    if (slack > 2) {
      scroller.setAttribute('tabindex', '0');
      scroller.setAttribute('role', 'group');
      scroller.setAttribute('aria-label',
        `The design-test loop, ${S.length} stages. Scrolls sideways.`);
    } else {
      scroller.removeAttribute('tabindex');
      scroller.removeAttribute('role');
      scroller.removeAttribute('aria-label');
    }
  }
  scroller.addEventListener('scroll', scrollState, {passive: true});
  window.addEventListener('resize', scrollState);
  scrollState();

  document.getElementById('legend').innerHTML = Object.values(WHERE).map(w =>
    `<span><i class="sw" style="background:${w.c};border-color:${w.c};opacity:.65"></i>${w.label}</span>`).join('');

  const panel = document.getElementById('panel'), pc = document.getElementById('pc');
  panel.querySelector('.close').addEventListener('click', () => {
    panel.hidden = true;
    document.querySelectorAll('#loop .node').forEach(n => n.classList.remove('sel'));
  });

  function openStage(id) {
    const st = S.find(s => s.id === id);
    document.querySelectorAll('#loop .node').forEach(n =>
      n.classList.toggle('sel', n.dataset.id === id));
    const gates = st.gates.map(gid => {
      const g = F.gates[gid]; if (!g) return '';
      return `<div class="gate"><b><span class="gid">${esc(gid)}</span>${esc(g.name)}</b>
        <dl><dt>pass</dt><dd>${esc(g.pass)}</dd>
            <dt>fail</dt><dd>${esc(g.fail)}</dd>
            <dt>unclear</dt><dd>${esc(g.ambiguous)}</dd></dl>
        <div class="by">decided by ${esc(String(g.by).replace(/_/g, ' '))}</div></div>`;
    }).join('');
    const protos = st.protocols.map(p =>
      `<li><span class="chip">${esc(p.status)}</span>${esc(p.id)}</li>`).join('');
    pc.innerHTML = `<h2>${esc(st.label)}</h2>
      <div class="where">${esc(WHERE[st.where].label)} &middot; ${esc(st.instruments.join(', '))}</div>
      <p>${esc(st.body)}</p>
      <h3>What decides here</h3>${gates}
      <h3>Protocols</h3><ul class="plain">${protos}</ul>`;
    // The "still being settled" list that used to render here came off this
    // page with the data behind it; the questions live in stages.yml.
    panel.hidden = false;
  }

  // ======================= project styles =============================
  const PR = F.programmes.programmes;
  const STYLE = {
    'running':          {c:'#009E73'},
    'taking proposals': {c:'#0072B2'},
    'phase 2':          {c:'#8e8e93'}
  };
  document.getElementById('pr-lede').textContent =
    'The areas each kind of project targets. Click one for what it solves '
    + 'and what you get back.';

  document.getElementById('progs').innerHTML = PR.map(p => {
    const st = STYLE[p.status] || {c:'var(--muted)'};
    return `<button class="prog" type="button" aria-pressed="false" data-p="${esc(p.id)}">
      <div class="ph"><h3>${esc(p.name)}</h3><div class="psub">${esc(p.sub)}</div></div>
      <div class="areas">${p.areas.map(a => `<span class="area">${esc(a)}</span>`).join('')}</div>
      <div class="pfoot">
        <span class="st" style="color:${st.c};border-color:${st.c}">${esc(p.status)}</span>
        <span class="area">${esc(LOOPS[p.loop] ? LOOPS[p.loop].name : p.loop)}</span>
        <span class="area">closes in ${esc(LOOPS[p.loop] ? LOOPS[p.loop].closes : '—')}</span>
      </div></button>`;
  }).join('');

  function loopSvg(lp) {
    const n = lp.steps.length, VW = 820, PAD = 8;
    const gap = 16, W2 = (VW - PAD * 2 - gap * (n - 1)) / n, H2 = 40, Y2 = 8;
    const mk = 'lpar-' + lp.id, parts = [];
    lp.steps.forEach((st, i) => {
      const x = PAD + i * (W2 + gap), c = WHERE[st.where].c;
      parts.push(`<rect x="${x}" y="${Y2}" width="${W2}" height="${H2}" rx="8" fill="${c}"
        fill-opacity="var(--fillop)" stroke="${c}" stroke-width="1.2"/>`);
      parts.push(`<text x="${x + W2 / 2}" y="${Y2 + H2 / 2 + 4.5}" text-anchor="middle"
        class="lp-lbl">${esc(st.label)}</text>`);
      if (i < n - 1) parts.push(`<line x1="${x + W2 + 3}" y1="${Y2 + H2 / 2}"
        x2="${x + W2 + gap - 3}" y2="${Y2 + H2 / 2}" stroke="var(--muted)" stroke-width="1.3"
        marker-end="url(#${mk})"/>`);
    });
    const x0 = PAD + W2 / 2, xN = PAD + (n - 1) * (W2 + gap) + W2 / 2, byy = Y2 + H2 + 22;
    parts.push(`<path d="M${xN} ${Y2 + H2 + 2} L${xN} ${byy} L${x0} ${byy} L${x0} ${Y2 + H2 + 4}"
      fill="none" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#${mk})"/>`);
    parts.push(`<text x="${VW / 2}" y="${byy + 15}" text-anchor="middle" class="lp-arc"
      >closes in ${esc(lp.closes)}</text>`);
    return `<svg class="lp" viewBox="0 0 ${VW} ${byy + 22}" role="img"
      aria-label="${esc(lp.name)}, closes in ${esc(lp.closes)}">
      <defs><marker id="${mk}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7"
        markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none"
        stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"
        stroke-linejoin="round"/></marker></defs>${parts.join('')}</svg>`;
  }

  const pd = document.getElementById('pdetail');
  let psel = null;
  function showProg(id) {
    psel = (psel === id) ? null : id;
    document.querySelectorAll('.prog').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.p === psel)));
    if (!psel) { pd.hidden = true; return; }
    const p = PR.find(x => x.id === psel), lp = LOOPS[p.loop], rt = ROUTES[p.route];
    const st = STYLE[p.status] || {c:'var(--muted)'};
    const gates = (p.gates || []).map(g => {
      const G = F.gates[g];
      return `<span class="gpill" title="${esc(G ? G.name : g)}">${esc(g)} ${esc(G ? G.name : '')}</span>`;
    }).join('');
    const steps = rt ? rt.steps.map(s => {
      const w = F.wf[s], c = w && PH[w.phase] ? PH[w.phase].c : 'var(--rule)';
      return `<span class="gpill" style="border-color:${c}">${esc(w ? w.short : s)}</span>`;
    }).join('') : '';
    pd.hidden = false;
    pd.innerHTML = `
      <div class="dh"><h3>${esc(p.name)}</h3>
        <span class="st" style="color:${st.c};border-color:${st.c}">${esc(p.status)}</span>
        <button class="dclose" aria-label="Close">&times;</button></div>
      <div class="lbl">The problem</div><p>${esc(p.problem)}</p>
      <div class="lbl">How it is targeted</div><p>${esc(p.strategy)}</p>
      <div class="lbl">The loop it runs &middot; ${esc(lp.name)}</div>
      <div class="scroll">${loopSvg(lp)}</div>
      <p style="color:var(--muted)">${esc(lp.returns)}</p>
      ${steps ? `<div class="lbl">Protocols, in order &middot; ${esc(rt.name)}</div>
        <div class="gbar">${steps}</div>
        <p style="color:var(--muted);font-size:12.5px">${esc(rt.sub)} &mdash;
        <a href="workflows.html#${esc(rt.id)}" style="color:var(--ink)">plan it as a campaign &rarr;</a></p>` : ''}
      <div class="lbl">What it decides</div><div class="gbar">${gates}</div>
      <div class="lbl">The exchange</div>
      <div class="exch">
        <div class="box"><div class="lbl">You hand over</div><p>${esc(p.bring)}</p></div>
        <div class="box"><div class="lbl">You get back</div><p>${esc(p.back)}</p></div>
      </div>`;
    pd.querySelector('.dclose').addEventListener('click', () => showProg(psel));
    pd.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  document.getElementById('progs').addEventListener('click', e => {
    const b = e.target.closest('.prog'); if (b) showProg(b.dataset.p);
  });

  const A = F.programmes.aside;
  document.getElementById('pr-aside').innerHTML = `<b>${esc(A.title)}.</b> ${esc(A.lead)}`
    + `<div class="pills">${A.answers.map(x => `<span>${esc(x)}</span>`).join('')}</div>`;

  // ===================== experimental types ===========================
  // The five categories come from phases: in _data/protocols.yml - label and
  // colour included - so this page cannot invent a sixth or rename one. Only
  // the sentence under each comes from stages.yml, and the count beside it is
  // counted off the protocols the site actually holds.
  const TY = F.types;
  document.getElementById('ty-t').textContent = TY.title;
  document.getElementById('ty-lede').textContent = TY.lede;
  document.getElementById('ty-note').textContent = TY.note;
  // The strip carries the counts, in the order a campaign runs through them.
  // The grid underneath carries what each category asks. Neither repeats the
  // other, so a reader comparing counts never reads a paragraph to do it.
  document.getElementById('tys').innerHTML = (F.phases || []).map(ph =>
    `<div class="step" style="border-top-color:${ph.c}">
      <b style="color:${ph.c}">${esc(num(F.counts['phase_' + ph.id]))}</b>
      <span>${esc(ph.label)}</span></div>`).join('');
  document.getElementById('ty-kv').innerHTML = (F.phases || []).map(ph =>
    `<dt>${esc(ph.label)}</dt><dd>${esc(TY.say[ph.id] || '')}</dd>`).join('');

  // ========================= the sign on the door =====================
  const SN = F.soon;
  document.getElementById('sn-t').textContent = SN.title;
  document.getElementById('sn-when').textContent = SN.when;
  document.getElementById('sn-say').textContent = SN.say;

  // No link here. The strip at the top of the page already goes to all three
  // of the others, and this line used to add a third route to one of them.
  document.getElementById('foot').textContent =
    'Generated from the same data as the rest of the site, so a number '
    + 'changes in one place.';
})();
</script>
</body>
</html>
