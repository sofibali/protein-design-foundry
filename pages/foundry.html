<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundry Loop</title>
<style>
  :root {
    --bg:#fff; --ink:#1d1d1f; --muted:#8e8e93; --rule:#d2d2d7; --tab-bg:#f2f2f4;
    --fillop:0.14;
    --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme=light]){
    --bg:#141416; --ink:#f2f2f4; --muted:#8e8e93; --rule:#3a3a3d; --tab-bg:#242427;
    --fillop:0.24;
  }}
  :root[data-theme=dark]{ --bg:#141416; --ink:#f2f2f4; --rule:#3a3a3d; --tab-bg:#242427; --fillop:0.24; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:1200px;margin:0 auto;padding:24px 16px 40px}
  header{text-align:center;margin-bottom:6px}
  h1{font-weight:400;font-size:clamp(22px,3vw,34px);margin:0;letter-spacing:-.01em}
  .sub{font-size:clamp(15px,2vw,19px);margin-top:3px;color:var(--ink)}
  .note{color:var(--muted);font-size:13px;margin-top:6px}

  .main{display:flex;gap:20px;align-items:flex-start;margin-top:22px}
  .stage{flex:1;min-width:0;overflow-x:auto}
  svg#loop{display:block;width:100%;min-width:620px;height:auto;font-family:var(--font)}
  .node:focus{outline:none}
  .node:focus-visible .nodebox{stroke-width:3}
  .nodebox{cursor:pointer;transition:stroke-width .15s}
  .nodebox:hover{stroke-width:2.5}
  .sel .nodebox{stroke-width:3}
  .lbl{font-size:15px;font-weight:500;fill:var(--ink)}
  .slbl{font-size:12.5px;fill:var(--muted)}
  .rlbl{font-size:12.5px;fill:var(--muted)}

  #panel{flex:none;width:330px;border:1px solid var(--rule);border-radius:12px;
         padding:16px 18px 20px;font-size:14px;line-height:1.45;position:sticky;top:12px;
         max-height:calc(100vh - 24px);overflow-y:auto;background:var(--bg)}
  #panel[hidden]{display:none}
  #panel .close{float:right;border:0;background:var(--tab-bg);border-radius:999px;
                width:26px;height:26px;font-size:15px;line-height:1;cursor:pointer;color:var(--ink)}
  #panel h2{font-size:19px;margin:0;font-weight:500}
  #panel .where{font-size:12px;color:var(--muted);margin-top:2px}
  #panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
            font-weight:500;margin:17px 0 6px}
  #panel p{margin:9px 0 0}
  .gate{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;margin-bottom:7px}
  .gate b{font-weight:500}
  .gate .gid{color:var(--muted);font-size:12px;margin-right:5px}
  .gate dl{margin:6px 0 0;font-size:12.5px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
  .gate dt{color:var(--muted)} .gate dd{margin:0}
  .gate .by{color:var(--muted);font-size:11.5px;margin-top:5px}
  ul.plain{list-style:none;padding:0;margin:0}
  ul.plain li{padding:3px 0;display:flex;gap:8px;align-items:baseline}
  .chip{font-size:11px;border:1px solid var(--rule);border-radius:999px;padding:1px 7px;color:var(--muted);flex:none}
  .open li{padding:4px 0;color:var(--ink)}
  .legend{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:center;
          align-items:center;font-size:13px;margin-top:16px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .sw{width:13px;height:13px;border-radius:3px;border:1px solid}
  .hint{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}
  .nav{text-align:center;font-size:13px;margin-top:10px}
  .nav a{color:var(--muted)}
  .nav a:hover{color:var(--ink)}
  /* --- the user-facing blocks --- */
  section.band{margin-top:34px}
  .bandhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .bandhead h2{font-size:19px;font-weight:500;margin:0;letter-spacing:-.01em}
  .bandhead .lede{color:var(--muted);font-size:13px;max-width:62ch}
  .checks{display:grid;gap:8px;margin-top:14px}
  .chk{border:1px solid var(--rule);border-radius:10px;padding:0}
  .chk>summary{list-style:none;cursor:pointer;display:grid;
       grid-template-columns:22px minmax(0,1fr) auto;gap:4px 11px;padding:11px 14px;align-items:start}
  .chk>summary::-webkit-details-marker{display:none}
  .chk .box{width:20px;height:20px;border:2px solid var(--rule);border-radius:5px;margin-top:1px;
       display:grid;place-items:center;font-size:13px;color:#fff;transition:background .15s,border-color .15s}
  .chk.on .box{background:#009E73;border-color:#009E73}
  .chk .ask{font-size:14.5px;font-weight:500}
  .chk .need{grid-column:2;color:var(--muted);font-size:13px}
  .chk .more{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;
       align-self:center;white-space:nowrap}
  .chk .why{padding:0 14px 13px 47px;font-size:13px;color:var(--muted);max-width:70ch}
  .chk[open] .more{opacity:.4}
  .score{margin-top:14px;border:1px solid var(--rule);border-radius:10px;padding:13px 15px;
       display:flex;gap:13px;align-items:baseline;flex-wrap:wrap}
  .score .n{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .score .lab{font-weight:500}
  .score .say{color:var(--muted);font-size:13.5px;flex:1 1 320px;min-width:0}
  .twoup{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}
  .kv{display:grid;gap:0}
  .kv .r{display:grid;gap:2px;padding:9px 0;border-top:1px solid var(--rule)}
  .kv .r:first-child{border-top:0}
  .kv .k{font-weight:500;font-size:14px}
  .kv .v{color:var(--muted);font-size:13px}
  .limits{margin-top:12px;display:grid;gap:7px}
  .limits li{color:var(--muted);font-size:13.5px;padding-left:19px;position:relative;list-style:none}
  .limits li::before{content:"\00d7";position:absolute;left:3px;top:-1px;color:#D55E00;font-size:15px}
  .limits ul{margin:0;padding:0}
  @media (max-width:720px){ .twoup{grid-template-columns:1fr} }
  @media (max-width:860px){ .main{flex-direction:column} .stage{width:100%;max-width:100%}
       #panel{width:100%;position:static;max-height:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="t"></h1>
    <div class="sub" id="s"></div>
    <div class="note" id="n"></div>
    <div class="nav"><a href="workflows.html">every protocol as a deck sequence &rarr;</a>
      &nbsp;&middot;&nbsp; <a href="blueprint.html">the system blueprint &rarr;</a>
      &nbsp;&middot;&nbsp; <a href="maps.html">five one-page maps, for presenting &rarr;</a></div>
  </header>

  <section class="band" id="intake-band">
    <div class="bandhead"><h2 id="ik-q"></h2></div>
    <div class="lede" id="ik-note"></div>
    <div class="checks" id="ik-checks"></div>
    <div class="score" id="ik-score"></div>
  </section>

  <section class="band">
    <div class="bandhead"><h2>What happens to it</h2>
      <span class="lede">Click a stage for the decisions made there.</span></div>
  </section>

  <div class="main">
    <div class="stage">
      <svg id="loop" viewBox="0 0 900 250" role="img" aria-label="The foundry design-test loop"></svg>
      <div class="legend" id="legend"></div>
      <div class="hint">Click a stage.</div>
    </div>
    <aside id="panel" hidden><button class="close" aria-label="Close">&times;</button><div id="pc"></div></aside>
  </div>

  <div class="twoup">
    <section class="band"><div class="bandhead"><h2 id="pv-t"></h2></div>
      <div class="kv" id="pv"></div></section>
    <section class="band"><div class="bandhead"><h2 id="rt-t"></h2></div>
      <div class="kv" id="rt"></div></section>
  </div>

  <section class="band">
    <div class="bandhead"><h2 id="lm-t"></h2><span class="lede" id="lm-note"></span></div>
    <div class="limits"><ul id="lm"></ul></div>
  </section>
</div>

<script src="data.js"></script>
<script>
(() => {
  const F = window.FOUNDRY, S = F.stages;
  const WHERE = {
    compute:  {c:'#0072B2', label:'yours to build'},
    rac:      {c:'#009E73', label:'on the Ginkgo'},
    offrac:   {c:'#999999', label:'not there yet'}
  };
  const esc = t => String(t).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

  document.getElementById('t').textContent = F.title;
  document.getElementById('s').textContent = F.subtitle;
  document.getElementById('n').textContent = F.note;

  const svg = document.getElementById('loop');
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a) => { const e = document.createElementNS(NS, n);
    for (const k in a) e.setAttribute(k, a[k]); return e; };

  const W = 170, H = 64, Y = 58, N = S.length;
  const GAP = (820 - N * W) / (N - 1);
  const xOf = i => 40 + i * (W + GAP);

  svg.appendChild((() => { const d = el('defs');
    const m = el('marker', {id:'ar', viewBox:'0 0 10 10', refX:'8', refY:'5',
      markerWidth:'7', markerHeight:'7', orient:'auto-start-reverse'});
    m.appendChild(el('path', {d:'M2 1L8 5L2 9', fill:'none', stroke:'var(--muted)',
      'stroke-width':'1.6', 'stroke-linecap':'round', 'stroke-linejoin':'round'}));
    d.appendChild(m); return d; })());

  S.forEach((st, i) => {
    const x = xOf(i), col = WHERE[st.where].c;
    const g = el('g', {class:'node', tabindex:'0', role:'button',
      'aria-label':st.label, 'data-id':st.id});
    const r = el('rect', {x, y:Y, width:W, height:H, rx:10, class:'nodebox',
      fill:col, 'fill-opacity':'var(--fillop)', stroke:col, 'stroke-width':'1.2'});
    g.appendChild(r);
    const tx = x + W / 2;
    const t1 = el('text', {x:tx, y:Y + 26, 'text-anchor':'middle', class:'lbl'});
    t1.textContent = st.label; g.appendChild(t1);
    const t2 = el('text', {x:tx, y:Y + 46, 'text-anchor':'middle', class:'slbl'});
    t2.textContent = st.sub; g.appendChild(t2);
    const t3 = el('text', {x:tx, y:Y + H + 20, 'text-anchor':'middle', class:'rlbl'});
    t3.textContent = st.gates.join(' · '); g.appendChild(t3);
    g.addEventListener('click', () => open(st.id));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ')
      { e.preventDefault(); open(st.id); } });
    svg.appendChild(g);
    if (i < N - 1) svg.appendChild(el('line', {x1:x + W + 7, y1:Y + H / 2,
      x2:x + W + GAP - 7, y2:Y + H / 2, stroke:'var(--muted)', 'stroke-width':'1.4',
      'marker-end':'url(#ar)'}));
  });

  const cx0 = xOf(0) + W / 2, cxN = xOf(N - 1) + W / 2, by = Y + H + 46;
  svg.appendChild(el('path', {d:`M${cxN} ${Y + H + 28} L${cxN} ${by} L${cx0} ${by} L${cx0} ${Y + H + 30}`,
    fill:'none', stroke:'var(--muted)', 'stroke-width':'1.4', 'marker-end':'url(#ar)'}));
  const rt = el('text', {x:450, y:by + 26, 'text-anchor':'middle', class:'rlbl'});
  rt.textContent = 'every result goes back into the models, failures included';
  svg.appendChild(rt);

  document.getElementById('legend').innerHTML = Object.values(WHERE).map(w =>
    `<span><i class="sw" style="background:${w.c};border-color:${w.c};opacity:.65"></i>${w.label}</span>`).join('');

  const panel = document.getElementById('panel'), pc = document.getElementById('pc');
  panel.querySelector('.close').addEventListener('click', () => {
    panel.hidden = true;
    document.querySelectorAll('#loop .node').forEach(n => n.classList.remove('sel'));
  });

  // ---- intake: the first question a foundry user has ----
  const IK = F.intake;
  document.getElementById('ik-q').textContent = IK.question;
  document.getElementById('ik-note').textContent = IK.note;
  let ticked = new Set();
  try { ticked = new Set(JSON.parse(localStorage.getItem('foundry-intake') || '[]')); } catch (e) {}

  document.getElementById('ik-checks').innerHTML = IK.checks.map(c =>
    `<details class="chk${ticked.has(c.id) ? ' on' : ''}" data-id="${esc(c.id)}">
       <summary>
         <span class="box" role="checkbox" tabindex="0"
               aria-checked="${ticked.has(c.id)}" aria-label="${esc(c.ask)}">&#10003;</span>
         <span class="ask">${esc(c.ask)}</span>
         <span class="more">why</span>
         <span class="need">${esc(c.need)}</span>
       </summary>
       <div class="why">${esc(c.why)}</div>
     </details>`).join('');

  function score() {
    const n = ticked.size, v = IK.verdicts;
    const pick = n === IK.checks.length ? v[0] : n === IK.checks.length - 1 ? v[1] : v[2];
    document.getElementById('ik-score').innerHTML =
      `<span class="n">${n}/${IK.checks.length}</span>
       <span class="lab">${esc(pick.label)}</span>
       <span class="say">${esc(pick.say)}</span>`;
    try { localStorage.setItem('foundry-intake', JSON.stringify([...ticked])); } catch (e) {}
  }
  document.querySelectorAll('.chk .box').forEach(box => {
    const d = box.closest('.chk'), id = d.dataset.id;
    const flip = ev => {
      ev.preventDefault(); ev.stopPropagation();
      ticked.has(id) ? ticked.delete(id) : ticked.add(id);
      d.classList.toggle('on', ticked.has(id));
      box.setAttribute('aria-checked', String(ticked.has(id)));
      score();
    };
    box.addEventListener('click', flip);
    box.addEventListener('keydown', ev => { if (ev.key === ' ' || ev.key === 'Enter') flip(ev); });
  });
  score();

  // ---- what you hand over, what comes back, what it cannot do ----
  const rows = items => items.map(i =>
    `<div class="r"><span class="k">${esc(i.k)}</span><span class="v">${esc(i.v)}</span></div>`).join('');
  document.getElementById('pv-t').textContent = F.provide.title;
  document.getElementById('pv').innerHTML = rows(F.provide.items);
  document.getElementById('rt-t').textContent = F.returns.title;
  document.getElementById('rt').innerHTML = rows(F.returns.items);
  document.getElementById('lm-t').textContent = F.limits.title;
  document.getElementById('lm-note').textContent = F.limits.note || '';
  document.getElementById('lm').innerHTML = F.limits.items.map(x => `<li>${esc(x)}</li>`).join('');

  function open(id) {
    const st = S.find(s => s.id === id);
    document.querySelectorAll('#loop .node').forEach(n =>
      n.classList.toggle('sel', n.dataset.id === id));
    const gates = st.gates.map(gid => {
      const g = F.gates[gid]; if (!g) return '';
      return `<div class="gate"><b><span class="gid">${esc(gid)}</span>${esc(g.name)}</b>
        <dl><dt>pass</dt><dd>${esc(g.pass)}</dd>
            <dt>fail</dt><dd>${esc(g.fail)}</dd>
            <dt>unclear</dt><dd>${esc(g.ambiguous)}</dd></dl>
        <div class="by">decided by ${esc(String(g.by).replace(/_/g, ' '))}</div></div>`;
    }).join('');
    const protos = st.protocols.map(p =>
      `<li><span class="chip">${esc(p.status)}</span>${esc(p.id)}</li>`).join('');
    const open = (st.open || []).map(o => `<li>${esc(o)}</li>`).join('');
    pc.innerHTML = `<h2>${esc(st.label)}</h2>
      <div class="where">${esc(WHERE[st.where].label)} &middot; ${esc(st.instruments.join(', '))}</div>
      <p>${esc(st.body)}</p>
      <h3>What decides here</h3>${gates}
      <h3>Protocols</h3><ul class="plain">${protos}</ul>
      ${open ? `<details><summary style="cursor:pointer;color:var(--muted);font-size:12.5px;
         margin-top:12px">still being settled &middot; ${st.open.length}</summary>
         <ul class="plain open">${open}</ul></details>` : ''}`;
    panel.hidden = false;
  }
})();
</script>
</body>
</html>
