<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.short_name }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/static/css/main.css' | relative_url }}">
</head>
<body>
  <header class="site">
    <a class="brand" href="{{ '/' | relative_url }}">
      <strong>{{ site.short_name }}</strong>
      <span>{{ site.description }}</span>
    </a>
    <nav>
      {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} class="on"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </header>

  <main>{{ content }}</main>

  <footer class="site">
    <p>{{ site.name }}. Built at UCSF Mission Bay.</p>
    <p class="muted">Inventory and decisions are generated from <code>_data/</code>, so a number
    changes in one place. Pricing is deliberately absent: see the cost model.</p>
  </footer>
</body>
</html>
