<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">
<title>How FIDA measures size</title>
<desc>A fluorescent plug travels down a narrow capillary under pressure. Faster flow at the centre than at the walls smears the plug; how much it smears depends on how fast the molecules diffuse sideways. Small molecules diffuse quickly and give a narrow peak at the detector; large ones diffuse slowly and give a broader peak.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8e8e93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="50" y="50" width="520" height="80" rx="8" fill="#8e8e93" fill-opacity="0.12" stroke="#8e8e93" stroke-width="0.5"/>
<g stroke="#8e8e93" stroke-width="1.5" marker-end="url(#a)">
<line x1="62" y1="62" x2="80" y2="62"/><line x1="62" y1="76" x2="98" y2="76"/>
<line x1="62" y1="90" x2="112" y2="90"/><line x1="62" y1="104" x2="98" y2="104"/>
<line x1="62" y1="118" x2="80" y2="118"/></g>
<rect x="215" y="58" width="16" height="64" rx="4" fill="#1D9E75" opacity="0.75"/>
<rect x="330" y="58" width="40" height="64" rx="6" fill="#1D9E75" opacity="0.42"/>
<rect x="440" y="58" width="64" height="64" rx="8" fill="#1D9E75" opacity="0.26"/>
<line x1="524" y1="44" x2="524" y2="136" stroke="#8e8e93" stroke-width="0.5" stroke-dasharray="3 3"/>
<g font-size="12" fill="#8e8e93" text-anchor="middle">
<text x="300" y="152">plug spreads as it travels</text><text x="524" y="152">detector</text>
<text x="220" y="382">small radius, narrow peak</text><text x="500" y="382">larger radius, broader peak</text></g>
<path d="M140 340 Q220 190 300 340" fill="none" stroke="#1D9E75" stroke-width="2"/>
<path d="M380 340 Q500 248 620 340" fill="none" stroke="#D85A30" stroke-width="2"/>
<g stroke="#8e8e93" stroke-width="1.5"><line x1="120" y1="340" x2="320" y2="340"/><line x1="360" y1="340" x2="640" y2="340"/></g>
<g font-size="14" font-weight="500" fill="#1d1d1f" text-anchor="middle">
<text x="220" y="364">free binder</text><text x="500" y="364">bound to target</text></g>
</svg>
