# The four loop stages. One entry per box in the schematic.
# where: compute = yours | rac = on the Ginkgo | offrac = not on the machine yet

title: UCSF Protein Design Foundry
subtitle: Lab-in-the-loop automated protein targeting

# The chips under the title. Split on the middle dot at render time, so keep
# it on one logical line. It used to lead with the install date; it does not
# any more, because a date at the top makes the page read as a countdown
# rather than as what the place is for. "Not open for general submissions
# yet" is the part that has to stay true and visible.
#
# "year 1 · 4 labs" was also here and has been dropped: no file in this
# repository carries that number, so it could not be given a source.
note: >-
  In build at UCSF Mission Bay · not open for general submissions yet

# ---------------------------------------------------------------------------
# Section 1 of the landing page: what the place is, in two halves that only
# work together. The lab half and the design half.
#
# NO NUMBERS HERE ON PURPOSE. The landing page carries a figure only when it
# is a fact about the build as it stands, with its referent beside it. A
# planned library size, a modelled run time, or arithmetic over hardware that
# is not installed yet is not that, and reads to someone outside the project
# as a measurement the foundry cannot have made. The one survivor is the cart
# count, which is what has been quoted and is counted at build time from
# racs: in _data/protocols.yml rather than typed here.
#
# Source for the design half: the `design` stage below (where: compute, "Runs
# on UCSF compute, not on the machine"), gate D0 in _data/gates.yml, which is
# the computational decision to onboard a target at all, and the return arc
# on the loop figure - every result goes back into the models, failures
# included. reference/design-quality-invariants.md is the long form of why
# the measured failures are the valuable part; it is excluded from the build.
what:
  title: What it is
  lede: >-
    Two halves that only work together: a design platform that proposes and
    filters, and an enclosed lab that makes and measures what survives.
  halves:
    - id: lab
      count: carts
      fig: carts, one enclosed system
      name: The automated lab
      say: >-
        Each cart is a sealed micro-environment with its own six-axis arm, on
        a shared transport track. A plate moves from one instrument to the
        next without anyone opening a door, so a run can continue unattended
        overnight.
    - id: design
      fig: The design platform
      name: Designs, before anything is made
      say: >-
        Candidates are generated and scored computationally, and only what
        survives that filter is ever made. What comes back off the plates -
        the failures as much as the hits - goes into the next round, so each
        round is designed from what the last one actually did.

# ---------------------------------------------------------------------------
# The first projects, shown inside section 2 behind a shut disclosure rather
# than as a band of their own. They are the evidence under the goals above:
# each one exists to prove a capability.
#
# Source: the front matter of the four files in _projects/, which are already
# published at /projects/. name, status and say are the title, status and
# summary from there, so nothing in this block is a new claim. If a project
# changes, change it in _projects/ first; this is the landing page's index of
# that list, not a second copy of it.
proof:
  title: Four projects that test it
  lede: >-
    The first projects are here to prove a capability rather than to be the
    science. Each one is a claim the build has to survive.
  items:
    - id: parp14-binders
      name: Designed binders against PARP14 MD1
      status: running
      say: >-
        Library design through assay readout as one unbroken run, on both
        expression routes.
    - id: md1-thermal
      name: Thermal survival of MD1 under heat lysis
      status: running
      say: >-
        Whether the target survives the only lysis route the system can
        actually deliver.
    - id: g4fp
      name: G4FP sensors
      status: proposed
      say: >-
        A second, independent readout, to keep the system from being tuned to
        one assay format.
    - id: crystallography
      name: Automated crystallography and fragment soaking
      status: proposed
      say: >-
        The workflow that drives the most hardware decisions and is the least
        automated of them.

stages:

  - id: design
    label: Design
    sub: models propose
    where: compute
    body: >
      More than 1,000 candidates per target from RFdiffusion, ProteinMPNN and
      BindCraft, rescored with Boltz and filtered by the expression model.
      Runs on UCSF compute, not on the machine.
    gates: [D0]
    protocols:
      - {id: intake.target.rank, status: draft}
      - {id: campaign.design.bindcraft, status: draft}
    instruments: [UCSF GPU server]
    open:
      - Which filters actually predicted measured outcomes?

  - id: express
    label: Express
    sub: make protein
    where: rac
    body: >
      Cell-free and E. coli in parallel, optimised by fractional-factorial
      screen then Bayesian optimisation. Magnetic-bead purification, then a
      quality gate before anything reaches an assay. Transformation and
      plating run on the deck; colony picking does not.
    gates: [D1, D2]
    protocols:
      - {id: express.cfps.doe, status: draft}
      - {id: express.ecoli.autoinduction96, status: planned}
      - {id: express.cfps.production96, status: planned}
      - {id: purify.imac.magbead96, status: planned}
      - {id: qc.protein.plate96, status: planned}
    instruments: [Echo 655, MultiFlo, ATC 3x96 + 1x384, Bravo 96 + magnet, BioShake,
                  Cytomat 2, HiG 3, Magniflex, Lynx LM900 VVP, PHERAstar FSX,
                  SteriStore D 37 C, SteriStore D 4 C, MicroServe]
    open:
      - >-
        Whether a second thermal cycling block should be 384-well rather than
        96. Swapping one keeps four blocks and takes retrieval PCR for a
        1,152-design set from 12 plates to 3, and cycler time from about 10 h
        to 6 h. Two 96-well blocks stay either way: they take 10-100 uL,
        where the 384 block takes 5-20 uL.
      - >-
        Yeast at 30 C is inside the Cytomat's range - the C-LiN series runs to
        50 C and the unit has to reach 37 C for E. coli anyway - so a third
        expression route costs no hardware. What is worth a growth curve is
        the 1-3 mm shaking orbit, a mammalian-suspension spec; published
        deep-well microbial protocols use 25 mm and the Selector offers it.
      - >-
        Eukaryotic cell-free (ALiCE) wants 25 C, shaking, 36 h, 85% RH.
        Humidity is covered - the SteriStore D runs to 98% RH - but it is
        static. The Cytomat shakes, and its floor is ambient +4 C, so a 25 C
        setpoint needs the room held at 21 C or below. That is a room
        specification rather than an instrument one.
      - No optics on any ATC, so DSF melt curves need separate hardware.

  - id: test
    label: Test
    sub: does it bind?
    where: rac
    body: >
      Assay window proven before any design batch is committed. Primary screen
      against an on-plate counter-target, dose-response on the primaries, then
      a selectivity screen that tests whether the binder hit the face it was
      designed for.
    gates: [D3, D4, D5, D6]
    protocols:
      - {id: assay.htrf.window384, status: draft}
      - {id: bind.cf2h.screen, status: draft}
      - {id: build.library.assemble, status: planned}
      - {id: test.binding.htrf384, status: planned}
      - {id: test.binding.dose384, status: planned}
      - {id: test.selectivity.counter384, status: planned}
    instruments: [PHERAstar FSX, Echo 655, Bravo 96 + magnet, MultiFlo, PlateLoc,
                  AmbiStore D, SteriStore D 4 C, MicroServe]
    open:
      - A UV laser for the PHERAstar is an option not taken yet. It would widen
        the HTRF dynamic range.
      - CF2H would answer D1 and D4 in one well with no purified protein,
        but the reporter plasmid, CI cassette and dRecBCD extract are an
        offline build that does not exist yet.

  - id: structure
    label: Structure
    sub: right face?
    where: offrac
    body: >
      Crystallisation screening, co-crystallisation against soaking, and
      comparison of the solved interface to the design model. Runs on Fraser
      lab instruments until the imagers arrive.
    gates: [D7, D8]
    protocols:
      - {id: struct.crystal.screen, status: planned}
    instruments: [Fraser lab, imagers pending, Echo 655 required, a4s lidder, AmbiStore D]
    open:
      - Imagers and automated crystal scoring are not on the system yet, so
        trays are set here and scored by hand.

# ---------------------------------------------------------------------------
# Section 3 of the landing page: the experimental types.
#
# Source: phases: in _data/protocols.yml, which is the list of big categories
# every protocol on the site is filed under. The five ids and labels are
# taken from there and must match it - DO NOT add a sixth or rename one here;
# the page reads the label and the colour out of protocols.yml and only the
# sentence below comes from this file. The count of protocols in each
# category is counted off workflows: in the same file at build time, so it
# cannot go stale either.
types:
  title: Experimental types
  lede: >-
    Every protocol on the site is filed under one of five categories. A
    campaign is a chain through them.
  note: >-
    Counts are the protocols drawn so far, not a limit on what can be added.
  say:
    dna: >-
      Building and amplifying the DNA for a design set, in plate format.
    express: >-
      Making the protein, by growth in cells or by cell-free reaction with no
      growth step at all.
    purify: >-
      Pulling the protein out and asking whether it is good enough to test
      before anything is spent on an assay.
    bind: >-
      Asking whether a design binds its target, how tightly, and whether it
      bound the face it was designed for.
    structure: >-
      Setting crystallisation trays, to ask where a binder actually sits
      rather than only how well it works.

# ---------------------------------------------------------------------------
# Section 4: the sign on the door. One line, and deliberately not a
# countdown. Settled 2026-11-23: the date is not the framing, so it is the
# last thing on the page and nothing is organised around it.
#
# Source for the date: pages/tracker.html (the footer, and the 2027-04-01
# milestone) and reference/capabilities.md, which calls April 2027 the line
# after which anything bought is off-rack. Nothing in either repository says
# April 2026. Marked tentative because an install date is a vendor schedule.
soon:
  title: Coming soon
  when: Tentative — April 2027
  say: >-
    The system is being built and is not open for general submissions yet.
    If you think a workflow belongs here, the most useful thing to send is
    the step list, the plate formats and the volumes, because that is what
    decides whether it fits.

# ---------------------------------------------------------------------------
# NOT ON THE LANDING PAGE since 2026-11-23: fit:, provide: and returns: below.
# They were the "Can the foundry take your project?" band - five questions
# each with a paragraph, a three-level risk scale with nine examples, and two
# five-row tables. That was the largest block of text on the page and the
# page was rebuilt to be read in a minute. The data is kept rather than
# deleted: the exchange and the risk levels are real and the proposal page is
# where they belong, next to the form they are advice for.
#
# A foundry user is a PI or postdoc from one of the
# labs bringing a target; they need to know whether it can be taken, what
# they hand over, and what comes back. Everything below answers one of those.

# The broad questions, from the 19 November session with Jamie. That meeting
# set out to produce one page covering every problem area the foundry could
# take on, and named the fields it needs: the problem statement, the protein
# areas to target, the strategy for targeting them, and a risk level agreed
# with the group that owns the work rather than set centrally. These are those
# fields asked as questions. The fifth is from the same tab's computational
# pipeline thread - where the pipeline fails and at which step - because
# iterative round design is what the machine is for.
fit:
  question: What the foundry needs to know about your project
  note: >-
    Nothing here is scored. If a style above is close to your project, point
    at it.
  asks:
    - id: problem
      q: What is the problem?
      sub: Not the protein - the problem.
      why: >-
        It is what decides whether a binder, a designed enzyme, a family
        screen or a structure is the answer. A project that starts from the
        reagent has usually picked the loop before asking which one fits, and
        the loop is the expensive part to get wrong.
    - id: areas
      q: Which proteins does it come down to?
      sub: A family, a set of paralogs, one domain.
      why: >-
        This is the step between a problem worth solving and something that
        fits in a plate, and it is usually where a broad problem becomes a
        campaign of a knowable size.
    - id: strategy
      q: What is the strategy for targeting them?
      sub: Which of the loops this becomes, or a new one.
      why: >-
        Four loops run here. A strategy that is none of them is not a refusal,
        but it is a protocol-writing project before it is a campaign, and that
        is worth knowing at the start rather than in month three.
    - id: risk
      q: What risk level would we agree on?
      sub: How hard the target is, agreed with you rather than assigned to you.
      why: >-
        This rates the target, not the experiment. The same binder campaign
        runs the same protocols against a well-characterised single domain
        and against a disordered assembly, at very different odds. You know
        your target better than we do, so the level is settled with you, and
        it sets how much gets committed before the first result.
    - id: rounds
      q: Will a failed round inform the next one?
      sub: Where the pipeline fails, and at which step.
      why: >-
        This is the one the foundry needs most. Iterative round design is the
        point of the machine: the model that picks round two is trained on
        round one, failures included. A round that reports only its hits
        leaves the next round no better than the last.
  scale:
    title: The risk levels
    note: >-
      These rate the target, not the campaign. A level is settled with you
      when a project is taken on.
    levels:
      - id: low
        name: Low
        say: >-
          The open question is whether a binder works, not what it binds to.
        eg:
          - A catalytic or binding domain with several deposited structures
          - A well-studied family member that has been expressed before
          - A domain that folds and behaves on its own, away from its partners
      - id: medium
        name: Medium
        say: >-
          Enough is known to design against, and the gap has a name.
        eg:
          - A domain with a confident prediction but no experimental structure
          - A target whose relevant conformation is one of several
          - A shallow or highly charged surface with no obvious pocket
      - id: high
        name: High
        say: >-
          What to bind is still a question, alongside whether a binder will.
        eg:
          - A multi-domain assembly whose interface only forms in context
          - A disordered region at the site of interest
          - A target with no close structural precedent to design from

# How to shape a binder question so it can be screened here. NOT a gate and
# NOT scored - these moved off the landing page on 2026-11-20 because they
# were being read as entry requirements when what they actually are is the
# four things that decide whether a binder campaign returns an interpretable
# answer. Each one says what to do when it is missing. The formal version of
# the same four is gate D0 in gates.yml, which is a decision the foundry makes
# and not a bar the proposer has to clear.
guidance:
  title: Shaping a binder question so it can be screened here
  scope: >-
    Binder design campaigns. The other loops ask different things, and a
    structure or family-screening project should ignore this.
  note: >-
    Nothing here is scored and nothing is a requirement. These are the four
    things that decide whether a campaign comes back with an interpretable
    answer or just a number, and each one has something to do about it if you
    do not have it yet.
  items:
    - id: structure
      t: A structure of the domain you want targeted
      v: Experimental, or predicted at pLDDT 85 or better across the intended face.
      do: >-
        Design works from it, and so does the later check on where a binder
        actually landed. With no experimental structure, predict it and read
        the confidence across the face you mean to target rather than across
        the whole domain - a good average hides exactly the loop that matters.
    - id: hotspot
      t: A hotspot residue that tolerates an alanine substitution
      v: One is enough, and the domain still has to fold without it.
      do: >-
        This is what turns a positive into an interpretable positive. The
        screen mutates that residue and watches the signal drop: without it, a
        binder that found a different face looks identical to one that worked.
        If no residue is obviously mutable, a short stability check on two or
        three candidates is the cheapest thing to run first.
    - id: homolog
      t: A close homolog to put on the plate beside it
      v: It becomes the counter-target, read on the same plate at no extra cost.
      do: >-
        Selectivity is measured against it. With no close homolog, selectivity
        has to come from somewhere else - a more distant family member, a
        point mutant, or an explicit decision that selectivity is not part of
        the question this round. Any of those is fine; leaving it unsaid is
        what causes trouble.
    - id: expression
      t: Evidence the protein, or a near relative, has been expressed
      v: Any system, any scale. A reference will do; a working protocol is better.
      do: >-
        It picks the expression route. With nothing, the first thing that runs
        is an expression arm rather than a binder screen - a real result and a
        cheap one, but it is a round, so it is better to know that going in.

provide:
  title: What you hand over
  items:
    - k: "The target"
      v: "Sequence and structure. We express it, or you send purified protein."
    - k: "One hotspot mutant"
      v: "We make it. You confirm the residue is the one you care about."
    - k: "A close homolog"
      v: "It goes on every plate as the counter-target."
    - k: "Nothing else"
      v: "Designs, constructs, assays, analysis and the data back are ours."

returns:
  title: What comes back
  items:
    - k: "A verdict per design, per gate"
      v: "Pass, fail or unclear. Not a data dump."
    - k: "Measured negatives"
      v: "Kept and returned. Most designs fail, and that is the training data."
    - k: "An affinity, where it is determined"
      v: "K_D from 0.5 to 100 nM. Weaker binders come back as a bound, for maturation."
    - k: "An epitope verdict"
      v: "Whether it engaged the designed face, or a different one."
    - k: "A per-design quality record"
      v: "Yield, aggregation state, and a specificity index comparable across campaigns."

limits:
  title: Limits
  note: Worth knowing before you plan around it.
  items:
    - "No FACS, so no yeast-display selection and no libraries at 10^6 and above."
    - "No kinetics. Endpoint and equilibrium only; k_on and k_off need an instrument the deck does not have."
    - "No milligrams. Plate assays yes, crystallography protein no - that comes from offline expression."
    - "No colony picking, so no clonal isolation from a transformation."
    - "No mammalian or CHO expression."
