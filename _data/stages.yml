# The four loop stages. One entry per box in the schematic.
# where: compute = yours | rac = on the Ginkgo | offrac = not on the machine yet

title: UCSF Protein Design Foundry
subtitle: Lab-in-the-loop automated protein targeting
note: Install April 2027 · year 1 · 4 labs · PARP14 binder campaign

stages:

  - id: design
    label: Design
    sub: models propose
    where: compute
    body: >
      More than 1,000 candidates per target from RFdiffusion, ProteinMPNN and
      BindCraft, rescored with Boltz and filtered by the expression model.
      Runs on UCSF compute, not on the machine.
    gates: [D0]
    protocols:
      - {id: intake.target.rank, status: draft}
      - {id: campaign.design.bindcraft, status: draft}
    instruments: [UCSF GPU server]
    open:
      - Which filters actually predicted measured outcomes?

  - id: express
    label: Express
    sub: make protein
    where: rac
    body: >
      Cell-free and E. coli in parallel, optimised by fractional-factorial
      screen then Bayesian optimisation. Magnetic-bead purification, then a
      quality gate before anything reaches an assay.
      Two things settled since this was written. The four ATCs are
      3 x 96-well + 1 x 384-well, all in one RAC, running four independent
      programs at once; the 96 blocks take 10-100 uL and the 384 block takes
      5-20 uL. And heat shock works: the Bravo carries two
      temperature-controlled deck positions at 4 C and 42 C, so the
      45-second pulse is a plate move between them. Transformation, plating
      and E. coli expression are all in scope on the RAC — colony picking is
      not — and the backbones stand. The ceiling on all of it is the Bravo at
      ~75 two-plate protocols per 20-hour day, tied with the PHERAstar at 150
      384-well TR-FRET plates; a 384 plate costs the Bravo 4x a 96 plate, so
      data/protocols.yml now carries what every workflow costs the day.
    gates: [D1, D2]
    protocols:
      - {id: express.cfps.doe, status: draft}
      - {id: express.ecoli.autoinduction96, status: planned}
      - {id: express.cfps.production96, status: planned}
      - {id: purify.imac.magbead96, status: planned}
      - {id: qc.protein.plate96, status: planned}
    instruments: [Echo 655, MultiFlo, ATC 3x96 + 1x384, Bravo 96 + magnet, BioShake,
                  Cytomat 2, HiG 3, Magniflex, Lynx LM900 VVP, PHERAstar FSX,
                  SteriStore D 37 C, SteriStore D 4 C, MicroServe]
    open:
      - >-
        A second 384-well ATC, in or out - Sofia's call, not an open question
        for Ginkgo. The recommendation on record is to swap a second 96 block
        for a 384, keeping four units, and push retrieval PCR to 384 via the
        Echo: 3 plates instead of 12 for a 1,152-design set, cycler time 10 h
        to 6 h. It is a swap, not a fifth unit, so it should be close to
        price-neutral against the quoted ATC line. Keep two 96 blocks either
        way: they take 10-100 uL and the 384 block takes 5-20 uL.
      - >-
        Yeast at 30 C is inside the Cytomat's range - the C-LiN series runs to
        50 C and the unit has to reach 37 C for E. coli anyway - so a third
        expression route costs no hardware. What is worth a growth curve is
        the 1-3 mm shaking orbit, a mammalian-suspension spec; published
        deep-well microbial protocols use 25 mm and the Selector offers it.
      - >-
        Eukaryotic cell-free (ALiCE) wants 25 C, shaking, 36 h, 85% RH.
        Humidity is covered - the SteriStore D runs to 98% RH - but it is
        static. The Cytomat shakes, and its floor is ambient +4 C, so a 25 C
        setpoint needs the room held at 21 C or below. That is a room
        specification rather than an instrument one.
      - No optics on any ATC, so DSF melt curves need separate hardware.

  - id: test
    label: Test
    sub: does it bind?
    where: rac
    body: >
      Assay window proven before any design batch is committed. Primary screen
      against an on-plate counter-target, dose-response on the primaries, then
      a selectivity screen that tests whether the binder hit the face it was
      designed for.
    gates: [D3, D4, D5, D6]
    protocols:
      - {id: assay.htrf.window384, status: draft}
      - {id: bind.cf2h.screen, status: draft}
      - {id: build.library.assemble, status: planned}
      - {id: test.binding.htrf384, status: planned}
      - {id: test.binding.dose384, status: planned}
      - {id: test.selectivity.counter384, status: planned}
    instruments: [PHERAstar FSX, Echo 655, Bravo 96 + magnet, MultiFlo, PlateLoc,
                  AmbiStore D, SteriStore D 4 C, MicroServe]
    open:
      - The PHERAstar UV TR-FRET laser is a priced option. It buys HTRF dynamic range.
      - CF2H would answer D1 and D4 in one well with no purified protein,
        but the reporter plasmid, CI cassette and dRecBCD extract are an
        offline build that does not exist yet.

  - id: structure
    label: Structure
    sub: right face?
    where: offrac
    body: >
      Crystallisation screening, co-crystallisation against soaking, and
      comparison of the solved interface to the design model. Runs on Fraser
      lab instruments until the imagers arrive.
    gates: [D7, D8]
    protocols:
      - {id: struct.crystal.screen, status: planned}
    instruments: [Fraser lab, imagers pending, Echo 655 required, a4s lidder, AmbiStore D]
    open:
      - Aim 3 cannot run on an Echo 525. The 6XX is a scope decision.
      - Imagers and automated crystal scoring are not yet quoted.

# ---------------------------------------------------------------------------
# The user-facing half. A foundry user is a PI or postdoc from one of the
# labs bringing a target; they need to know whether it can be taken, what
# they hand over, and what comes back. Everything below answers one of those.

# The broad questions, from the 19 November session with Jamie. That meeting
# set out to produce one page covering every problem area the foundry could
# take on, and named the fields it needs: the problem statement, the protein
# areas to target, the strategy for targeting them, and a risk level agreed
# with the group that owns the work rather than set centrally. These are those
# fields asked as questions. The fifth is from the same tab's computational
# pipeline thread - where the pipeline fails and at which step - because
# iterative round design is what the machine is for.
fit:
  question: What the foundry needs to know about your project
  note: >-
    None of this is a test and nothing here is scored. It is the one page the
    19 November session set out to produce, asked as questions. The five
    project styles above are this same page already filled in, so if one of
    them is close to your project you can answer by pointing at it.
  asks:
    - id: problem
      q: What is the problem?
      sub: Not the protein - the problem.
      why: >-
        It is what decides whether a binder, a designed enzyme, a family
        screen or a structure is the answer. A project that starts from the
        reagent has usually picked the loop before asking which one fits, and
        the loop is the expensive part to get wrong.
    - id: areas
      q: Which proteins does it come down to?
      sub: A family, a set of paralogs, one domain.
      why: >-
        The one page calls these the protein areas to target. It is the step
        between a problem worth solving and something that fits in a plate,
        and it is usually where a broad problem becomes a campaign of a
        knowable size.
    - id: strategy
      q: What is the strategy for targeting them?
      sub: Which of the loops this becomes, or a new one.
      why: >-
        Four loops run here. A strategy that is none of them is not a refusal,
        but it is a protocol-writing project before it is a campaign, and that
        is worth knowing at the start rather than in month three.
    - id: risk
      q: What risk level would we agree on?
      sub: Low to high, agreed with you rather than assigned to you.
      why: >-
        The session was explicit that the rating is not set centrally. You
        know what a failed round costs your project and we know what it costs
        the deck. The level is those two together, and it sets how much gets
        committed before the first result comes back.
    - id: rounds
      q: Will a failed round inform the next one?
      sub: Where the pipeline fails, and at which step.
      why: >-
        This is the one the foundry needs most. Iterative round design is the
        point of the machine: the model that picks round two is trained on
        round one, failures included. A round that reports only its hits
        leaves the next round no better than the last.
  scale:
    title: The risk levels
    note: >-
      Indicative, and the one thing on this page that is not settled. Each
      level is agreed with the group that owns the work and none has been
      agreed yet, so read these as what the scale means rather than as a
      rating anyone has signed off.
    levels:
      - id: low
        name: Low
        say: The loop is known to work and the unknowns are in the biology, not the method.
      - id: medium
        name: Medium
        say: The loop works but the hit rate is the question. Expect more than one round.
      - id: high
        name: High
        say: >-
          The method itself is the experiment. Worth doing, and worth saying
          so at the start so a null result reads as information.

# How to shape a binder question so it can be screened here. NOT a gate and
# NOT scored - these moved off the landing page on 2026-11-20 because they
# were being read as entry requirements when what they actually are is the
# four things that decide whether a binder campaign returns an interpretable
# answer. Each one says what to do when it is missing. The formal version of
# the same four is gate D0 in gates.yml, which is a decision the foundry makes
# and not a bar the proposer has to clear.
guidance:
  title: Shaping a binder question so it can be screened here
  scope: >-
    Binder design campaigns. The other loops ask different things, and a
    structure or family-screening project should ignore this.
  note: >-
    Nothing here is scored and nothing is a requirement. These are the four
    things that decide whether a campaign comes back with an interpretable
    answer or just a number, and each one has something to do about it if you
    do not have it yet.
  items:
    - id: structure
      t: A structure of the domain you want targeted
      v: Experimental, or predicted at pLDDT 85 or better across the intended face.
      do: >-
        Design works from it, and so does the later check on where a binder
        actually landed. With no experimental structure, predict it and read
        the confidence across the face you mean to target rather than across
        the whole domain - a good average hides exactly the loop that matters.
    - id: hotspot
      t: A hotspot residue that tolerates an alanine substitution
      v: One is enough, and the domain still has to fold without it.
      do: >-
        This is what turns a positive into an interpretable positive. The
        screen mutates that residue and watches the signal drop, which is how
        a binder is shown to engage the face it was designed for rather than
        some other one - without it, a binder that found a different face
        looks identical to one that worked. If no residue is obviously
        mutable, a short stability check on two or three candidates is the
        cheapest thing to run first.
    - id: homolog
      t: A close homolog to put on the plate beside it
      v: It becomes the counter-target, read on the same plate at no extra cost.
      do: >-
        Selectivity is measured against it. With no close homolog, selectivity
        has to come from somewhere else - a more distant family member, a
        point mutant, or an explicit decision that selectivity is not part of
        the question this round. Any of those is fine; leaving it unsaid is
        what causes trouble.
    - id: expression
      t: Evidence the protein, or a near relative, has been expressed
      v: Any system, any scale. A reference will do; a working protocol is better.
      do: >-
        It picks the expression route. With nothing, the first thing that runs
        is an expression arm rather than a binder screen - a real result and a
        cheap one, but it is a round, so it is better to know that going in.

provide:
  title: What you hand over
  items:
    - k: "The target"
      v: "Sequence and structure. We express it, or you send purified protein."
    - k: "One hotspot mutant"
      v: "We make it. You confirm the residue is the one you care about."
    - k: "A close homolog"
      v: "It goes on every plate as the counter-target."
    - k: "Nothing else"
      v: "Designs, constructs, assays, analysis and the data back are ours."

returns:
  title: What comes back
  items:
    - k: "A verdict per design, per gate"
      v: "Pass, fail or unclear. Not a data dump."
    - k: "Measured negatives"
      v: "Failures are kept and returned. They are the training data, and most designs fail."
    - k: "An affinity, where it is determined"
      v: "K_D over 0.5 to 100 nM. Weaker binders come back as a bound and go to maturation."
    - k: "An epitope verdict"
      v: "Whether the binder engaged the face it was designed for, or a different one."
    - k: "A per-design quality record"
      v: "Yield, aggregation state, and a specificity index that means the same thing in every campaign."

limits:
  title: What it cannot do
  note: Worth knowing before you plan around it.
  items:
    - "No FACS, so no yeast-display selection and no libraries at 10^6 and above."
    - "No kinetics. Endpoint and equilibrium only; k_on and k_off need an instrument the deck does not have."
    - "No milligrams. Plate assays yes, crystallography protein no - that comes from offline expression."
    - "No colony picking, so no clonal isolation from a transformation."
    - "No mammalian or CHO expression."
