instruments:
- key: plateloc
  name: PlateLoc
  vendor: Agilent
  rac: 1
  status: quoted
  role: heat seal — foil and PCR seals
  note: Agilent thermal microplate sealer. 30-200 C, temperature held to +/-2 C, seal time set per seal
    type, about 8 s a plate end to end and 2.5 min to warm up. One seal roll resident, which is why the
    a4s carries the second seal type.
- key: xpeel
  name: XPeel
  vendor: Azenta
  rac: 1
  status: quoted
  role: peel — the only de-sealer on the system
  note: Azenta Automated Plate Seal Remover. Up to 200 seals an hour. Removes both heat-applied and pressure-applied
    full-plate seals using a proprietary tape good for about 400 removals a roll. Takes full-skirted PCR
    plates, low-base microplates and deep-well plates to 2 mL. 35 kg.
- key: atc
  name: ATC x4
  vendor: Thermo Fisher
  rac: 2
  status: quoted
  role: four thermal cyclers running independent programs — PCR, Golden Gate, heat lysis, melts, and held
    temperatures
  note: 'Thermo Fisher Applied Biosystems Automated Thermal Cycler, four units on one cart: three 96-well
    and one 384-well. The 96-well blocks take 10-100 uL full-skirted; the 384-well block is a 0.02 mL
    block and takes 5-20 uL, which is the number that decides what can run in it. Both formats 0-105 C,
    ramp 2.8 C/s block and 1.6 C/s sample, accuracy +/-0.25 C from 35 to 99.9 C, uniformity under 0.5
    C twenty seconds after reaching 95 C. All four run independent programs at once.'
- key: bioshake
  name: BioShake
  vendor: QInstruments
  rac: 3
  status: quoted
  role: on-deck orbital shaking — mixing and bead resuspension without the plate leaving the Bravo
  note: QInstruments, elm series, mounted as a Bravo deck position. 200-3,000 rpm on microplates with
    a 2.0 mm orbit (D30 variant 3.0 mm for deep-well, 5000 variant 1.2 mm and up to 5,000 rpm for 384/1536).
    T variants are heater-shakers, ambient to 99 C. 142 x 170 x 80 mm, 2.7 kg.
- key: bravo
  name: Bravo 96 + magnet
  vendor: Agilent
  rac: 3
  status: quoted
  role: 96-channel pipetting, bead handling, and the two temperature-controlled deck nests. The system
    throughput ceiling
  note: Agilent, 96-channel head, nine deck positions. Carries the magnet plate for bead work and TWO
    temperature-controlled nests held at 4 C and 42 C — QInstruments Peltier blocks, -20 to 99.9 C, 12
    K/min. Those two fixed positions with a plate move between them are what gives a 45-second heat shock.
    ~75 two-plate protocols per 20 h day; one 96-well transfer step is ~8 min and a 384-well plate is
    four offset quadrant transfers, so ~32 min.
- key: lynx
  name: Lynx LM900 VVP
  vendor: Dynamic Devices
  rac: 4
  status: quoted
  role: variable-volume pipetting with per-channel volume verification — concentration normalisation before
    assay
  note: Dynamic Devices. 900 mm X travel, 30 microplate deck positions, ~40 x 36 x 40 in. VVP tools come
    as 96-channel and 8-channel heads. Volume Verified Pipetting puts an in-line flow sensor on every
    channel and measures what was actually aspirated and dispensed, in real time, per channel — which
    is what makes normalising a plate to a target mass trustworthy rather than nominal. 1 uL minimum,
    2 uL at 2% CV. Three tip types, 35 / 300 / 1200 uL, filter tips included. Tip detection per channel,
    contact dispense and mixing by pipetting are standard. VVP 2.0 ships at SLAS at no price difference
    — take the upgrade path in writing.
- key: ambistore
  name: AmbiStore D
  vendor: HighRes Biosolutions
  rac: 5
  status: quoted
  role: controlled ambient storage — crystallography trays, Echo source plates, assay plates in flight
  note: HighRes Biosolutions random-access carousel. 14 stackers, each holding 24 standard or 10 deep-well
    plates, so 336 standard or 140 deep-well at the extremes. Configured here as 9 standard + 5 deep-well
    = 216 + 50. Up to six transfer nests and a plate delivered in as few as 12 seconds. The same chassis
    is also specified down to -20 C, which is the route to frozen storage on the system if it is ever
    wanted.
- key: steristore_cold
  name: SteriStore D 4 C
  vendor: HighRes Biosolutions
  rac: 6
  status: quoted
  role: cold hold — DNA, detection reagents, competent cells on the day, grown blocks, outgrowth
  note: HighRes Biosolutions self-sterilising incubator. 4-100 C, humidity to 98% RH, CO2-ready as standard,
    and it sterilises itself with dry heat at about 180 C for three hours. 14 stackers of 24 standard
    or 10 deep-well. Configured here at 9 standard + 5 deep-well = 216 + 50.
- key: steristore_warm
  name: SteriStore D 37 C
  vendor: HighRes Biosolutions
  rac: 7
  status: quoted
  role: where cell-free actually scales — bulk 37 C incubation, plus static recovery
  note: The second SteriStore D, same unit, held at 37 C. Configured 12 standard + 2 deep-well = 288 +
    20. 288 standard positions of static incubation is an order of magnitude more cell-free capacity than
    the four cycler blocks, which is why production cell-free lives here and the ATCs are kept for the
    temperature-arm DOE. Its 98% RH ceiling also covers the 85% RH a eukaryotic ALiCE reaction wants,
    for a static position.
- key: cytomat
  name: Cytomat 2
  vendor: Thermo Fisher
  rac: 8
  status: quoted
  role: the deck's only shaking incubator, and so the cap on everything that cultures
  note: 'Thermo Fisher Cytomat 2 C-LiN. Two stackers, 11 standard or 7 deep-well positions each, so 14
    deep-well culture positions and 7 concurrent culture protocols. Series range is ambient +4 C to 50
    C on the C450-LiN and to 70 C on the C470 — 30 C for yeast and 37 C for E. coli are both well inside
    it. The floor is the catch: ambient +4 C means a 25 C setpoint needs a room at 21 C or below. Tower
    Shaker gives 100-1200 rpm at 850 g a position on a 1-3 mm amplitude; the Selector variant offers 25
    mm at 100-350 rpm with active clamping, which is the orbit published deep-well microbial protocols
    actually use.'
- key: echo
  name: Echo 655
  vendor: Beckman Coulter
  rac: 9
  status: quoted
  role: acoustic nL transfer — and the only way around the Bravo's 4x cost at 384
  note: Beckman Coulter, 600 Series. 2.5 nL drop, 2.5-5,000 nL transfer range, 96/384/1536, DMSO to 100%
    from 384PP 2.0 and LDV plates, glycerol to 50%, proteins and nucleic acids. Tipless, so no carryover
    and no consumable per sample. 74.6 cm deep, 130 kg. ~400 384-well plates per 20 h day.
- key: multiflo
  name: MultiFlo FX
  vendor: Agilent
  rac: 10
  status: quoted
  role: bulk dispense — anything added to every well
  note: Agilent (BioTek). Peristaltic cassettes at 1, 5 and 10 uL, giving recommended per-well ranges
    of 1-50 uL, 5-2,500 uL and 10-3,000 uL. 6- through 1536-well plates, standard, deep-well and PCR.
    A whole 1536 plate at 1 uL a well takes 21 s, accuracy +/-5% at 1 uL — so the 2.5 uL cell-free dispense
    into 1536 sits comfortably inside the 1 uL cassette.
- key: magniflex
  name: Magniflex
  vendor: Tecan
  rac: 11
  status: quoted
  role: the system's positive-displacement, variable-spacing channel — viscous and tube-based reagents
    the Echo cannot transfer
  note: 'Tecan Cavro Magni Flex, an OEM liquid-handling framework. Two, four or eight independent Y and
    Z channels with variable tip spacing from 9 to 445 mm, so it reformats between tubes, troughs and
    plates. Cavro Pulssar PBC piston pumps — positive displacement — over 5-1,000 uL; the optional Air
    Restriction Pipettor covers 1 uL to 5 mL by air displacement. Fixed or disposable tips. 100-240 V,
    480 VA. Note the name: Magni Flex is a pipetting framework, NOT a magnet. Bead separation is the Bravo''s
    job.'
- key: hig3
  name: HiG 3
  vendor: BioNex
  rac: 12
  status: quoted
  role: plate centrifuge — cell harvest
  note: 'BioNex. Two plates a run, direct robotic access, about 20 s to speed. 5,000 g maximum, 100 g
    imbalance tolerance, fan cooling. Chosen over the HiG 4 deliberately: the HiG 4 trades down to 4,000
    g and halves imbalance tolerance to 50 g for a Peltier that only holds ambient, and odd plate counts
    fault twice as often at 50 g.'
- key: pherastar
  name: PHERAstar FSX
  vendor: BMG LABTECH
  rac: 13
  status: quoted
  role: every readout on this page. Tied with the Bravo as the system bottleneck
  note: BMG LABTECH. Every detection method in well formats from 6 through 3456. FI, FP, luminescence,
    BRET; absorbance spectrometer 220-1000 nm; High-End TRF/HTRF with two red-sensitive photon-counting
    PMTs; HTS AlphaScreen laser; simultaneous dual emission; two reagent injectors. Optic modules for
    DAPI, FITC, TAMRA, Cy5, AlphaScreen, AlphaLISA, NanoBRET, FP, LanthaScreen and HTRF, filling five
    of six slots. Incubation caps at 45 C, so melts run in an ATC and are read after. ~8 min a 384-well
    TR-FRET plate, ~3 min luminescence; 150 plates per 20 h day.
- key: microserve
  name: MicroServe
  vendor: HighRes Biosolutions
  rac: 14
  status: quoted
  role: every tip box on the system. The Bravo, the Lynx and the Magniflex all draw from here
  note: HighRes Biosolutions consumable store. About 770 microplates, or 154 standard tip boxes, in under
    three feet of floor space. Per Ginkgo's Q&A all tip boxes live here, which is why no separate 8-position
    tip-box stacker is quoted. Tip inventory has to cover 250 uL+ for deep-well transfers, low-retention
    for cell-free, and the Lynx's 35 / 300 / 1200 uL types including filter tips.
- key: a4s
  name: a4s sealer
  vendor: Azenta
  rac: 15
  status: quoted
  role: the second sealer — the seal type the PlateLoc is not holding, plus agar plates and over-tall
    stacks
  note: Azenta a4S, now sold as the Automated Roll Heat Sealer (4ti-0665). 100-195 C, seal time 0.1-10
    s, SBS footprint from 96 through 1536, 230 x 507 x 276 mm, 27 kg, RS-232 and USB. Having two sealers
    is what lets a gas-permeable culture seal and a foil PCR seal both be resident without a manual roll
    change mid-run. It also covers the agar plates and the filter-plus-carrier stacks that are too tall
    for the PlateLoc.
- key: drop_setter
  name: Dedicated crystallisation drop setter
  vendor: null
  rac: null
  status: gap
  role: Sitting-drop setting independent of acoustic fluid classes.
  note: Acoustic drop setting is published but needs a validated fluid class per condition, and viscous
    precipitants fall outside them. The obvious alternative has no drop-setting API, so it would be a
    custom integration.
- key: lidder
  name: Lidding and de-lidding
  vendor: null
  rac: null
  status: gap
  role: Handling lids on agar plates and over-tall plate stacks.
  note: Opened 2026-11-17, when the cart we had recorded as a lidder turned out to be a second sealer.
    Plating is in scope and agar plates carry lids, so something has to lift them. Filter plus carrier
    combinations are also too tall for either sealer.
- key: prep_purification
  name: Purification at milligram scale
  vendor: null
  rac: null
  status: gap
  role: Protein for crystallography.
  note: Magnetic-bead purification gives micrograms. There is no size-exclusion step and no concentrator
    on the system, so crystallography-grade protein is made off-system for now.
