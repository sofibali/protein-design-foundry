# The workflows, as deck sequences.
# Source of truth for section 4 of capabilities.md — if they disagree, this
# file is right and the prose is stale.
#
# status: ready    runs on the deck as quoted
#         limited  runs, but does not give you the thing you actually wanted
#         build    needs something built or bought offline first
#         offline  runs, but its endpoint is a sample prepared for something
#                  off the rack - the chain ends in an Offline chip
#
# steps:  the procedure, as a comparison. One row per real unit operation,
#         each one said twice - what it is at the bench, and what it becomes
#         on the rack. That contrast is the point of the page, so a row that
#         cannot say both does not belong here.
#
#           - step: >-
#               What the operation is, as a short title.
#             hand: >-            what a person does at the bench
#             deck: >-            what the rack does instead, and what that buys
#             at: ["echo"]        the machines, as a LIST
#             t:  "3 min a plate" only where the rate model has a real figure
#
#         Keep it short. Sofia has cut text on every page this week and these
#         rows are read side by side, so a long one reads as noise.
#
#         THE KEY IS `at`, NOT `on`. YAML 1.1 reads a bare `on:` key as the
#         boolean true, so `- on: echo` parses as {True: "echo"} and the page
#         silently renders nothing. That is the comma trap's cousin and the
#         build now fails on it, but it is easier not to write.
#
#         The build checks that every machine in deck: is used by some step,
#         and that no step names a machine the workflow does not have. The
#         deck chain, the drawing and the written method stay in step because
#         none of the three can be changed alone.

title: Sample protocols
subtitle: What each one does on the deck, and what it hands back
note: Click a protocol to open it. Click an instrument to see everything that needs it.

# ---------------------------------------------------------------------------
# Machine time. Added 2026-11-17 to close audit finding 3.
#
# Every scale: and time: field below was written without a cost model, so two
# workflows that both say "384 designs" could differ fourfold in machine time
# and the page could not show it. These rates fix that.
#
# day_min   a 20-hour day, per instrument. The system is scheduled on 20 h,
#           not 24 — the balance is service, load and unload.
# bravo_96  one 96-well plate, one transfer step. Derived: the Bravo runs
#           ~75 two-plate protocols per 20 h day, so 1200 / 75 / 2 = 8 min.
# bravo_384 the same step on a 384-well plate. A 96-channel head has to make
#           FOUR offset quadrant transfers, so 384 format costs 4x Bravo time
#           unless the Echo does the dispensing. This is the single most
#           expensive fact about the deck.
# echo_pl   one plate on the Echo. Derived from 400 plates per 20 h at 384.
# read_trf  one 384-well TR-FRET or fluorescence read. Derived from 150
#           plates per 20 h; the same number the scheduler model uses.
# read_lum  one luminescence read.
#
# The ceilings: the Bravo and the PHERAstar are tied as the system
# bottleneck. Nothing else on the deck binds except shaking, and shaking
# only binds workflows that culture.
#
# Source: notes/specs_requirement_meeting_update.VERBOSE_BACKUP_2026-11-02.md
# (Bravo, Echo, PHERAstar lines) and notes/capacity_and_buildout_detail.md
# ("What binds first in small-protocol mode"). Internal repo.

rates:
  day_min:   1200
  bravo_96:  8
  bravo_384: 32
  echo_pl:   3
  read_trf:  8
  read_lum:  3
  ceilings:
    - {what: Bravo, limit: 75, per: two-plate protocols per 20 h day}
    - {what: PHERAstar, limit: 150, per: 384-well TR-FRET plates per 20 h day}
    - {what: Echo, limit: 400, per: 384-well plates per 20 h day}
    - {what: Cytomat, limit: 7, per: concurrent protocols that culture — 14 deep-well positions}
  note: >
    Modelled, not measured. The rates are arithmetic off Ginkgo's own
    throughput figures; the step counts are read off each protocol's own
    deck sequence. Treat a cost as the right order of magnitude and the ratio
    between two workflows as the thing worth trusting.

# ---------------------------------------------------------------------------
# The device set. 19 instruments across 15 RACs, confirmed by Sofia
# 2026-11-04. Nine of these were missing from this file until 2026-11-17.
#
# kind: deck        acts on a plate, and appears in a deck: sequence
#       store       holds a plate between steps, and appears in a holds: list
#       consumable  feeds the deck rather than touching a plate — holds: too
#       virtual     not an instrument; the chain leaves the rack here
#
# build.py enforces the distinction, so a storage rack can never render as a
# processing step and a processing instrument can never hide in storage.

instruments:
  - id: echo
    label: Echo 655
    vendor: Beckman Coulter
    kind: deck
    role: acoustic nL transfer — and the only way around the Bravo's 4x cost at 384
    spec: >
      Beckman Coulter, 600 Series. 2.5 nL drop, 2.5-5,000 nL transfer range,
      96/384/1536, DMSO to 100% from 384PP 2.0 and LDV plates, glycerol to 50%,
      proteins and nucleic acids. Tipless, so no carryover and no consumable
      per sample. 74.6 cm deep, 130 kg. ~400 384-well plates per 20 h day.

  - id: multiflo
    label: MultiFlo FX
    vendor: Agilent
    kind: deck
    role: bulk dispense — anything added to every well
    spec: >
      Agilent (BioTek). Peristaltic cassettes at 1, 5 and 10 uL, giving
      recommended per-well ranges of 1-50 uL, 5-2,500 uL and 10-3,000 uL.
      6- through 1536-well plates, standard, deep-well and PCR. A whole 1536
      plate at 1 uL a well takes 21 s, accuracy +/-5% at 1 uL — so the 2.5 uL
      cell-free dispense into 1536 sits comfortably inside the 1 uL cassette.

  - id: bravo
    label: Bravo 96 + magnet
    vendor: Agilent
    kind: deck
    role: 96-channel pipetting, bead handling, and the two temperature-controlled deck nests. The system throughput ceiling
    spec: >
      Agilent, 96-channel head, nine deck positions. Carries the magnet plate
      for bead work and TWO temperature-controlled nests held at 4 C and 42 C —
      QInstruments Peltier blocks, -20 to 99.9 C, 12 K/min. Those two fixed
      positions with a plate move between them are what gives a 45-second heat
      shock. ~75 two-plate protocols per 20 h day; one 96-well transfer step is
      ~8 min and a 384-well plate is four offset quadrant transfers, so ~32 min.

  - id: bioshake
    label: BioShake
    vendor: QInstruments
    kind: deck
    role: on-deck orbital shaking — mixing and bead resuspension without the plate leaving the Bravo
    spec: >
      QInstruments, elm series, mounted as a Bravo deck position. 200-3,000 rpm
      on microplates with a 2.0 mm orbit (D30 variant 3.0 mm for deep-well,
      5000 variant 1.2 mm and up to 5,000 rpm for 384/1536). T variants are
      heater-shakers, ambient to 99 C. 142 x 170 x 80 mm, 2.7 kg.

  - id: lynx
    label: Lynx LM900 VVP
    vendor: Dynamic Devices
    kind: deck
    role: variable-volume pipetting with per-channel volume verification — concentration normalisation before assay
    spec: >
      Dynamic Devices. 900 mm X travel, 30 microplate deck positions,
      ~40 x 36 x 40 in. VVP tools come as 96-channel and 8-channel heads.
      Volume Verified Pipetting puts an in-line flow sensor on every channel
      and measures what was actually aspirated and dispensed, in real time,
      per channel — which is what makes normalising a plate to a target mass
      trustworthy rather than nominal. 1 uL minimum, 2 uL at 2% CV. Three tip
      types, 35 / 300 / 1200 uL, filter tips included. Tip detection per
      channel, contact dispense and mixing by pipetting are standard. VVP 2.0
      ships at SLAS at no price difference — take the upgrade path in writing.

  - id: magniflex
    label: Magniflex
    vendor: Tecan
    kind: deck
    role: the system's positive-displacement, variable-spacing channel — viscous and tube-based reagents the Echo cannot transfer
    spec: >
      Tecan Cavro Magni Flex, an OEM liquid-handling framework. Two, four or
      eight independent Y and Z channels with variable tip spacing from 9 to
      445 mm, so it reformats between tubes, troughs and plates. Cavro Pulssar
      PBC piston pumps — positive displacement — over 5-1,000 uL; the optional
      Air Restriction Pipettor covers 1 uL to 5 mL by air displacement. Fixed
      or disposable tips. 100-240 V, 480 VA. Note the name: Magni Flex is a
      pipetting framework, NOT a magnet. Bead separation is the Bravo's job.

  - id: atc
    label: ATC x4
    vendor: Thermo Fisher
    kind: deck
    role: four thermal cyclers running independent programs — PCR, Golden Gate, heat lysis, melts, and held temperatures
    spec: >
      Thermo Fisher Applied Biosystems Automated Thermal Cycler, four units on
      one cart: three 96-well and one 384-well. The 96-well blocks take
      10-100 uL full-skirted; the 384-well block is a 0.02 mL block and takes
      5-20 uL, which is the number that decides what can run in it. Both
      formats 0-105 C, ramp 2.8 C/s block and 1.6 C/s sample, accuracy
      +/-0.25 C from 35 to 99.9 C, uniformity under 0.5 C twenty seconds after
      reaching 95 C. All four run independent programs at once.

  - id: plateloc
    label: PlateLoc
    vendor: Agilent
    kind: deck
    role: heat seal — foil and PCR seals
    spec: >
      Agilent thermal microplate sealer. 30-200 C, temperature held to
      +/-2 C, seal time set per seal type, about 8 s a plate end to end and
      2.5 min to warm up. One seal roll resident, which is why the a4s
      carries the second seal type.

  - id: xpeel
    label: XPeel
    vendor: Azenta
    kind: deck
    role: peel — the only de-sealer on the system
    spec: >
      Azenta Automated Plate Seal Remover. Up to 200 seals an hour. Removes
      both heat-applied and pressure-applied full-plate seals using a
      proprietary tape good for about 400 removals a roll. Takes full-skirted
      PCR plates, low-base microplates and deep-well plates to 2 mL. 35 kg.

  - id: a4s
    label: a4s sealer
    vendor: Azenta
    kind: deck
    role: the second sealer — the seal type the PlateLoc is not holding, plus agar plates and over-tall stacks
    spec: >
      Azenta a4S, now sold as the Automated Roll Heat Sealer (4ti-0665).
      100-195 C, seal time 0.1-10 s, SBS footprint from 96 through 1536,
      230 x 507 x 276 mm, 27 kg, RS-232 and USB. Having two sealers is what
      lets a gas-permeable culture seal and a foil PCR seal both be resident
      without a manual roll change mid-run. It also covers the agar plates and
      the filter-plus-carrier stacks that are too tall for the PlateLoc.

  - id: pherastar
    label: PHERAstar FSX
    vendor: BMG LABTECH
    kind: deck
    role: every readout on this page. Tied with the Bravo as the system bottleneck
    spec: >
      BMG LABTECH. Every detection method in well formats
      from 6 through 3456. FI, FP, luminescence, BRET; absorbance
      spectrometer 220-1000 nm; High-End TRF/HTRF with two red-sensitive
      photon-counting PMTs; HTS AlphaScreen laser; simultaneous dual emission;
      two reagent injectors. Optic modules for DAPI, FITC, TAMRA, Cy5,
      AlphaScreen, AlphaLISA, NanoBRET, FP, LanthaScreen and HTRF, filling
      five of six slots. Incubation caps at 45 C, so melts run in an ATC and
      are read after. ~8 min a 384-well TR-FRET plate, ~3 min luminescence;
      150 plates per 20 h day.

  - id: hig3
    label: HiG 3
    vendor: BioNex
    kind: deck
    role: plate centrifuge — cell harvest
    spec: >
      BioNex. Two plates a run, direct robotic access, about 20 s to speed.
      5,000 g maximum, 100 g imbalance tolerance, fan cooling. Chosen over
      the HiG 4 deliberately: the HiG 4 trades down to 4,000 g and halves
      imbalance tolerance to 50 g for a Peltier that only holds ambient,
      and odd plate counts fault twice as often at 50 g.

  - id: cytomat
    label: Cytomat 2
    vendor: Thermo Fisher
    kind: deck
    role: the deck's only shaking incubator, and so the cap on everything that cultures
    spec: >
      Thermo Fisher Cytomat 2 C-LiN. Two stackers, 11 standard or 7 deep-well
      positions each, so 14 deep-well culture positions and 7 concurrent
      culture protocols. Series range is ambient +4 C to 50 C on the C450-LiN
      and to 70 C on the C470 — 30 C for yeast and 37 C for E. coli are both
      well inside it. The floor is the catch: ambient +4 C means a 25 C
      setpoint needs a room at 21 C or below. Tower Shaker gives 100-1200 rpm
      at 850 g a position on a 1-3 mm amplitude; the Selector variant offers
      25 mm at 100-350 rpm with active clamping, which is the orbit published
      deep-well microbial protocols actually use.

  - id: ambistore
    label: AmbiStore D
    vendor: HighRes Biosolutions
    kind: store
    role: controlled ambient storage — crystallography trays, Echo source plates, assay plates in flight
    spec: >
      HighRes Biosolutions random-access carousel. 14 stackers, each holding
      24 standard or 10 deep-well plates, so 336 standard or 140 deep-well at
      the extremes. Configured here as 9 standard + 5 deep-well = 216 + 50.
      Up to six transfer nests and a plate delivered in as few as 12 seconds.
      The same chassis is also specified down to -20 C, which is the route to
      frozen storage on the system if it is ever wanted.

  - id: steristore_cold
    label: SteriStore D 4 C
    vendor: HighRes Biosolutions
    kind: store
    role: cold hold — DNA, detection reagents, competent cells on the day, grown blocks, outgrowth
    spec: >
      HighRes Biosolutions self-sterilising incubator. 4-100 C, humidity to
      98% RH, CO2-ready as standard, and it sterilises itself with dry heat at
      about 180 C for three hours. 14 stackers of 24 standard or 10 deep-well.
      Configured here at 9 standard + 5 deep-well = 216 + 50.

  - id: steristore_warm
    label: SteriStore D 37 C
    vendor: HighRes Biosolutions
    kind: store
    role: where cell-free actually scales — bulk 37 C incubation, plus static recovery
    spec: >
      The second SteriStore D, same unit, held at 37 C. Configured 12 standard
      + 2 deep-well = 288 + 20. 288 standard positions of static incubation is
      an order of magnitude more cell-free capacity than the four cycler
      blocks, which is why production cell-free lives here and the ATCs are
      kept for the temperature-arm DOE. Its 98% RH ceiling also covers the 85%
      RH a eukaryotic ALiCE reaction wants, for a static position.

  - id: microserve
    label: MicroServe
    vendor: HighRes Biosolutions
    kind: consumable
    role: every tip box on the system. The Bravo, the Lynx and the Magniflex all draw from here
    spec: >
      HighRes Biosolutions consumable store. About 770 microplates, or 154
      standard tip boxes, in under three feet of floor space. Per Ginkgo's
      Q&A all tip boxes live here, which is why no separate 8-position
      tip-box stacker is quoted. Tip inventory has to cover 250 uL+ for
      deep-well transfers, low-retention for cell-free, and the Lynx's
      35 / 300 / 1200 uL types including filter tips.

  - id: offline
    label: Offline
    kind: virtual
    role: not on the rack
    spec: >
      Not an instrument. The chain leaves the system here — bench work,
      sequencing, diffraction, or an imager that is not yet on the floor.

# ---------------------------------------------------------------------------
# The carts. Added 2026-11-19, replicating the shape of Ginkgo's own published
# Application Blueprints (reference/ginkgo-published.md §4).
#
# A blueprint labels a cart by its UNIT OPERATION, not by the instrument model
# sitting in it — "non-contact acoustic cherry picking", not "Echo 655". That
# is the right altitude for anyone who has to plan against the system rather
# than run it, and it is the vocabulary Ginkgo's own engineers use. Where they
# have a term for something we have, the term below is theirs verbatim.
#
# instruments: must account for every non-virtual instrument above, exactly
# once. build.py enforces it, so a device cannot be on the capability map and
# off the floor plan, which is how the device set drifted in the first place.
#
# status: installed  one of the 15 carts confirmed by Sofia 2026-11-04
#         phase2     one of the 4 additional carts the layout leaves room for
# io:     this cart is where material enters or leaves the system by hand

# The carts, grouped by what a user would look for. The blueprint and the
# protocol library both read this list, in this order, so the two pages sort
# the machine the same way. Every cart carries a `group:` naming one of these.
cart_groups:
  - id: liquid
    label: Liquid handling
    note: Everything that moves liquid between plates, tubes and reservoirs.
  - id: assay
    label: Assay and thermal cycling
    note: The carts that produce a number, or a reaction that one is read from.
  - id: incubate
    label: Incubation
    note: Where a plate sits at temperature, shaken or still.
  - id: store
    label: Storage
    note: Random-access shelving for plates, reagents and consumables.
  - id: handle
    label: Plate handling
    minor: true   # drawn quieter: these serve the plate, not the question
    note: >
      Sealing, peeling and spinning. These serve the plate rather than the
      assay, but nothing runs overnight without them.

racs:

  - n: 9
    id: echo
    unitop: Non-contact acoustic cherry picking
    class: [liquid handling]
    group: liquid
    instruments: [echo]
    status: installed
    io: false
    note: >
      The only tipless transfer on the system, and the way every 384 and 1536
      plate gets built without paying the Bravo's quadrant tax.

  - n: 10
    id: multiflo
    unitop: Bulk dispensing
    class: [liquid handling]
    group: liquid
    instruments: [multiflo]
    status: installed
    io: false
    note: >
      Anything added to every well. Three peristaltic cassettes cover 1 uL to
      3 mL, and a whole 1536 plate at 1 uL a well takes 21 s.

  - n: 3
    id: bravo
    unitop: Contact stamping pipetting
    class: [liquid handling, incubating]
    group: liquid
    instruments: [bravo, bioshake]
    status: installed
    io: false
    note: >
      96-channel head, magnet plate, on-deck orbital shaking, and the two
      temperature-controlled nests at 4 C and 42 C that make heat shock a plate
      move. The system throughput ceiling.

  - n: 11
    id: magniflex
    unitop: Positive-displacement channel pipetting
    class: [liquid handling]
    group: liquid
    instruments: [magniflex]
    status: installed
    io: false
    note: >
      2/4/8 independent channels, tip spacing 9-445 mm, piston pumps over
      5-1000 uL. The only way to move a glycerol-based enzyme master mix out of
      a tube.

  - n: 4
    id: lynx
    unitop: Volume-verified contact pipetting
    class: [liquid handling]
    group: liquid
    instruments: [lynx]
    status: installed
    io: false
    note: >
      An in-line flow sensor on every channel, so a normalised plate is
      measured rather than nominal. Concentration normalisation before assay.

  - n: 2
    id: thermal
    unitop: Thermal cycling
    class: [incubating]
    group: assay
    instruments: [atc]
    status: installed
    io: false
    note: >
      Four blocks running independent programs - three 96-well at 10-100 uL,
      one 384-well at 5-20 uL. PCR, Golden Gate, heat lysis, and the four
      temperature arms of the cell-free DOE.

  - n: 1
    id: sealpeel
    unitop: Microplate sealing & seal peeling
    class: [sealing]
    group: handle
    instruments: [plateloc, xpeel]
    status: installed
    io: false
    note: >
      Ginkgo gives sealing and peeling a cart each; ours shares one. PlateLoc
      applies foil at 30-200 C, XPeel removes up to 200 seals an hour.

  - n: 15
    id: breathable
    unitop: Microplate breathable sealing
    class: [sealing]
    group: handle
    instruments: [a4s]
    status: installed
    io: false
    note: >
      The second sealer, so a gas-permeable culture roll and a foil PCR roll
      are both resident. Without it a 20 h deep-well culture goes anaerobic
      under foil.

  - n: 12
    id: spin
    unitop: Centrifugation
    class: [centrifugation]
    group: handle
    instruments: [hig3]
    status: installed
    io: false
    note: >
      Two plates a run, 5000 g, about 20 s to speed. Cell harvest before
      lysis, and that is all it needs to do.

  - n: 8
    id: shaking
    unitop: Temp-control shaking incubation
    class: [incubating, storage]
    group: incubate
    instruments: [cytomat]
    status: installed
    io: false
    note: >
      The only shaking position on the system, so 14 deep-well slots and 7
      concurrent culture protocols is the hard cap on everything that grows.

  - n: 7
    id: static37
    unitop: 37 C static incubation
    class: [incubating, storage]
    group: incubate
    instruments: [steristore_warm]
    status: installed
    io: false
    note: >
      288 standard positions. This, not the four cycler blocks, is where
      cell-free actually scales.

  - n: 6
    id: cold
    unitop: Refrigerated random access storage
    class: [storage]
    group: store
    instruments: [steristore_cold]
    status: installed
    io: true
    note: >
      4 C, 216 standard + 50 deep-well. DNA, detection reagents, grown blocks,
      and competent cells on the day. The coldest position on the system.

  - n: 5
    id: ambient
    unitop: Ambient random access storage
    class: [storage]
    group: store
    instruments: [ambistore]
    status: installed
    io: true
    note: >
      216 standard + 50 deep-well, delivered in as little as 12 s.
      Crystallography trays, Echo source plates, assay plates in flight.

  - n: 14
    id: consumable
    unitop: Tip & consumable storage
    class: [storage]
    group: store
    instruments: [microserve]
    status: installed
    io: true
    note: >
      About 770 plates or 154 tip boxes. Every tip box on the system lives
      here, which is why no separate tip-box stacker is quoted.

  - n: 13
    id: reader
    unitop: Plate reading
    class: [assaying]
    group: assay
    instruments: [pherastar]
    status: installed
    io: false
    note: >
      Every readout in the spec, 6 to 3456 wells. Tied with the Bravo as the
      system bottleneck at 150 384-well TR-FRET plates a day.

  - n: 16
    id: imaging
    unitop: Crystal imaging
    class: [assaying]
    group: assay
    instruments: []
    status: phase2
    io: false
    note: >
      Crystal imaging and automated scoring. The crystallography protocol puts
      560 imaging events in a campaign: 9 h on an imager cart against 37 h at a
      microscope. This is the cart that lets Aim 3 run unattended.

  - n: 17
    id: ambient2
    unitop: Ambient random access storage
    class: [storage]
    group: store
    instruments: []
    status: phase2
    io: true
    note: >
      A second AmbiStore, doubling ambient random-access capacity to 432
      standard positions. Crystallography raises the tray count, and this is
      what lets trays rotate without displacing assay plates in flight.

  - n: 18
    id: sealer2
    unitop: Microplate sealing
    class: [sealing]
    group: handle
    instruments: []
    status: phase2
    io: false
    note: >
      A third seal type resident on the system, so a crystallography seal sits
      alongside the foil and breathable rolls and a tray run needs no
      changeover.

  - n: 19
    id: handler2
    unitop: Contact stamping pipetting
    class: [liquid handling]
    group: liquid
    instruments: []
    status: phase2
    io: false
    note: >
      A second liquid handler. It is what raises the ~75 two-plate protocols a
      day ceiling without changing the Bravo's head.

phases:
  - {id: dna,       label: DNA,          c: '#0072B2'}
  - {id: express,   label: Express,      c: '#009E73'}
  - {id: purify,    label: Purify and QC, c: '#56B4E9'}
  - {id: bind,      label: Bind,         c: '#D55E00'}
  - {id: structure, label: Structure,    c: '#CC79A7'}

workflows:

  - id: '4.1'
    name: Build a clonal array
    short: Build a clonal array
    sub: no cloning at all
    phase: dna
    draw: dna
    status: ready
    deck: [echo]
    holds: [ambistore]
    gives: a template plate ready for any expression route
    scale: 384 per plate
    time: one hour
    input: "One ordered gene fragment per design, delivered plated"
    output: "A 384-well template plate, every well at the same concentration"
    cost: {bravo: 0, echo: 3, reader: 0, binds: Echo — and it is the cheapest workflow on the deck}
    gates: []
    steps:
      - step: >-
          Resuspend the ordered fragments
        hand: >-
          Add water to each well at the vendor's stated concentration - eBlocks at 10
          ng/uL, Twist fragments at 0.5 ng/uL.
        deck: >-
          Still done by hand, off the deck. The fragments arrive plated, so this is one
          addition per plate rather than one per design.
        at: ["offline"]
      - step: >-
          Normalise every design to one concentration
        hand: >-
          Quantify each well, work out a dilution, pipette it. The answer is nominal,
          and the molar ratio drifts design to design.
        deck: >-
          One acoustic transfer at a fixed mass per well, backfilled with water. 384
          wells in three minutes, normalised by mass and not by volume.
        at: ["echo"]
        t: "3 min a plate"
      - step: >-
          Keep the source plate for the next protocol
        hand: >-
          A labelled box in a drawer, found by whoever put it there.
        deck: >-
          Ambient random-access storage returns it in about 12 seconds when 4.3, 4.4 or
          4.13 ask for it.
        at: ["ambistore"]
    inputs:
      - item: Gene fragments
        spec: "one per design — IDT eBlocks or Twist Gene Fragments, ~300 bp to 1.5 kb"
      - item: Nuclease-free water
        spec: "resuspension; eBlocks at 10 ng/uL, Twist fragments at 0.5 ng/uL"
    note: >
      Linear dsDNA arrives plated and the Echo normalises concentration into a
      destination plate. That is the entire build step. The Bravo never touches
      it, which is why 384 format costs nothing here and costs 4x everywhere
      the Bravo does the dispensing.

  - id: '4.2'
    name: Build a pooled library
    short: Build a pooled library
    sub: oligo pool to liquid culture
    phase: dna
    draw: dna
    status: offline
    deck: [echo, atc, bravo, magniflex, echo, atc, bravo, multiflo, cytomat, offline]
    holds: [ambistore, steristore_cold, microserve]
    gives: a library in liquid culture, never plated for colonies
    scale: one pool per run
    time: overnight
    input: "One oligo pool, a linearised backbone and electrocompetent cells"
    output: "The library in liquid culture, plus the sequencing read that says what is in it"
    cost: {bravo: 24, echo: 6, reader: 0, binds: Cytomat — the outgrowth occupies a shaking position for the night}
    gates: []
    steps:
      - step: >-
          Retrieve the subpool
        hand: >-
          Set the pool PCR up in strips and run a block.
        deck: >-
          The reactions are built acoustically at 384, one subpool per library, and one
          of four cycler blocks runs it while the other three are busy.
        at: ["echo", "atc"]
        t: "3 min a plate"
      - step: >-
          Size-select the product
        hand: >-
          SPRI by hand on a magnet rack, a plate at a time.
        deck: >-
          SPRI at 0.8x on the 96-channel head beside the deck magnet. This is the only
          size selection the deck has.
        at: ["bravo"]
        t: "32 min at 384"
      - step: >-
          Assemble into the linearised backbone
        hand: >-
          Pipette the BsaI-HFv2 and T4 ligase mix out of the tube, then cycle the
          digestion-ligation.
        deck: >-
          A positive-displacement channel moves it from the tube - enzyme mixes ship in
          glycerol and the acoustic dispenser will not transfer them - and a cycler
          block runs the cycling.
        at: ["magniflex", "atc"]
      - step: >-
          Clean up and transform
        hand: >-
          A second SPRI, then a water bath and a stopwatch for the heat shock.
        deck: >-
          A second SPRI, then the pulse as a plate move between the two temperature-
          controlled deck nests, exactly as 4.14.
        at: ["bravo"]
      - step: >-
          Recover and outgrow as a pool, never plated
        hand: >-
          Add recovery medium, shake a flask overnight.
        deck: >-
          Bulk dispense straight after the pulse, then a shaking incubator position for
          the night. The pool is the product; plating it would pick a handful of members
          out of a library.
        at: ["multiflo", "cytomat"]
        t: "overnight"
      - step: >-
          Sequence the pool
        hand: >-
          Submit to a core, or run a flow cell.
        deck: >-
          Off the deck either way. Nothing on this system reads sequence.
        at: ["offline"]
    inputs:
      - item: Oligo pool
        spec: "20-350 nt. Plan the coding budget at ~75 aa. Subpool adapters split one order into several libraries"
      - item: BsaI-HFv2 + T4 DNA ligase
        spec: "overhang set from NEBridge GetSet, not from intuition"
      - item: Linearised backbone
        spec: "low copy, Kan — ampicillin satellites on a long unattended outgrowth"
      - item: SPRI beads
        spec: "0.8x drops anything under ~200 bp. The only size selection the deck has"
      - item: Competent cells + recovery medium
        spec: "electrocompetent; outgrown as a pool, never plated. Delivered cold on the day; the coldest position on the system is the 4 C SteriStore"
    ends: sequencing, to find out what is actually in the pool
    blocked: NGS path undecided — in-lab Nanopore or a campus core
    note: >
      Pool PCR at 384 off the Echo, Type IIS digestion-ligation into a
      linearised backbone, bead cleanup, transformation, outgrowth as a pool.
      The Magniflex moves the enzyme master mixes: BsaI-HFv2 and T4 ligase
      ship in glycerol and the Echo will not transfer them, so a
      positive-displacement channel from the tube is the right tool. The
      transformation runs on the Bravo's two temperature-controlled nests
      (4.14). Transformation is only here to amplify a pool - for an arrayed
      build, 4.13 skips cells entirely.

  - id: '4.13'
    name: In-vitro assembly to expression
    short: In-vitro assembly
    sub: a plasmid without ever touching a cell
    phase: dna
    draw: dna
    status: ready
    deck: [echo, atc, bravo, magniflex, echo, atc, bravo, multiflo]
    holds: [ambistore, steristore_cold, microserve]
    gives: a circular, expression-ready construct per design, no colonies
    scale: 96-384 per run
    time: one day
    input: "Linear gene fragments with Golden Gate handles, and a circularising vector"
    output: "One circular, expression-ready construct per design, no colonies"
    cost: {bravo: 16, echo: 6, reader: 0, binds: Bravo — two SPRI cleanups at 96. Run the assembly at 384 and they cost 64 min instead of 16}
    gates: []
    steps:
      - step: >-
          Retrieval PCR off the fragment plate
        hand: >-
          Master mix into strips, 30 cycles in a block.
        deck: >-
          Built acoustically in the 384 block; one of four cyclers runs it.
        at: ["echo", "atc"]
        t: "3 min a plate"
      - step: >-
          Clean up the insert
        hand: >-
          SPRI on a magnet rack.
        deck: >-
          SPRI at 1.8x on the deck magnet, eluted small. One of only two liquid-handler
          steps in the whole protocol.
        at: ["bravo"]
        t: "32 min at 384"
      - step: >-
          Normalise insert against vector by mass
        hand: >-
          Add a fixed volume and let the insert-to-vector molar ratio drift.
        deck: >-
          Acoustic transfer at a fixed mass, so the ratio is held. That ratio is the one
          variable this step exists to control.
        at: ["echo"]
        t: "3 min a plate"
      - step: >-
          Close the circle by Golden Gate
        hand: >-
          Pipette enzyme from the tube, cycle 37 C against 16 C, then hold at 60 C.
        deck: >-
          Positive-displacement delivery of the glycerol-based enzyme mix, then 30
          cycles in a 96 block - the 384 block takes 5-20 uL and a 30 uL assembly does
          not fit it.
        at: ["magniflex", "atc"]
      - step: >-
          Go straight into the expression reaction
        hand: >-
          Transform, plate, pick a colony, miniprep, sequence.
        deck: >-
          A second SPRI, then the circular product is dispensed into the expression
          reaction. No transformation, no colony, no miniprep.
        at: ["bravo", "multiflo"]
    inputs:
      - item: Linear dsDNA gene fragments
        spec: "one per design, with Golden Gate handles designed in at order time"
      - item: Circularising CFPS vector
        spec: "a backbone that closes on itself in the Golden Gate - pALiCE01-derived in the source paper, carrying an FP fusion, a protease site and an affinity tag"
      - item: High-fidelity PCR master mix
        spec: "Platinum SuperFi II 2x in the source paper; 30 cycles, 30 uL"
      - item: BsaI-HFv2 + T4 DNA ligase
        spec: "30 x (37 C 60 s / 16 C 60 s), then 60 C 10 min"
      - item: SPRI beads
        spec: "twice - after the PCR and after the assembly. 1.8x then elute small"
    note: >
      Golden Gate closes a circle in vitro, so the assembled product goes
      straight into the expression reaction. No transformation, no outgrowth,
      no colony, no miniprep. This is the step the deck could not do well, and
      it turns out not to be needed. Normalise the insert by mass on the Echo -
      the source paper added a fixed volume and let the molar ratio drift.
      Retrieval PCR runs in the 384 block, Golden Gate in a 96 block: the 384
      block takes 5-20 uL and the 96 block takes 10-100 uL, and a 30 uL
      assembly only fits the latter. The Magniflex delivers the enzyme master
      mixes from tubes - they are glycerol-based and the Echo will not move
      them. Note what the two SPRI cleanups cost: they are the only Bravo steps
      here, and taking the assembly to 384 quadruples them.
      From reference/fida-pipeline.md.

  - id: '4.3'
    name: Cell-free expression, arrayed
    short: Cell-free expression
    sub: the bread and butter
    phase: express
    draw: plate
    status: ready
    protocol: express.cfps.doe
    deck: [echo, multiflo, plateloc, atc, xpeel, multiflo, pherastar]
    holds: [steristore_warm, ambistore]
    gives: ug/mL per well against a standard curve
    scale: 384 per plate, four plates in parallel
    time: 4-6 h
    input: "Template DNA, lysate or PURE kit, and the salt stocks the DOE varies"
    output: "Protein in ug/mL per well, read against the GFP11 standard curve"
    cost: {bravo: 0, echo: 12, reader: 32, binds: PHERAstar — four reads at 8 min; the Bravo is never in the chain}
    gates: [D1, D2]
    steps:
      - step: >-
          Build the 16 conditions and add template
        hand: >-
          Hand-mix each Mg-glutamate, K-glutamate and energy combination, then add
          template to each one.
        deck: >-
          The stocks are dispensed acoustically straight into the destination and
          template goes on top. Check every stock transfers before the first run;
          glycerol is the usual reason one will not.
        at: ["echo"]
        t: "3 min a plate"
      - step: >-
          Dispense the common lysate or PURE mix
        hand: >-
          Multichannel from a reservoir.
        deck: >-
          Bulk dispense to final volume. A whole 1536 plate at 1 uL a well takes 21
          seconds.
        at: ["multiflo"]
      - step: >-
          Seal the plate
        hand: >-
          Press a seal on by hand.
        deck: >-
          Thermal foil, applied at 30-200 C.
        at: ["plateloc"]
      - step: >-
          Incubate, one temperature per block
        hand: >-
          One incubator, so temperature is a plate-level confound rather than a factor
          you can test.
        deck: >-
          Four cycler blocks run independent programs at once, so each temperature is a
          replicated arm of the design matrix.
        at: ["atc"]
        t: "4-6 h"
      - step: >-
          Peel and develop
        hand: >-
          Peel by hand, add GFP1-10 with a multichannel.
        deck: >-
          Up to 200 seals an hour off the peeler, then GFP1-10 in excess from the bulk
          dispenser.
        at: ["xpeel", "multiflo"]
        t: "30 min to complement"
      - step: >-
          Read against the standard curve
        hand: >-
          A plate at a time on a shared reader.
        deck: >-
          Eight minutes a plate, with the GFP11 standard curve carried on the same plate
          so RFU converts to ug/mL.
        at: ["pherastar"]
        t: "8 min a plate"
    inputs:
      - item: Lysate or PURE kit
        spec: "two lots — lot is a factor in the DOE, not a constant"
      - item: Mg- and K-glutamate stocks
        spec: "Echo-compatible. Glycerol is the usual reason a stock will not transfer"
      - item: Template
        spec: "linear dsDNA or plasmid; linear needs GamS in lysate, nothing in PURE"
      - item: GFP1-10 reagent + GFP11 standard
        spec: "added in excess after expression; the standard curve is on every plate"
    note: >
      Run the four ATCs as four temperature arms. It is the only way to treat
      temperature as a real factor instead of a plate-level confound. The four
      are 3 x 96-well plus 1 x 384-well and all four run independent programs
      at once. The 384 block takes 5-20 uL against the 96 block's 10-100 uL,
      so both of the DOE's volume levels fit it — give the 384 arm the 5 uL
      runs and nothing about the design changes. At production scale the arms
      stop being the point and the 37 C SteriStore is: 288 standard positions
      of static incubation, at up to 98% RH if a reaction wants it, against
      four cycler blocks.

  - id: '4.4'
    name: E. coli expression, arrayed
    short: E. coli expression
    sub: for what cell-free will not make
    phase: express
    draw: cells
    status: ready
    deck: [multiflo, a4s, cytomat, hig3, multiflo, hig3]
    holds: [steristore_cold, steristore_warm, ambistore]
    gives: lysate ready for purification
    scale: 96 per plate
    time: overnight
    input: "Plasmid or fragment, BL21(DE3) and autoinduction medium"
    output: "A deep-well block of lysate, one culture per well"
    cost: {bravo: 0, echo: 0, reader: 0, binds: Cytomat — 14 deep-well positions and 7 concurrent culture protocols. Nothing else on the deck binds this}
    gates: [D1]
    steps:
      - step: >-
          Inoculate into autoinduction medium
        hand: >-
          Pipette medium into a deep-well block and inoculate well by well.
        deck: >-
          Bulk dispense into the block, then inoculate from the transformation.
          Autoinduction rather than timed IPTG is what makes an unattended overnight
          possible at all.
        at: ["multiflo"]
      - step: >-
          Apply the gas-permeable seal
        hand: >-
          A breathable membrane, pressed on.
        deck: >-
          The second sealer carries the breathable roll, so both seal types stay
          resident. A thermal foil would take a 20 h deep-well culture anaerobic.
        at: ["a4s"]
      - step: >-
          Grow overnight
        hand: >-
          A shaking incubator, and someone there in the morning.
        deck: >-
          Fourteen deep-well positions that shake and incubate. This, not the liquid
          handler, is the cap on everything that grows.
        at: ["cytomat"]
        t: "overnight"
      - step: >-
          Harvest the cells
        hand: >-
          A benchtop centrifuge, two plates at a time, by hand.
        deck: >-
          Two plates a run at 5000 g, about 20 seconds to speed, scheduled against
          everything else in flight.
        at: ["hig3"]
      - step: >-
          Lyse and clear
        hand: >-
          Sonicate, or add a detergent reagent and spin.
        deck: >-
          Detergent lysis from the bulk dispenser, then a second spin. There is no
          sonicator on the deck, so lysis is chemical.
        at: ["multiflo", "hig3"]
    inputs:
      - item: Plasmid or fragment
        spec: "pET29b — Kan, because this incubates unattended overnight"
      - item: BL21(DE3)
        spec: "chemically competent is fine; no colony picking either way"
      - item: Autoinduction medium
        spec: "ZYM-5052. Avoids timed IPTG, which is the point"
      - item: Lysis reagent
        spec: "detergent-based, plate-compatible; no sonication on deck"
    note: >
      Autoinduction avoids timed IPTG and suits unattended overnight running.
      The a4s applies the gas-permeable seal before the block goes in — a foil
      seal off the PlateLoc would take a 20 h deep-well culture anaerobic, and
      having two sealers is what keeps both seal types resident without a
      manual roll change. Growth goes on the Cytomat, which shakes and
      incubates — not the Bravo deck nests, which hold fixed temperatures and
      do not aerate. Grown blocks come off the Cytomat into the 4 C SteriStore;
      static, non-shaking recovery goes to the 37 C one.
    blocked: >
      Confirm the Cytomat's temperature range covers 30 C. If it does, yeast
      and slow-folding constructs stop being blocked on hardware.

  - id: '4.5'
    name: Magnetic bead purification
    short: Magnetic bead purification
    sub: His-tag on IMAC beads
    phase: purify
    draw: beads
    status: ready
    deck: [bravo, bioshake]
    holds: [microserve, steristore_cold, ambistore]
    gives: micrograms, which is plenty for plate assays
    scale: 96 per plate
    time: one hour
    input: "Cleared lysate or a finished cell-free reaction, and tagged beads"
    output: "Micrograms of eluted protein per well, in elution buffer"
    cost: {bravo: 60, echo: 0, reader: 0, binds: Bravo — 96 lysates per hour. A full 14-plate E. coli round is a 14 h serial step}
    gates: [D2]
    steps:
      - step: >-
          Bind
        hand: >-
          Add beads, mix by pipetting, incubate on a rocker.
        deck: >-
          Beads added by the 96-channel head and resuspended at 200-3,000 rpm on the
          deck shaker, right beside the magnet.
        at: ["bravo", "bioshake"]
        t: "8 min at 96"
      - step: >-
          Wash
        hand: >-
          Magnet rack, aspirate, resuspend, repeat - the plate is moved by hand each
          time.
        deck: >-
          The plate never leaves the deck between washes. That is the only reason this
          fits in an hour.
        at: ["bioshake", "bravo"]
      - step: >-
          Elute
        hand: >-
          Elution buffer, off the magnet.
        deck: >-
          The same, into the bead chemistry's buffer. Biotin elution poisons any
          downstream streptavidin step, so buffer-exchange after it or run the construct
          on a His tag instead.
        at: ["bravo"]
      - step: >-
          Hold, or hand straight to QC
        hand: >-
          Ice, then a fridge.
        deck: >-
          4 C random-access storage, or straight into 4.6. What comes off here is
          micrograms - crystallography protein does not come from this protocol.
        at: ["steristore_cold"]
    inputs:
      - item: MagStrep Strep-Tactin XT
        spec: "IBA 2-5090-002. Magnetic 6% agarose, binds Twin-Strep, 96-well compatible"
      - item: Buffer BXT
        spec: "biotin elution, mild. It poisons any downstream streptavidin step — buffer-exchange or use His instead"
      - item: EDTA/DTT-tolerant IMAC bead
        spec: "only if the construct is His-tagged: PureCube Ni-INDIGO (20 mM EDTA/DTT) or Pierce High-Capacity Ni-IMAC. Plain Ni-NTA strips in a cell-free reaction"
    note: >
      The BioShake resuspends beads between washes without the plate leaving
      the Bravo deck — 200-3,000 rpm on a 2.0 mm orbit, right next to the
      magnet. This is the most expensive hour on the system: at 96 lysates per
      hour it is the dominant cost in the E. coli route, and heat lysis at 95 C
      in a 96 block removes it entirely, 14 h to 2.1 h. Bead separation is the
      Bravo's job, not the Magniflex's — despite the name, a Cavro Magni Flex
      is a 2/4/8-channel pipetting framework with piston pumps and no magnet.
    blocked: >
      Not milligrams. Crystallography protein cannot come from here.

  - id: '4.6'
    name: Protein QC without a gel
    short: Protein QC
    sub: three questions, one instrument
    phase: purify
    draw: plot
    status: ready
    deck: [multiflo, pherastar, lynx]
    holds: [microserve, ambistore]
    gives: concentration, nucleic-acid carryover, aggregation — and a normalised plate
    scale: 384 per plate
    time: 30 min
    input: "The eluted plate, plus one detection reagent per question"
    output: "Concentration, A260/A280 and an aggregation flag per well, and a plate normalised to one concentration"
    cost: {bravo: 0, echo: 0, reader: 24, binds: PHERAstar — three reads of the same plate at 8 min each}
    gates: [D2]
    steps:
      - step: >-
          Concentration
        hand: >-
          A280 on a spectrophotometer, a sample at a time, and a reading that depends on
          how many tryptophans the design happens to have.
        deck: >-
          Split-GFP or HiBiT reagent from the bulk dispenser, read against a standard
          curve carried on the same plate - so designs are comparable with each other.
        at: ["multiflo", "pherastar"]
        t: "3 min a plate"
      - step: >-
          Nucleic-acid carryover
        hand: >-
          A260/A280 on the same instrument, sample by sample.
        deck: >-
          An aliquot into a UV-transparent plate, read in the same pass as everything
          else.
        at: ["multiflo", "pherastar"]
      - step: >-
          Aggregation
        hand: >-
          SEC, which costs a column run per sample.
        deck: >-
          An FP tracer added and polarisation read. A rise against the monomer control
          is the flag. It detects aggregation, not a change of oligomer state.
        at: ["multiflo", "pherastar"]
      - step: >-
          Normalise the plate before any assay sees it
        hand: >-
          Work out a dilution per well and pipette it. The plate is normalised on paper.
        deck: >-
          An in-line flow sensor on every channel measures what was actually delivered,
          so the plate is normalised by measurement rather than by nominal volume. 1 uL
          minimum, 2 uL at 2% CV.
        at: ["lynx"]
      - step: >-
          Band identity
        hand: >-
          A gel.
        deck: >-
          Still a gel, on a subset, off the deck. Purity in that sense is the one
          question this protocol cannot answer.
        at: ["offline"]
    inputs:
      - item: GFP1-10, or LgBiT + furimazine
        spec: "concentration; HiBiT if you want the dynamic range"
      - item: UV-transparent plate
        spec: "A260/A280 for nucleic-acid carryover"
      - item: FP tracer
        spec: "fluorescein or TAMRA; doubles as the aggregation readout"
    note: >
      Concentration from split-GFP, HiBiT or A280; carryover from A260/A280;
      aggregation by fluorescence polarisation. Purity as band identity still
      needs a gel on a subset, offline. The Lynx then normalises concentration
      across the plate before anything reaches an assay — 1 uL minimum, 2 uL at
      2% CV — so D3's concentration series starts from a flat plate rather than
      from whatever each well happened to express. Volume Verified Pipetting
      is what makes that worth doing: an in-line flow sensor on every channel
      measures what was actually delivered, per channel, in real time, so a
      normalised plate is measured rather than nominal and the per-well
      correction can be logged against the design.

  - id: '4.7'
    name: Binding — the assay ladder
    short: Binding ladder
    sub: four homogeneous formats
    phase: bind
    draw: assay
    status: ready
    deck: [echo, multiflo, plateloc, pherastar]
    holds: [ambistore, steristore_cold]
    gives: a binding signal per well
    scale: 384 routine, 1536 reachable
    time: 1-2 h
    input: "Protein and a tagged target, with one format's detection reagents"
    output: "A binding signal per well: a TR-FRET ratio, a luminescence count or a polarisation"
    cost: {bravo: 0, echo: 3, reader: 8, binds: "PHERAstar — 150 plates per 20 h day, and 3 min rather than 8 if the format is luminescent"}
    gates: [D3, D4]
    steps:
      - step: >-
          Pick the format
        hand: >-
          Four homogeneous formats, and the choice is the same at either scale.
        deck: >-
          NanoBiT reads straight out of crude cell-free and needs no purification at
          all; HTRF, AlphaScreen and FP each need protein in hand.
        at: ["offline"]
      - step: >-
          Build the plate
        hand: >-
          Multichannel into 384. 1536 is not realistic by hand.
        deck: >-
          Acoustic, so protein, target and controls land at 384 or 1536 for the same
          three minutes it would cost at 96.
        at: ["echo"]
        t: "3 min a plate"
      - step: >-
          Develop and seal
        hand: >-
          Reagent from a reservoir, seal pressed on.
        deck: >-
          Bulk dispense, then a thermal seal.
        at: ["multiflo", "plateloc"]
      - step: >-
          Hold to equilibrium
        hand: >-
          On the bench, timed by whoever is there.
        deck: >-
          Ambient random-access storage, returned when the reader is free.
        at: ["ambistore"]
      - step: >-
          One read
        hand: >-
          A plate at a time on a shared reader.
        deck: >-
          Eight minutes a TR-FRET plate, three if the format is luminescent. 150 plates
          in a 20 h day is the ceiling that matters here, not the liquid handler's 75.
        at: ["pherastar"]
        t: "8 min a TR-FRET plate"
    inputs:
      - item: Detection reagents
        spec: "by format: furimazine; Tb/Eu cryptate anti-tag donor + d2 acceptor; Alpha bead pair; or a tracer peptide"
      - item: Protein
        spec: "purified for HTRF/Alpha/FP, crude cell-free is enough for NanoBiT"
      - item: Target
        spec: "tagged to match the donor antibody"
    formats:
      - name: NanoBiT / split luciferase
        note: "reads straight out of crude cell-free, no purification — reach for it first"
      - name: HTRF
        note: "ratiometric 665/620, matrix-tolerant, the PARP14 workhorse"
      - name: AlphaScreen
        note: "the most sensitive, but bead-dependent and shows a hook effect"
      - name: Fluorescence polarisation
        note: "needs a ~10x mass ratio, so peptides and small molecules only"
    note: >
      The Echo builds the plate, so 384 and 1536 cost the same deck time as 96.
      Every format here is tipless on the way in and one read on the way out —
      this is the cheapest thing the foundry does per design, and it is why the
      ceiling that matters is the reader's 150 plates, not the Bravo's 75.
    blocked: >
      All four need protein in hand.

  - id: '4.8'
    name: Counter-screen and competition
    short: Counter-screen
    sub: did it bind the right face?
    phase: bind
    draw: counter
    status: ready
    deck: [echo, multiflo, plateloc, pherastar]
    holds: [ambistore, steristore_cold]
    gives: selectivity margin and IC50
    scale: same plate as 4.7
    time: 1-2 h
    input: "The binding plate, plus a homolog, a hotspot point-mutant and a non-binder control"
    output: "A selectivity margin per design: on-target signal against each control"
    cost: {bravo: 0, echo: 3, reader: 8, binds: "PHERAstar — but it is three extra columns on 4.7's plate, so in practice it costs nothing new"}
    gates: [D6]
    steps:
      - step: >-
          Lay three control columns onto the binding plate
        hand: >-
          Three more columns to pipette, and a second plate once the first is full.
        deck: >-
          Acoustic, onto the plate 4.7 already built: the counter-target homolog, a
          hotspot point-mutant of your own target, and a non-binder control from an
          unrelated campaign.
        at: ["echo"]
        t: "3 min a plate"
      - step: >-
          Add a competitor titration where an IC50 is wanted
        hand: >-
          A serial dilution, with the carryover a serial dilution brings.
        deck: >-
          Built acoustically into the same destination plate, from one titrant source.
        at: ["echo"]
      - step: >-
          Develop, seal and equilibrate
        hand: >-
          As 4.7, on a plate of its own.
        deck: >-
          As 4.7, on the same plate - which is why the counter-screen costs almost
          nothing new.
        at: ["multiflo", "plateloc"]
      - step: >-
          Read in one pass
        hand: >-
          Two reads, because the controls are on their own plate.
        deck: >-
          One read of the whole plate.
        at: ["pherastar"]
        t: "8 min a TR-FRET plate"
      - step: >-
          Report the selectivity margin
        hand: >-
          On-target signal against each control, per design.
        deck: >-
          The same, off the deck. The hotspot mutant is the only one of the three
          controls that catches a binder that found the wrong face; a homolog alone
          cannot tell you that.
        at: ["offline"]
    inputs:
      - item: Counter-target
        spec: "a homolog — Mac1 against MD1"
      - item: Hotspot point-mutant of your own target
        spec: "one extra construct. The only one of the three that catches a wrong-face binder"
      - item: Non-binder control
        spec: "a design against an unrelated target, carried on the same plate"
    note: >
      Three extra columns on the binding plate: the counter-target, the
      non-binder control, and the hotspot point-mutant of your own target. The
      mutant is the only one of the three that catches a wrong-face binder.

  - id: '4.9'
    name: Dose-response
    short: Dose-response
    sub: the thing the Echo is best at
    phase: bind
    draw: curve
    status: ready
    deck: [echo, multiflo, plateloc, pherastar]
    holds: [ambistore, steristore_cold]
    gives: KD or IC50 per hit
    scale: 384 per plate
    time: 1-2 h
    input: "Hits from 4.7, and one Echo source plate of titrant"
    output: "A KD or IC50 per hit, with the fitted curve behind it"
    cost: {bravo: 0, echo: 3, reader: 8, binds: PHERAstar — a serial dilution on the Bravo would cost 32 min of the bottleneck instead of 3 on the Echo}
    gates: [D5]
    steps:
      - step: >-
          Build the dilution series
        hand: >-
          Serial pipetting down the plate: tip-to-tip carryover, and even spacing
          whether or not the curve wants it.
        deck: >-
          Built acoustically in the destination from a single titrant source plate. No
          serial step, so no carryover, and the spacing can be non-linear where the
          interesting part of the curve is.
        at: ["echo"]
        t: "3 min a plate"
      - step: >-
          Backfill and develop
        hand: >-
          Top each well up to constant volume, then add reagents.
        deck: >-
          Bulk dispense does both in one pass.
        at: ["multiflo"]
      - step: >-
          Seal and equilibrate
        hand: >-
          Seal, then wait.
        deck: >-
          Thermal seal, then held until the reader is free.
        at: ["plateloc"]
      - step: >-
          Read the series
        hand: >-
          A plate at a time on a shared reader.
        deck: >-
          One plate - the whole series fits on it - scheduled against everything else in
          flight.
        at: ["pherastar"]
        t: "8 min a TR-FRET plate"
      - step: >-
          Fit
        hand: >-
          Fit the curve and report a KD or IC50 per hit.
        deck: >-
          The same, off the deck, with the fit kept behind the number.
        at: ["offline"]
    inputs:
      - item: One Echo source plate of titrant
        spec: "the series is built acoustically in the destination; no serial dilution"
    note: >
      The dilution series is built acoustically in the destination plate. No
      serial pipetting, no tip-to-tip carryover, non-linear spacing if you want it.

  - id: '4.10'
    name: Thermal stability
    short: Thermal stability
    sub: a challenge, not a melt
    phase: purify
    draw: heat
    status: limited
    deck: [plateloc, atc, xpeel, pherastar]
    holds: [ambistore]
    gives: residual binding after a temperature ladder
    scale: 384 per plate
    time: 3 h
    input: "A sealed assay plate, and the binding reagents it is read with"
    output: "Residual binding after each step of the temperature ladder, four points, not a Tm"
    cost: {bravo: 0, echo: 0, reader: 32, binds: "PHERAstar — four reads. The four ATC blocks run independent programs, so the ladder costs one pass, not four"}
    gates: []
    steps:
      - step: >-
          Prepare the binding assay and split it four ways
        hand: >-
          Four plates to set up, or one set up four times.
        deck: >-
          4.7 built once and split across four plates, one per temperature.
        at: ["offline"]
      - step: >-
          Seal each plate
        hand: >-
          Four seals, pressed on.
        deck: >-
          Four thermal seals.
        at: ["plateloc"]
      - step: >-
          Hold four temperatures at once
        hand: >-
          One block, so the ladder is four runs one after another.
        deck: >-
          Four blocks running independent programs, so the ladder costs one pass rather
          than four.
        at: ["atc"]
      - step: >-
          Peel
        hand: >-
          By hand, four times.
        deck: >-
          Up to 200 seals an hour.
        at: ["xpeel"]
      - step: >-
          Read residual binding
        hand: >-
          Four reads, and still four points.
        deck: >-
          Four reads. Four points, not a melt: neither cycler has optical detection, so
          a Tm has nowhere to be read on this system.
        at: ["pherastar"]
        t: "8 min a TR-FRET plate"
    inputs:
      - item: The binding assay's reagents
        spec: "residual binding is the readout, so this is 4.7 run after a heat step"
      - item: Sealed plates for the ladder
        spec: "four ATCs, four temperatures, one plate each — three 96-well at 10-100 uL and one 384-well at 5-20 uL"
    blocked: >
      DSF is not available. Neither ATC version has optical detection, so melt
      curves have nowhere to be read. This gives real stability data, but not a Tm.

  - id: '4.14'
    name: Heat-shock transformation
    short: Heat-shock transformation
    sub: the 45-second pulse, on the Bravo deck
    phase: dna
    draw: cells
    status: ready
    deck: [echo, bravo, multiflo, bioshake, cytomat, a4s, offline]
    holds: [steristore_cold, microserve, ambistore]
    gives: transformants in liquid — a pool, or one well per design
    scale: 96 per plate
    time: ~2 h, plus an hour of recovery
    input: "Assembled DNA and chemically competent cells, both held cold"
    output: "Transformants in liquid, and a titre from the plated dilution series"
    cost: {bravo: 24, echo: 3, reader: 0, binds: "Bravo — the pulse is a plate move between two deck nests, so the whole transformation is Bravo time"}
    gates: []
    steps:
      - step: >-
          Dispense DNA onto a cold plate
        hand: >-
          Assembled DNA into chilled tubes on ice.
        deck: >-
          Acoustic dispense into a plate already sitting on the 4 C deck nest.
        at: ["echo"]
        t: "3 min a plate"
      - step: >-
          Add competent cells, cold
        hand: >-
          Pipette cells into each tube, on ice.
        deck: >-
          A 96-channel addition with the plate never leaving 4 C.
        at: ["bravo"]
        t: "8 min at 96"
      - step: >-
          The 45-second pulse
        hand: >-
          A water bath and a stopwatch.
        deck: >-
          A plate move from the 4 C nest to the 42 C nest and back. A single block ramps
          at about 12 K/min and would take three minutes to cross; a cycler in another
          cart cannot time it at all.
        at: ["bravo"]
        t: "45 s at 42 C"
      - step: >-
          Recover
        hand: >-
          Add recovery medium, shake at 37 C for an hour.
        deck: >-
          Bulk dispense immediately after the pulse, then shaking on the deck for about
          an hour.
        at: ["multiflo", "bioshake"]
        t: "about 1 h"
      - step: >-
          Outgrow
        hand: >-
          Flasks, or a shaking block.
        deck: >-
          A shaking incubator position, scheduled with the rest of the day.
        at: ["cytomat"]
      - step: >-
          Titre, QC and sequence
        hand: >-
          Plate a dilution series, count, pick colonies, miniprep.
        deck: >-
          Plates are lidded on deck and the dilution series is for counting and checking
          only. Nothing here picks a colony, so no step returns a clone from agar back
          to liquid.
        at: ["a4s", "offline"]
    inputs:
      - item: Chemically competent cells
        spec: "delivered cold on the day; the coldest position on the system is the 4 C SteriStore, which also holds them in-run"
      - item: Assembled DNA
        spec: "Golden Gate product or plasmid, held at 4 C in SteriStore #1"
      - item: SOC or recovery medium
        spec: "MultiFlo, immediately after the pulse. The 1 uL cassette covers anything down to 1 uL a well"
      - item: Agar plates
        spec: "plating is in scope for titre and QC, lidded on the a4s. Colony picking is not — nothing returns a clone to liquid"
    ends: plating for titre and QC, and sequencing — nothing picks a colony
    note: >
      The Bravo carries TWO temperature-controlled deck nests, held at 4 C and
      42 C. The 45-second pulse is a plate move between them, which is the only
      way to get it: a single block ramps at 12 K/min and would take about three
      minutes to go from 4 C to 42 C, and a thermal cycler in another RAC cannot
      time it at all. Two fixed-temperature positions, one move. Transformation
      and plating are in scope on the RAC; colony picking is not, so plating is
      for titre and QC. This is why the pET21b/29b/22b/28a and pSB4k5 backbones
      in reference/constructs.md are specified as they are.

  - id: '4.11'
    name: Crystallisation screening
    short: Crystallisation screen
    sub: screens protein, does not make it
    phase: structure
    draw: drop
    status: offline
    deck: [offline, echo, offline]
    holds: [ambistore]
    gives: nL drops in condition matrices
    scale: 1536
    time: hours to set, weeks to grow
    input: "Purified protein at >=10 mg/mL from offline expression, and commercial screens"
    output: "1,536 sitting drops, scored clear, precipitate or crystal"
    cost: {bravo: 0, echo: 9, reader: 0, binds: Echo — 80 trays is 11.5 h on-system against 48.9 h once imaging is done by hand}
    gates: [D7]
    steps:
      - step: >-
          Make the protein
        hand: >-
          Flask expression and column purification to milligram scale at 10 mg/mL or
          better.
        deck: >-
          Off the deck. Bead purification reaches micrograms and the gap is not close:
          this protocol screens crystallisation protein, it does not make it.
        at: ["offline"]
      - step: >-
          Set the drops
        hand: >-
          A dedicated drop-setter, or by hand at 96.
        deck: >-
          Acoustic sitting drops at 1536, protein against condition, apo or co-
          crystallised. Eighty trays is 11.5 h on-system.
        at: ["echo"]
        t: "3 min a plate"
      - step: >-
          Close and store the trays
        hand: >-
          A shelf, and a list of which tray is where.
        deck: >-
          A lid, never a seal - both sealers are thermal and a 200 nL drop has no
          thermal mass to survive either. Trays sit on a carousel that returns one in as
          little as 12 seconds.
        at: ["ambistore"]
        t: "weeks to grow"
      - step: >-
          Image and score
        hand: >-
          A microscope. Eighty trays is 48.9 h of hand scoring.
        deck: >-
          Still by hand. The imager cart is not quoted, and it is the single thing
          standing between this protocol and running unattended.
        at: ["offline"]
    inputs:
      - item: Protein at >=10 mg/mL
        spec: "from offline expression. Mag beads cannot reach this"
      - item: Commercial screens
        spec: "standard sparse-matrix kits as Echo source plates"
      - item: SwissCI plates
        spec: "sitting-drop, Echo-addressable"
      - item: Compound stocks in DMSO
        spec: "needs the Echo 6XX; the 525 cannot transfer DMSO"
    ends: imaging, then diffraction
    blocked: >
      Needs the Echo 6XX, not the 525 — the 525 cannot do DMSO, 1536, or the
      drop volumes this needs. Imagers and automated scoring are unquoted.
    note: >
      Purified protein at milligram scale and 10+ mg/mL comes in from offline
      expression. Then: drop setting, co-crystallisation against soaking, and
      fragment screening from DMSO stocks. A tray with drops already in it is
      closed with a lid, not a seal — both sealers on the system are thermal
      (PlateLoc 30-200 C, a4s 100-195 C) and a 200 nL drop has no thermal mass
      to survive either. Trays live in the AmbiStore, which is why that unit
      carries 216 standard positions and is delivered by a carousel that
      returns a plate in as little as 12 seconds: a rotating tray library is
      exactly the access pattern it is built for.

  - id: '4.12'
    name: Compound and fragment screening
    short: Fragment screen
    sub: the same spine, compound plates instead
    phase: bind
    draw: chem
    status: ready
    deck: [echo, multiflo, plateloc, pherastar]
    holds: [ambistore]
    gives: hit list from a compound library
    scale: 1536
    time: 1-2 h
    input: "A compound library in DMSO, and the 4.7 assay spine"
    output: "A hit list: percent effect per compound, against the plate's own controls"
    cost: {bravo: 0, echo: 3, reader: 8, binds: PHERAstar — the same plate cost as 4.7 for four times the wells}
    gates: []
    steps:
      - step: >-
          Transfer compound from the DMSO library
        hand: >-
          A pin tool or a multichannel, with the carryover a pin tool brings.
        deck: >-
          Acoustic and tipless at 1536. DMSO transfer needs the 6XX-series dispenser;
          the 525 cannot do it.
        at: ["echo"]
        t: "3 min a plate"
      - step: >-
          Add protein and target on top
        hand: >-
          Multichannel, and 384 at best.
        deck: >-
          The same assay spine as 4.7, built acoustically on top of the compound.
        at: ["echo"]
      - step: >-
          Develop, seal and equilibrate
        hand: >-
          As 4.7.
        deck: >-
          As 4.7 - the same reagents off a different source plate.
        at: ["multiflo", "plateloc"]
      - step: >-
          Read
        hand: >-
          Four 384 plates.
        deck: >-
          One 1536 plate, at the same plate cost as 4.7 for four times the wells.
        at: ["pherastar"]
        t: "8 min a TR-FRET plate"
      - step: >-
          Report, and put the library back
        hand: >-
          Percent effect per compound; the source plate goes back to a freezer.
        deck: >-
          Percent effect against the plate's own controls, and the compound source plate
          returns to ambient storage between runs.
        at: ["ambistore"]
    inputs:
      - item: Compound plates in DMSO
        spec: "the Echo 6XX again"
      - item: The 4.7 reagents
        spec: "same spine, different source plate"
    note: >
      Essentially free once 4.7 works, and it is what makes the foundry useful
      to labs that are not designing proteins at all. Compound source plates sit
      in the AmbiStore between runs.

  - id: CF2H
    name: Cell-free two-hybrid screen
    short: Two-hybrid, one well
    sub: expression and binding in one well
    phase: bind
    draw: model
    status: build
    protocol: bind.cf2h.screen
    deck: [echo, multiflo, bravo, plateloc, pherastar]
    holds: [microserve, steristore_cold, ambistore]
    gives: a rank, not a number — fold-activation per design
    scale: 36 designs per 384 plate, in triplicate
    time: 4-8 h
    input: "CI-fusion fragments, the reporter plasmid and a dRecBCD extract"
    output: "Fold activation per design, a rank rather than an affinity"
    cost: {bravo: 32, echo: 3, reader: 8, binds: "Bravo — the cold master mix goes into a 384 plate, which is four offset quadrant transfers"}
    gates: [D1, D4, D6]
    steps:
      - step: >-
          Dispense every DNA component first
        hand: >-
          Pipette the fragments and the reporter into each well.
        deck: >-
          Acoustic: CI-fusion fragments normalised to 50 nM and the reporter plasmid to
          5 nM final. DNA before the cold master mix is what makes an ambient-deck
          sequence survivable.
        at: ["echo"]
        t: "3 min a plate"
      - step: >-
          Add the cold extract master mix
        hand: >-
          On ice, by multichannel.
        deck: >-
          The 96-channel head into 384, which is four offset quadrant transfers and 32
          minutes of the system bottleneck. If this mix can be made acoustic it drops to
          three.
        at: ["bravo"]
        t: "32 min at 384"
      - step: >-
          Top up to volume
        hand: >-
          Multichannel from a reservoir.
        deck: >-
          Bulk dispense. In the streptavidin format the pre-mixed biotinylated target
          goes in here at 150 nM.
        at: ["multiflo"]
      - step: >-
          Seal and hold while it expresses and binds
        hand: >-
          Seal, then incubate for 4-8 h.
        deck: >-
          Thermal seal, then ambient storage while expression and binding run in the
          same well.
        at: ["plateloc", "ambistore"]
        t: "4-8 h"
      - step: >-
          Read sfGFP
        hand: >-
          A plate on a shared reader.
        deck: >-
          Three minutes a plate, converted to mean-equivalent units against the FITC
          standard so the numbers survive a change of reader.
        at: ["pherastar"]
        t: "3 min a plate"
    inputs:
      - item: dRecBCD extract
        spec: "BL21 Rosetta 2 dRecBCD, homemade S30 at EUR0.10/reaction, or commercial lysate plus GamS at EUR5-10"
      - item: CF2H buffer
        spec: "15 mM Mg-glutamate, 100 mM K-glutamate in their hands — recalibrate per extract lot"
      - item: pRM/OR3* sfGFP reporter plasmid
        spec: "5 nM final, low copy. A high-copy reporter titrates CI"
      - item: CI-fusion fragments
        spec: "PCR-amplified from eBlocks, gel-checked, normalised to 50 nM"
      - item: FITC standard
        spec: "converts raw RFU to mean-equivalent units so numbers survive a change of reader"
      - item: Biotinylated target + streptavidin
        spec: "format 3 only: pre-mixed 1:1 at 150 nM"
    blocked: >
      Three offline components that do not exist yet: the pRM/OR3* sfGFP
      reporter plasmid, the CI(1-92)+GGSx5 cassette, and a dRecBCD extract.
    note: >
      No purified protein on either side. Dispense every DNA component before
      the cold master mix — that ordering is what makes an ambient-deck
      sequence survivable. Nothing weaker than ~100 nM is detected. Note the
      cost: this is the only binding workflow that puts the Bravo in the chain,
      and at 384 that single step costs 32 min of the system bottleneck against
      3 min on the Echo. If the cold master mix can be acoustic, move it.

# The loops. Section 5 of capabilities.md.
# where: compute (yours to build) · rac (on the Ginkgo) · offrac (not there yet)
# Same three colours as the stage page, so a loop that leaves the rack shows it.

loops:

  - id: expression
    name: Expression loop
    closes: days
    steps:
      - {label: factorial screen, where: rac, draw: assay}
      - {label: effect sizes, where: compute, draw: plot}
      - {label: optimise, where: compute, draw: tune}
      - {label: fix condition, where: rac, draw: plate}
    returns: >
      An expression route assigned to each new target. That model is Aim 1's
      real product — not the condition for any one protein.

  - id: binder
    name: Binder loop
    closes: weeks
    steps:
      - {label: design, where: compute, draw: model}
      - {label: express, where: rac, draw: plate}
      - {label: screen, where: rac, draw: assay}
      - {label: confirm, where: rac, draw: curve}
      - {label: counter-screen, where: rac, draw: counter}
      - {label: retrain, where: compute, draw: tune}
    returns: >
      Every measured design, failures included. A design that did not express
      is not a non-binder — keep three outcomes, True / False / Unknown, the
      way Adaptyv does.

  - id: maturation
    name: Affinity-maturation loop
    closes: weeks
    steps:
      - {label: NNK design, where: compute, draw: model}
      - {label: build library, where: rac, draw: plate}
      - {label: screen, where: rac, draw: assay}
      - {label: rank, where: compute, draw: plot}
    returns: >
      Ranked variants around a confirmed hit. This is the loop that genuinely
      wants pooled handling, and the strongest argument for settling NGS.

  - id: structure
    name: Structure loop
    closes: months
    steps:
      - {label: pick hits, where: compute, draw: pick}
      - {label: scale up, where: offrac, draw: flask}
      - {label: crystallise, where: rac, draw: drop}
      - {label: diffract, where: offrac, draw: xray}
      - {label: compare to model, where: compute, draw: overlay}
    returns: >
      Filters promoted or demoted on evidence. The only loop that tells you
      whether the models were right about where a binder sits, not only about how tightly.

  - id: compound
    name: Compound loop
    closes: months
    steps:
      - {label: fragment screen, where: rac, draw: assay}
      - {label: hits, where: compute, draw: plot}
      - {label: co-crystallise, where: rac, draw: drop}
      - {label: diffract, where: offrac, draw: xray}
      - {label: chemistry, where: offrac, draw: chem}
    returns: >
      Not your programme. It is what makes this a service rather than a
      project, and it runs on the same Echo-plus-PHERAstar spine.

# A day is not one workflow, it is a chain of them. These are the chains
# worth costing. `steps` are workflow ids in the order they run.
routes:
  - id: cellfree
    name: Cell-free, arrayed
    sub: the bread and butter - no cells anywhere
    steps: ['4.1', '4.3', '4.5', '4.6', '4.7', '4.9']
  - id: ecoli
    name: E. coli, arrayed
    sub: for designs cell-free will not make
    steps: ['4.1', '4.4', '4.5', '4.6', '4.7', '4.9']
  - id: invitro
    name: In-vitro assembly
    sub: a plasmid that never sees a cell
    steps: ['4.13', '4.3', '4.5', '4.6', '4.7']
  - id: cf2h
    name: CF2H
    sub: expression and binding in one well, nothing purified
    steps: ['4.1', 'CF2H']
  - id: selectivity
    name: The selectivity block
    sub: what D6 needs, on one plate
    steps: ['4.7', '4.8', '4.9']
