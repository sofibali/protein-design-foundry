name: Check data and templates

# GitHub Pages builds the site itself, so this only checks what Jekyll will
# not: that every key in the data files and project front matter resolves,
# and that the templates hold together. There is no Ruby on the machines
# these are written on, so without this a template fault is first seen on
# the live page.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - run: python3 scripts/check_data.py
      - run: python3 scripts/check_templates.py
