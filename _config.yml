name: "Protein Design Foundry"
description: "An automated protein design facility at UCSF Mission Bay."
short_name: "Protein Design Foundry"

url: "https://sofibali.github.io"
baseurl: "/protein-design-foundry"

plugins: [jekyll-sitemap]

permalink: pretty
markdown: kramdown
kramdown:
  parse_block_html: true

collections:
  projects:
    output: true
    permalink: /projects/:name/
  instruments:
    output: true
    permalink: /inventory/:name/

defaults:
  - scope: {path: "", type: "projects"}
    values: {layout: "project"}
  - scope: {path: "", type: "instruments"}
    values: {layout: "instrument"}
  - scope: {path: ""}
    values: {layout: "page"}

# The four built pages come first: they are the interactive ones, and they are
# what someone is sent a link to. They sit under /static/pages/ rather than at
# a pretty URL because they cross-link to each other by bare filename, and
# because they are built to be self-contained - the same file opens from a
# mail attachment as from the site.
# This is the site's ONE navigation system. The homepage used to repeat all
# seven of these as cards underneath it, which made 15 links to 7 places on
# one page, and three of them carried a different name in the header than on
# the card. The cards are gone; the names here are now the names the built
# pages' own step strip uses, so a destination is called one thing wherever
# it is linked from. If you rename a page, rename it in BOTH places:
# scripts/build_pages.py's PATH holds the other half.
nav:
  - {title: "What the foundry is for", url: "/static/pages/foundry.html"}
  - {title: "Sample protocols",  url: "/static/pages/workflows.html"}
  - {title: "System blueprint",  url: "/static/pages/blueprint.html"}
  - {title: "Propose a campaign", url: "/static/pages/intake.html"}
  - {title: "Capabilities", url: "/capabilities/"}
  - {title: "Projects",     url: "/projects/"}
  - {title: "Inventory",    url: "/inventory/"}

exclude:
  - README.md
  - CLAUDE.md      # instructions for sessions, not a page
  - scripts/
  - pages/          # page templates; the built versions are in static/pages/
  - protocols/      # protocol source, no front matter yet
  - reference/      # research notes, no front matter yet
  - .github/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .jekyll-cache/
