<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Blueprint</title>
<style>
  /* --muted carries most of the explanatory text on this page. At #8e8e93 on
     white it is 3.26:1, under the 4.5:1 WCAG AA needs for body text. #6e6e73
     is 5.07:1 and passes. It cannot be one value for both themes: #6e6e73 on
     the dark background is only 3.63:1, so dark keeps #8e8e93, which is
     5.64:1 there. */

  /* A visible focus ring on everything keyboard-reachable. */
  a:focus-visible, button:focus-visible, summary:focus-visible,
  [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--ink); outline-offset:2px; border-radius:3px}
  .tile:focus-visible{outline:2px solid #fff;outline-offset:2px}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition-duration:.01ms !important;
      animation-duration:.01ms !important;scroll-behavior:auto !important}
  }

  /* These pages get printed for meetings, and <details> prints collapsed by
     default - which on the blueprint means fifteen headings and no specs. */
  @media print{
    :root{--bg:#fff;--ink:#000;--muted:#333;--rule:#999}
    .path,.next,.skip,.nav{display:none !important}
    details{display:block !important}
    details > *{display:revert !important}
    details .ddb,details .why,details .gitems{display:block !important}
    .sheet,.elev{background:#fff !important}
    a[href^="http"]::after{content:" (" attr(href) ")";font-size:10px;color:#555}
    section,article,.lev,.gi,.wf{break-inside:avoid}
  }

  :root {
    --bg:#fff; --ink:#1d1d1f; --muted:#6e6e73; --rule:#d2d2d7; --tab-bg:#f2f2f4;
    --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
    /* the drawing is a technical drawing: blueprint paper in either theme */
    --paper:#22364e; --grid:#3d5c80; --line:#e8eef5; --dim:#8fa6bd;
    /* --on-paper is 5.1:1 on the tile fill, where --dim is only 4.0:1.
       --accent-p only ever sits on the paper; --accent only ever sits on
       the page, so it has to flip with the theme the way --muted does:
       #56B4E9 is 2.3:1 on white, and #1168a8 is 3.1:1 on the dark page. */
    --on-paper:#a8bdd2; --accent-p:#8ecbf3; --accent:#1168a8;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme=light]){
    --bg:#141416; --ink:#f2f2f4; --muted:#8e8e93; --rule:#3a3a3d; --tab-bg:#242427;
    --accent:#56B4E9;
  }}
  :root[data-theme=dark]{ --bg:#141416; --ink:#f2f2f4; --rule:#3a3a3d; --tab-bg:#242427;
    --muted:#8e8e93; --accent:#56B4E9; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 16px 56px}
  header{text-align:center;margin-bottom:18px}
  h1{font-weight:400;font-size:clamp(22px,3vw,34px);margin:0;letter-spacing:-.01em}
  .sub{font-size:clamp(15px,2vw,19px);margin-top:3px}
  .note{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.5}
  .nav{text-align:center;font-size:13px;margin-top:10px}
  .nav a{color:var(--muted)}
  .nav a:hover{color:var(--ink)}

  /* a drawn panel: what the cart does, in page colours rather than on paper */
  .cfig{margin:13px 0 0;border:1px solid var(--rule);border-radius:9px;padding:8px 10px}
  .cfig figcaption{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
                   color:var(--muted);margin-bottom:4px}
  .cfig svg{display:block;width:100%;max-width:430px;height:auto;margin:0 auto;
            font-family:var(--font)}
  svg .ln{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-linejoin:round;stroke-linecap:round}
  svg .mu{fill:none;stroke:var(--muted);stroke-width:1}
  svg .dash{stroke-dasharray:3 2.5}
  svg .fl,svg .none{stroke:none}
  svg text.lb{font-size:8.5px;fill:var(--ink)}
  svg text.sm{font-size:7.5px;fill:var(--muted)}

  /* The sheet: the carts under the heading you would look for them under.
     It used to draw them wired into a closed track loop, which cost most of
     the page's height to assert a flow the machine does not have - a plate
     goes where the schedule sends it, not once around a ring. */
  .sheet{background:var(--paper);border-radius:14px;padding:17px 16px 19px;
         box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .grp + .grp{margin-top:19px;padding-top:16px;border-top:1px solid rgba(232,238,245,.14)}
  .grp > h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:500;
            color:var(--line);margin:0}
  .grp > p{font-size:12.5px;color:var(--dim);margin:3px 0 11px;line-height:1.45;max-width:74ch}
  .grp.minor > h2{color:var(--on-paper);font-size:11px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
  .tile{appearance:none;-webkit-appearance:none;font:inherit;text-align:left;cursor:pointer;
        display:flex;flex-direction:column;gap:6px;color:var(--line);background:#2c4463;
        border:1.3px solid var(--line);border-radius:12px;padding:11px 11px 10px}
  .tile .tc{margin-top:auto}
  .tile:hover{background:#36516f}
  .tile[aria-pressed=true]{background:#3d5c7e;border-color:var(--accent-p);border-width:2px;
                           padding:9.7px 9.7px 8.7px}
  .tile.dim{opacity:.34}
  .tile .gl{display:block;width:40px;height:40px}
  .tile .gl path{fill:none;stroke:var(--line);stroke-width:1.6;
                 stroke-linecap:round;stroke-linejoin:round}
  .tile .tn{font-size:13px;line-height:1.3}
  .tile .tc{font-size:11px;color:var(--on-paper);font-variant-numeric:tabular-nums}
  .tile .io{color:var(--accent-p)}

  /* legend */
  .bar{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12.5px;color:var(--muted);
       margin:14px 2px 0;align-items:center}
  .bar span{display:inline-flex;align-items:center;gap:7px}

  /* ---------- the cart detail sheet ---------- */
  .detail{border:1px solid var(--rule);border-radius:12px;margin-top:16px;overflow:hidden}
  .ttl{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--rule);
       font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}
  .ttl .r{margin-left:auto;letter-spacing:.09em}
  .dbody{padding:15px 16px 17px}
  .dhd{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
  .dhd h3{font-size:19px;font-weight:400;margin:0;letter-spacing:-.01em}
  .dhd .no{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
  .detail .unitop{font-size:13.5px;color:var(--muted);margin-top:3px}
  .classes{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .cls{font-size:11.5px;border-radius:999px;padding:2px 10px;border:1px solid;
       text-transform:lowercase;letter-spacing:.01em}
  .detail p.lead{font-size:13.5px;line-height:1.52;margin:11px 0 0;max-width:76ch}
  .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
       color:var(--muted);margin-top:16px;font-weight:500}
  .split{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;margin-top:7px;
         align-items:start}
  .elev{background:var(--paper);border-radius:9px;padding:5px}
  .elev svg{display:block;width:100%;height:auto;font-family:var(--font)}
  .el-l{font-size:9px;fill:var(--dim);letter-spacing:.03em}
  .el-i{font-size:10px;fill:var(--line)}
  .el-d{font-size:8.5px;fill:var(--dim);font-variant-numeric:tabular-nums}
  .spec{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:8px}
  .spec:first-child{margin-top:0}
  .spec b{color:var(--ink);font-weight:500}

  /* a spec is a table of rows, not a paragraph to pick apart */
  .kv{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
  .kv td{padding:6px 0;border-top:1px solid var(--rule);vertical-align:top;line-height:1.45}
  .kv tr:first-child td{border-top:0}
  .kv td.k{color:var(--muted);width:38%;padding-right:16px;word-break:break-word}
  .kv td.v{color:var(--ink)}
  .kv td.v em{font-style:normal;color:var(--muted)}

  /* everything past the first paragraph is behind a disclosure, so a cart
     opens at a glance and goes deeper only when asked */
  .dd{border-top:1px solid var(--rule)}
  .dd:last-of-type{border-bottom:1px solid var(--rule)}
  .dd>summary{list-style:none;cursor:pointer;padding:10px 0;display:flex;
              align-items:baseline;gap:9px;font-size:13px}
  .dd>summary::-webkit-details-marker{display:none}
  .dd>summary::before{content:"";flex:none;width:7px;height:7px;margin-top:4px;
       border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);
       transform:rotate(-45deg);transition:transform .15s}
  .dd[open]>summary::before{transform:rotate(45deg)}
  .dd>summary:hover{color:var(--accent)}
  .dd .cnt{margin-left:auto;color:var(--muted);font-size:11.5px;
           font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .dd .sv{color:var(--muted);font-size:12px}
  .ddb{padding:2px 0 14px}
  .prose{font-size:12.5px;color:var(--muted);line-height:1.5;margin:11px 0 0;max-width:76ch}
  .more{display:inline-block;margin-top:11px;font-size:12px;color:var(--accent);
        text-decoration:none;border-bottom:1px solid transparent}
  .more:hover{border-bottom-color:var(--accent)}

  .ptab{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
  .ptab th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
           font-weight:500;text-align:left;padding:0 0 6px;border-bottom:1px solid var(--rule)}
  .ptab td{padding:6px 0;border-top:1px solid var(--rule);line-height:1.4;vertical-align:top}
  .ptab td.id{width:46px;color:var(--muted);font-variant-numeric:tabular-nums}
  .ptab td.ph{width:112px}
  .ptab .dot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;
             vertical-align:middle}
  .ptab th.id{width:46px} .ptab th.ph{width:112px}

  .protos{display:grid;gap:5px;margin-top:6px}
  .pr{display:grid;grid-template-columns:34px minmax(0,1fr);gap:9px;font-size:12.5px;
      align-items:baseline;border-left:3px solid;padding:3px 0 3px 9px}
  .pr .pid{color:var(--muted);font-variant-numeric:tabular-nums}
  .empty{color:var(--muted);font-size:13px;line-height:1.55;margin:0}

  /* ---------- phase 2 ---------- */
  .p2sec{margin-top:40px}
  .p2sec > h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:500;
              margin:0 0 4px;padding-bottom:6px;border-bottom:2px solid var(--rule)}
  .p2sec .intro{color:var(--muted);font-size:12.5px;margin:10px 0 14px;max-width:78ch;line-height:1.55}
  .p2grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:11px}
  .p2card{border:1px dashed var(--rule);border-radius:11px;padding:13px 14px 14px}
  .p2card .ph{display:flex;align-items:center;gap:10px}
  .p2card .mini{width:40px;height:40px;border-radius:9px;border:1.3px dashed var(--muted);
                flex:none;display:grid;place-items:center}
  .p2card .mini svg{display:block;width:24px;height:24px}
  .p2card .mini path{fill:none;stroke:var(--muted);stroke-width:1.5;
                     stroke-linecap:round;stroke-linejoin:round}
  .p2card h3{font-size:14.5px;font-weight:500;margin:0;letter-spacing:-.005em}
  .p2card .n2{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px}
  .p2card p{font-size:12.5px;line-height:1.5;color:var(--muted);margin:10px 0 0}
  .p2card .classes{margin-top:10px}

  .foot{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:28px;
        border-top:1px solid var(--rule);padding-top:4px}
  .foot b{color:var(--ink);font-weight:500}
  .foot .fline{margin:8px 0 2px}
  .foot .dd:last-of-type{border-bottom:0}
  .foot .kv{max-width:560px}
  @media (max-width:700px){ .split{grid-template-columns:1fr} }
</style>
</head>

<style>

  .path li:first-child a,.path li:first-child span{border-left:0}

  .next a{font-size:15px;color:var(--ink);text-decoration:none;font-weight:500;
        border-bottom:1px solid var(--rule)}

  .skip:focus{left:8px;top:8px;z-index:50;position:fixed;background:var(--bg);color:var(--ink);

</style>

<script>
// The drawing kit the figures on these pages are made of.
//
// Shared by the protocol library (workflows.html) and the cart details
// (blueprint.html), inlined into both by scripts/build_pages.py so each page
// stays a single file you can mail. Every panel is built from these few
// primitives, which is what keeps fifteen protocols and nineteen carts
// looking like they came out of the same pen.
(function () {
const esc = t => String(t).replace(/[&<>]/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[m]));
// Two panels per protocol, drawn the way panel A of a paper is drawn: what
// physically happens on the deck, and what the readout looks like when it
// comes back. The sample panels are sketches of the shape of the answer,
// not measurements - every one of them carries a tag saying so.
const gv = (o, k, d) => (o && o[k] !== undefined) ? o[k] : d;
const n1 = v => Math.round(v * 10) / 10;
const G = {
  // primitives
  r: (x, y, w, h, o) => `<rect x="${n1(x)}" y="${n1(y)}" width="${n1(w)}" height="${n1(h)}"`
    + ` rx="${gv(o, 'r', 2.5)}" class="${gv(o, 'c', 'ln')}"`
    + ((o && o.f) ? ` fill="${o.f}" fill-opacity="${gv(o, 'o', .16)}"` : '') + `/>`,
  c: (x, y, rr, o) => `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(rr)}" class="${gv(o, 'c', 'ln')}"`
    + ((o && o.f) ? ` fill="${o.f}" fill-opacity="${gv(o, 'o', .16)}"` : '') + `/>`,
  dot: (x, y, rr, col) => `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(rr)}" class="fl"`
    + ` fill="${col || 'var(--ink)'}"/>`,
  l: (x1, y1, x2, y2, o) => `<line x1="${n1(x1)}" y1="${n1(y1)}" x2="${n1(x2)}" y2="${n1(y2)}"`
    + ` class="${gv(o, 'c', 'ln')}"/>`,
  p: (d, o) => `<path d="${d}" class="${gv(o, 'c', 'ln')}"`
    + ((o && o.f) ? ` fill="${o.f}" fill-opacity="${gv(o, 'o', .16)}"` : '') + `/>`,
  t: (x, y, s, o) => `<text x="${n1(x)}" y="${n1(y)}" class="${gv(o, 'c', 'lb')}"`
    + ` text-anchor="${gv(o, 'a', 'middle')}"`
    + ((o && o.rot) ? ` transform="rotate(${o.rot} ${n1(x)} ${n1(y)})"` : '') + `>${esc(s)}</text>`,

  // an arrow with its head drawn as a path, so no page-wide marker ids
  a: (x1, y1, x2, y2, o) => {
    const an = Math.atan2(y2 - y1, x2 - x1), hh = gv(o, 'h', 4.2);
    const bx = x2 - Math.cos(an) * hh, by = y2 - Math.sin(an) * hh;
    const px = Math.sin(an) * hh * .52, py = -Math.cos(an) * hh * .52;
    const col = gv(o, 'fill', 'var(--muted)');
    return G.l(x1, y1, bx, by, {c: gv(o, 'c', 'mu')})
      + `<path class="fl" fill="${col}" d="M${n1(x2)} ${n1(y2)}L${n1(bx + px)} ${n1(by + py)}`
      + `L${n1(bx - px)} ${n1(by - py)}Z"/>`;
  },

  // a plate seen from above, optionally with wells filled by a function
  plate: (x, y, w, h, cols, rows, o) => {
    o = o || {};
    let s = G.r(x, y, w, h, {r: 2, f: o.f, o: o.o, c: gv(o, 'c', 'ln')});
    const pd = gv(o, 'pad', 3), dx = (w - 2 * pd) / cols, dy = (h - 2 * pd) / rows;
    const rr = Math.min(dx, dy) * gv(o, 'wr', .32);
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
      const cx = x + pd + dx * (i + .5), cy = y + pd + dy * (j + .5);
      const fill = o.well ? o.well(i, j) : null;
      s += fill ? G.dot(cx, cy, rr, fill) : G.c(cx, cy, rr, {c: 'mu'});
    }
    return s;
  },

  // a single well seen in section, and the liquid standing in it
  well: (x, y, w, h, o) => G.p(`M${n1(x)} ${n1(y)}V${n1(y + h - 5)}Q${n1(x)} ${n1(y + h)}`
    + ` ${n1(x + 5)} ${n1(y + h)}H${n1(x + w - 5)}Q${n1(x + w)} ${n1(y + h)} ${n1(x + w)}`
    + ` ${n1(y + h - 5)}V${n1(y)}`, o),
  liq: (x, y, w, h, top, col) => G.p(`M${n1(x)} ${n1(top)}V${n1(y + h - 5)}Q${n1(x)} ${n1(y + h)}`
    + ` ${n1(x + 5)} ${n1(y + h)}H${n1(x + w - 5)}Q${n1(x + w)} ${n1(y + h)} ${n1(x + w)}`
    + ` ${n1(y + h - 5)}V${n1(top)}Z`, {c: 'none', f: col, o: .22}),

  // axes, drawn as an L
  ax: (x, y, w, h) => G.p(`M${n1(x)} ${n1(y)}V${n1(y + h)}H${n1(x + w)}`, {c: 'mu'}),
  poly: (pts, o) => `<polyline points="${pts.map(p => n1(p[0]) + ',' + n1(p[1])).join(' ')}"`
    + ` class="${gv(o, 'c', 'ln')}"/>`,
  arc: (cx, cy, rr, a0, a1, col, wd) => {
    const pt = a => [cx + rr * Math.cos(a * Math.PI / 180), cy + rr * Math.sin(a * Math.PI / 180)];
    const s = pt(a0), e = pt(a1);
    return `<path d="M${n1(s[0])} ${n1(s[1])}A${rr} ${rr} 0 ${(a1 - a0) > 180 ? 1 : 0} 1`
      + ` ${n1(e[0])} ${n1(e[1])}" fill="none" stroke="${col}" stroke-width="${wd || 4}"/>`;
  }
};
// deterministic pseudo-random, so a figure draws the same way every time
const rnd = seed => { let s = seed; return () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648; };
const svg = (body, label, h, w) => `<svg viewBox="0 0 ${w || 320} ${h || 136}" role="img"`
  + ` aria-label="${esc(label)}">` + body + `</svg>`;

// STEP GLYPHS START
// One small drawing per kind of step - what happens at that stop on a
// loop, and what each protocol in a proposed pipeline does. Keyed by

  const B = window.BLUEPRINT;

  const INST = {}; B.instruments.forEach(i => { INST[i.id] = i; });
  const WF   = {}; B.workflows.forEach(w => { WF[w.id] = w; });
  const PH   = {}; B.phases.forEach(p => { PH[p.id] = p; });
  const esc = t => String(t).replace(/[&<>"]/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

  // the drawing kit (pages/figkit.js, inlined by the build)
  const G = window.FIGKIT.G, svg = window.FIGKIT.svg, rnd = window.FIGKIT.rnd;

  // The four cabinets on the system are the same object with different
  // contents: shelves behind a door, and a port the track hands plates
  // through. Drawing them from one function is what stops them drifting
  // apart on a page where their only real difference is the temperature.
  const cabinet = (c, o) => {
    const X = 86, Y = 12, W = 116, H = 106, rows = o.rows || 7;
    const pitch = (H - 24) / rows;
    let b = G.r(X, Y, W, H, {r: 5, f: c, o: .07});
    for (let i = 0; i < rows; i++) {
      const y = Y + 14 + i * pitch;
      b += G.l(X + 8, y + 8.5, X + W - 8, y + 8.5, {c: 'mu'})
        + G.r(X + 16, y, W - 32, 7.5, {r: 1, f: c, o: .34});
    }
    b += G.r(X + W, Y + 44, 17, 13, {r: 2, c: 'mu'})
      + G.a(X + W + 23, Y + 50.5, X + W + 44, Y + 50.5, {h: 4})
      + G.t(X + W + 50, Y + 47, 'plate', {c: 'sm', a: 'start'})
      + G.t(X + W + 50, Y + 59, 'port', {c: 'sm', a: 'start'})
      + G.t(X - 9, Y + 50, o.badge, {c: 'lb', a: 'end'});
    if (o.badge2) b += G.t(X - 9, Y + 64, o.badge2, {c: 'sm', a: 'end'});
    return b + G.t(160, 130, o.name, {c: 'lb'});
  };

  // CART FIGURES START
  // One per installed cart: a plain elevation of the machine inside it - the
  // cabinet, the plate it takes, and the one part that makes it that machine.
  // No readouts and no numbers; the numbers are the spec rows underneath, and
  // a drawn readout on a page of drawn readouts reads as a result.

  // The four phase 2 carts are drawn too - in commit ed3d02f, where they were
  // removed when phase 2 was hidden, because hiding has to mean not shipped on
  // a page that gets mailed. Setting SHOW_PHASE2 back to True fails the build
  // naming exactly those four; lift them out of that commit and they are back.
  const CART = {

      + G.plate(106, 30, 108, 13, 12, 1, {f: c})
      + G.plate(106, 64, 108, 13, 12, 1, {f: c})
      + G.p('M152 106H168L164 94H156Z', {f: c, o: .5})
      + G.a(160, 91, 160, 80, {h: 3.5})
      + G.t(234, 38, 'destination,', {c: 'sm', a: 'start'})
      + G.t(234, 49, 'inverted', {c: 'sm', a: 'start'})
      + G.t(234, 73, 'source', {c: 'sm', a: 'start'})
      + G.t(234, 101, 'transducer', {c: 'sm', a: 'start'})
      + G.t(160, 130, 'Echo 655', {c: 'lb'})
  },

  'multiflo': {
    s: c => G.r(92, 12, 136, 106, {r: 5, f: c, o: .07})
      + G.c(118, 38, 14, {c: 'mu'}) + G.c(118, 38, 4.5, {c: 'mu'})
      + G.p('M132 38H164Q172 38 172 46V52', {c: 'mu'})
      + G.r(130, 52, 72, 10, {r: 2, f: c})
      + [0, 1, 2, 3, 4, 5, 6, 7].map(i => G.l(136 + i * 8.6, 62, 136 + i * 8.6, 74)).join('')
      + G.plate(124, 78, 84, 20, 8, 2, {f: c})
      + G.t(234, 38, 'cassette', {c: 'sm', a: 'start'})
      + G.t(234, 60, 'manifold', {c: 'sm', a: 'start'})
      + G.t(160, 130, 'MultiFlo FX', {c: 'lb'})
  },

  'bravo': {
    s: c => G.r(76, 12, 144, 106, {r: 5, f: c, o: .07})
      + G.l(90, 24, 206, 24) + G.l(90, 24, 90, 70, {c: 'mu'})
      + G.l(206, 24, 206, 70, {c: 'mu'})
      + G.r(126, 28, 44, 24, {r: 2, f: c})
      + [0, 1, 2, 3, 4, 5].map(i => G.l(132 + i * 6.4, 52, 132 + i * 6.4, 62)).join('')
      + G.r(86, 82, 124, 24, {r: 2, c: 'mu'})
      + [0, 1, 2].map(i => G.r(92 + i * 41, 86, 35, 13, {r: 1.5, f: c, o: .34})).join('')
      + G.t(228, 40, '96-channel', {c: 'sm', a: 'start'})
      + G.t(228, 51, 'head', {c: 'sm', a: 'start'})
      + G.t(228, 95, 'fixed nests', {c: 'sm', a: 'start'})
      + G.t(160, 130, 'Bravo 96 + magnet + BioShake', {c: 'lb'})

  };
  // CART FIGURES END

  // what the cart does to a plate, drawn. The elevation under "How it is
  // built" is the cart as hardware; this is the cart as a unit operation, in
  // the same hand as the protocol panels on the sample protocols page.
  // What is in the cart, by name. This is what a cart is called on the sheet
  // now: someone working out whether their assay runs here is looking for a
  // PHERAstar, not for "plate reading".
  const instName = r => (r.instruments || []).map(i => (INST[i] || {}).label || i)
    .join(' + ') || r.unitop;

  const cartFig = r => {
    const f = CART[r.id];
    if (!f) return '';
    const cl = CLASS[(r.class || [])[0]];
    return `<figure class="cfig"><figcaption>Schematic</figcaption>
      ${svg(f.s(cl ? cl.c : 'var(--muted)'), instName(r) + ', schematic')}</figure>`;
  };


  document.getElementById('t').textContent = B.title;
  document.getElementById('s').textContent = B.subtitle;
  document.getElementById('n').textContent =
    `${RACS.length} carts on the track at install, grouped by what they are for. ` +
    `Click one for the machine inside it.`;

  // one line glyph per kind of unit operation
  const GPATH = {
    acoustic: 'M4 16h16M6 16V9M10 16V9M14 16V9M18 16V9M5 7h14',
    bulk:     'M4 17h16M7 17V9a3 3 0 0 1 6 0v8M16 9c0-2 2-2 2-4M13 12h5',
    stamp:    'M5 6h14M7 6v5M10 6v5M14 6v5M17 6v5M5 15h14v3H5z',
    channel:  'M8 5v6M16 5v6M8 11l-1 7h2zM16 11l-1 7h2zM5 5h6M13 5h6',
    verified: 'M7 5v7M17 5v7M7 12l-1 6h2zM17 12l-1 6h2zM11 16l2 2 4-5',
    thermal:  'M4 12h3l2-5 2 10 2-8 2 5h5M4 18h16M4 6h16',
    seal:     'M4 15h16v4H4zM7 11c3-3 7-3 10 0M9 7c2-2 4-2 6 0',
    breathe:  'M4 16h16v3H4zM7 12V6M11 12V6M15 12V6M17 12V6M5 9h14',
    spin:     'M12 4a8 8 0 1 1-8 8M12 8a4 4 0 1 0 4 4M12 4v4M4 12h4',
    shake:    'M4 7h16v11H4zM4 11h16M4 15h16M7 4l2 2-2 2M17 4l-2 2 2 2',
    static:   'M4 6h16v13H4zM4 11h16M4 15.5h16M9 3h6',
    cold:     'M12 4v16M5 8l14 8M5 16l14-8M12 7l-2-2M12 7l2-2M12 17l-2 2M12 17l2 2',
    ambient:  'M4 5h16v14H4zM4 10h16M4 14.5h16M8 7.5h3M8 12h3M8 16.5h3',
    tips:     'M6 5h4l-1 13H7zM14 5h4l-1 13h-2zM4 20h16',
    reader:   'M3 6h18v12H3zM6 9h7M6 12h5M6 15h7M16 9.5h2.5v2.5H16zM16 13h2.5v2.5H16z',
    imaging:  'M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10M12 11.5a1.5 1.5 0 1 0 0 3M4 5v3M4 5h3M20 19v-3M20 19h-3',
  };
  const GLYPH = {
    'Non-contact acoustic cherry picking': 'acoustic',
    'Bulk dispensing': 'bulk',
    'Contact stamping pipetting': 'stamp',
    'Positive-displacement channel pipetting': 'channel',
    'Volume-verified contact pipetting': 'verified',
    'Thermal cycling': 'thermal',
    'Microplate sealing & seal peeling': 'seal',
    'Microplate sealing': 'seal',
    'Microplate breathable sealing': 'breathe',
    'Centrifugation': 'spin',
    'Temp-control shaking incubation': 'shake',
    '37 C static incubation': 'static',
    'Refrigerated random access storage': 'cold',
    'Ambient random access storage': 'ambient',
    'Tip & consumable storage': 'tips',
    'Plate reading': 'reader',
    'Crystal imaging': 'imaging',
  };
  const gpath = u => GPATH[GLYPH[u]] || GPATH.ambient;

  // What each cart class is, in a word. A cart is one or more of these, and
  // the chips on its detail panel say which.
  const CLASS = {
    'storage':         {c:'#0072B2', t:'storage'},
    'liquid handling': {c:'#009E73', t:'liquid handling'},
    'incubating':      {c:'#E69F00', t:'incubating'},
    'assaying':        {c:'#CC79A7', t:'assaying'},
    'sealing':         {c:'#56B4E9', t:'sealing'},
    'centrifugation':  {c:'#D55E00', t:'centrifugation'}
  };
  const classChips = r => (r.class || []).map(c => {
    const k = CLASS[c] || {c:'var(--muted)', t:c};
    return `<span class="cls" style="color:${k.c};border-color:${k.c}">${esc(k.t)}</span>`;
  }).join('');

  // ---- the carts, under the heading you would look for them under ----
  const GROUPS = (B.groups || []).map(g => ({
    g: g, carts: RACS.filter(r => r.group === g.id)
  })).filter(x => x.carts.length);

  function sheet() {
    return GROUPS.map(({g, carts}) => {
      const tiles = carts.map(r => `<button class="tile" type="button" aria-pressed="false"
          data-r="${esc(r.id)}"
          aria-label="${esc(instName(r))} — ${esc(r.unitop)}, cart ${r.n}">
          <svg class="gl" viewBox="0 0 24 24" aria-hidden="true"
            ><path d="${gpath(r.unitop)}"/></svg>
          <span class="tn">${esc(instName(r))}</span>
          <span class="tc">cart ${r.n}${r.io
            ? ' <span class="io">\u00b7 hand I/O</span>' : ''}</span>
        </button>`).join('');
      return `<section class="grp${g.minor ? ' minor' : ''}">
        <h2>${esc(g.label)}</h2>
        <p>${esc(g.note)}</p>
        <div class="tiles">${tiles}</div>
      </section>`;
    }).join('');
  }
  document.getElementById('sheet').innerHTML = sheet();

  // Of the three the bar used to carry, one repeated the standfirst and one
  // was provenance. Only the marker needs explaining where it is used.
  document.getElementById('legend').innerHTML =
    `<span><b>hand I/O</b> &mdash; material enters or leaves the system here by hand</span>`;

  // ---- the cart elevation, drawn in the style of the Ginkgo layout sheets ----
  // The one dimension on it is real: 1800 mm overall height, from the
  // preliminary RAC layout. Width is schematic and carries no dimension,
  // because the per-cart width is not in the sheet we have.
  function elevation(r) {
    const W = 250, HT = 220, X = 52, Y = 14, CW = 118, CH = 176;
    const deckY = Y + 56, baseY = Y + CH - 26;
    const names = r.instruments.map(i => INST[i] ? INST[i].label : i);
    const slots = Math.max(1, names.length);
    const sh = (baseY - deckY - 10) / slots;
    const boxes = names.map((nm, k) => {
      const by = deckY + 6 + k * sh;
      return `<rect x="${X + 11}" y="${by}" width="${CW - 22}" height="${sh - 7}" rx="3"
          fill="#1d3049" stroke="var(--dim)" stroke-width="0.8"/>` +
        `<text x="${X + CW / 2}" y="${by + (sh - 7) / 2 + 3.5}" text-anchor="middle"
          class="el-i">${esc(nm.length > 17 ? nm.slice(0, 16) + '…' : nm)}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${HT}" role="img"
       aria-label="Schematic elevation of cart ${r.n}">
      <defs><pattern id="gr2" width="13" height="13" patternUnits="userSpaceOnUse">
        <path d="M13 0H0V13" fill="none" stroke="var(--grid)" stroke-width="0.5"
          opacity="0.5"/></pattern></defs>
      <rect width="${W}" height="${HT}" fill="var(--paper)"/>
      <rect width="${W}" height="${HT}" fill="url(#gr2)"/>
      <!-- enclosure -->
      <rect x="${X}" y="${Y}" width="${CW}" height="${CH}" rx="6" fill="none"
        stroke="var(--line)" stroke-width="1.4"/>
      <!-- top service band -->
      <line x1="${X}" y1="${Y + 26}" x2="${X + CW}" y2="${Y + 26}" stroke="var(--dim)"
        stroke-width="1"/>
      <text x="${X + CW / 2}" y="${Y + 17}" text-anchor="middle" class="el-l">SERVICE</text>
      <!-- deck -->
      <line x1="${X}" y1="${deckY}" x2="${X + CW}" y2="${deckY}" stroke="var(--line)"
        stroke-width="1.6"/>
      <text x="${X + CW + 7}" y="${deckY + 3}" class="el-l">DECK</text>
      ${boxes}
      <!-- track pass-through -->
      <line x1="${X - 20}" y1="${baseY}" x2="${X + CW + 20}" y2="${baseY}" stroke="var(--accent-p)"
        stroke-width="2"/>
      <text x="${X + CW + 7}" y="${baseY - 5}" class="el-l">TRACK</text>
      <!-- base -->
      <line x1="${X}" y1="${Y + CH}" x2="${X + CW}" y2="${Y + CH}" stroke="var(--line)"
        stroke-width="1.4"/>
      <circle cx="${X + 16}" cy="${Y + CH + 5}" r="4.5" fill="none" stroke="var(--dim)"/>
      <circle cx="${X + CW - 16}" cy="${Y + CH + 5}" r="4.5" fill="none" stroke="var(--dim)"/>
      <!-- the one real dimension -->
      <line x1="${X - 26}" y1="${Y}" x2="${X - 26}" y2="${Y + CH}" stroke="var(--dim)"
        stroke-width="0.9"/>
      <line x1="${X - 30}" y1="${Y}" x2="${X - 22}" y2="${Y}" stroke="var(--dim)" stroke-width="0.9"/>
      <line x1="${X - 30}" y1="${Y + CH}" x2="${X - 22}" y2="${Y + CH}" stroke="var(--dim)"
        stroke-width="0.9"/>
      <text x="${X - 32}" y="${Y + CH / 2}" text-anchor="middle" class="el-d"
        transform="rotate(-90 ${X - 32} ${Y + CH / 2})">1800 mm</text>
      <text x="${X + CW / 2}" y="${HT - 4}" text-anchor="middle" class="el-l"
        >SCHEMATIC ELEVATION &middot; RAC ${r.n}</text>
    </svg>`;
  }

  const detail = document.getElementById('detail');
  function show(id) {
    const r = RACS.find(x => x.id === id);
    if (!r) {
      detail.innerHTML = `<div class="dbody"><p class="empty">Pick a cart above.</p></div>`;
      return;
    }
    // One disclosure per instrument. The summary is the name, the vendor and
    // what it is for; opening it gives the spec sheet's own rows as a table
    // and the paragraph underneath, so the detail is there without being in
    // the way. The first is open so a cart never opens onto nothing.
    const insts = r.instruments.map(i => INST[i]).filter(Boolean);
    const specs = insts.map(i => {
      const rows = (i.rows || []).map(s =>
        `<tr><td class="k">${esc(s.label)}</td><td class="v">${esc(s.value)}</td></tr>`
      ).join('');
      return `<details class="dd">
        <summary><span>${esc(i.label)}</span>
          <span class="sv">${i.vendor ? esc(i.vendor) : ''}</span>
          <span class="cnt">${rows ? i.rows.length + ' specs' : 'no spec sheet'}</span></summary>
        <div class="ddb">
          ${/* On a cart with one machine, the instrument's role is the cart's
                note again in fewer words - the lead paragraph three inches
                above says it already. It earns its place only where a cart
                holds more than one machine and the roles tell them apart.
                It still drives the instrument chips on the protocols page,
                which is why it stays in the data. */ ''}
          ${i.role && insts.length > 1
            ? `<p class="prose" style="margin-top:0">${esc(i.role)}</p>` : ''}
          ${rows ? `<table class="kv">${rows}</table>` : ''}
          ${/* The paragraph and the table are the same facts twice over - the
                Bravo's 8 min, 32 min and ~75 protocols are rows above and a
                sentence below. Where there are rows, they are the better form
                and the paragraph is dropped. Where there is no spec sheet the
                paragraph is all there is, so it stays. */ ''}
          ${!rows && i.spec ? `<p class="prose">${esc(i.spec)}</p>` : ''}
          ${rows ? `<a class="more" href="${esc(i.url || '#')}">Full specification sheet &rarr;</a>` : ''}
        </div></details>`;
    }).join('');

    // The protocol list was the longest thing on the sheet. As a table it is
    // three narrow columns and reads at a glance; the phase is a named column
    // rather than a colour you have to decode against the legend.
    const protos = (r.runs || []).map(w => {
      const wf = WF[w], ph = wf && PH[wf.phase];
      return `<tr><td class="id">${esc(w)}</td>
        <td>${esc(wf ? wf.name : w)}</td>
        <td class="ph"><span class="dot" style="background:${ph ? ph.c : 'var(--rule)'}"></span>${
          esc(ph ? ph.label : '—')}</td></tr>`;
    }).join('');
    detail.innerHTML = `
      <div class="ttl"><span>Fraser Lab &middot; UCSF</span>
        <span>Cart detail</span><span class="r">RAC ${r.n}</span></div>
      <div class="dbody">
        <div class="dhd"><h3>${esc(instName(r))}</h3><span class="no">cart ${r.n}</span></div>
        <div class="unitop">${esc(r.unitop)}</div>
        <div class="classes">${classChips(r)}${r.io
          ? '<span class="cls" style="color:var(--muted);border-color:var(--rule)">hand I/O</span>'
          : ''}</div>
        <p class="lead">${esc(r.note)}</p>
        ${cartFig(r)}
        <table class="kv" style="margin-top:13px">
          <tr><td class="k">Made by</td><td class="v">${
            esc([...new Set(insts.map(i => i.vendor).filter(Boolean))].join(', ')) || '—'}</td></tr>
          <tr><td class="k">Cart class</td><td class="v">${esc((r.class || []).join(', ') || '—')}</td></tr>
          <tr><td class="k">Protocols through it</td><td class="v">${
            (r.runs || []).length}${(r.runs || []).length ? ' of ' + B.workflows.length : ''}</td></tr>
          <tr><td class="k">Material by hand</td><td class="v">${
            r.io ? 'Yes — this is where material enters or leaves' : '<em>No — the track feeds it</em>'}</td></tr>
        </table>
        <div class="lbl">What it can do</div>
        ${specs}
        ${protos ? `<details class="dd"><summary><span>Protocols that run through it</span>
            <span class="cnt">${r.runs.length}</span></summary>
          <div class="ddb"><table class="ptab">
            <tr><th class="id">No.</th><th>Protocol</th><th class="ph">Phase</th></tr>
            ${protos}</table></div></details>` : ''}
        <details class="dd"><summary><span>How it is built</span>
          <span class="cnt">elevation</span></summary>
          <div class="ddb"><div class="elev" style="max-width:300px">${elevation(r)}</div></div>
        </details>
      </div>`;
  }
  show(null);

  let sel = null;
  function pick(id) {
    sel = (sel === id) ? null : id;
    document.querySelectorAll('.tile').forEach(t => {
      t.setAttribute('aria-pressed', String(t.dataset.r === sel));
      t.classList.toggle('dim', !!sel && t.dataset.r !== sel);

    show(sel);
  }
  document.getElementById('sheet').addEventListener('click', e => {
    const t = e.target.closest('.tile'); if (t) pick(t.dataset.r);
  });

  // ---- phase 2, in its own section. Nothing phase 2 is bundled into the
  // page while it is hidden, so this section renders only if there is
  // something to put in it. ----
  if (PEND.length) {
  document.getElementById('p2sec').hidden = false;
  document.getElementById('p2h').textContent = 'Phase 2 \u00b7 pending';
  document.getElementById('p2intro').textContent =
    `Four carts the floor plan reserves, all of them driven by crystallography. They are ` +
    `not on the track above because they are not on the track: the room is laid out for ` +
    `them and the system grows from ${RACS.length} carts to ${B.racs.length} when they land.`;

  document.getElementById('p2').innerHTML = PEND.map(r => `
    <article class="p2card">
      <div class="ph">
        <span class="mini"><svg viewBox="0 0 24 24"><path d="${gpath(r.unitop)}"/></svg></span>
        <span><h3>${esc(r.unitop)}</h3><div class="n2">cart ${r.n} &middot; phase 2</div></span>
      </div>
      <p>${esc(r.note)}</p>
      ${cartFig(r)}
      <div class="classes">${classChips(r)}</div>
    </article>`).join('');
  }

  const placed = RACS.reduce((a, r) => a + r.instruments.length, 0);
  // The figure stays on the page; everything that qualified it goes behind a
  // title that says what is behind it. What was there before was a note to
  // whoever maintains the build - which file generates the page, what makes
  // the build fail - sitting under a drawing of a machine.
  document.getElementById('foot').innerHTML =
    `<p class="fline"><b>${placed} instruments across ${RACS.length} carts.</b>
       This is not a floor plan: the carts are grouped by what they are for, not by
       where they stand.</p>
     <details class="dd"><summary><span>How big it is, and where these figures come
       from</span></summary>
       <div class="ddb">
         <table class="kv">
           <tr><td class="k">Footprint</td><td class="v">8,338 &times; 3,900&nbsp;mm at
             ${RACS.length} carts, about 32.5&nbsp;m²</td></tr>
           <tr><td class="k">Height</td><td class="v">1,800&nbsp;mm</td></tr>
           <tr><td class="k">Room</td><td class="v">515, Mission Bay. The orientation in it
             is forced</td></tr>
         </table>
         <p class="prose">Every figure on this page is generated from one file, so a number
           changes in one place. Each cart also carries the unit operation Ginkgo names it by
           in its published Application Blueprints; where they have a term for something we
           have, the term is theirs. The elevation under each cart is schematic — the height
           is the system figure, the width is drawn to fit the page.</p>
       </div></details>`;
})();
</script>
</body>
</html>
