<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundry Loop</title>
<style>
  :root {
    --bg:#fff; --ink:#1d1d1f; --muted:#8e8e93; --rule:#d2d2d7; --tab-bg:#f2f2f4;
    --fillop:0.14;
    --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme=light]){
    --bg:#141416; --ink:#f2f2f4; --muted:#8e8e93; --rule:#3a3a3d; --tab-bg:#242427;
    --fillop:0.24;
  }}
  :root[data-theme=dark]{ --bg:#141416; --ink:#f2f2f4; --rule:#3a3a3d; --tab-bg:#242427; --fillop:0.24; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:1200px;margin:0 auto;padding:24px 16px 40px}
  header{text-align:center;margin-bottom:6px}
  h1{font-weight:400;font-size:clamp(22px,3vw,34px);margin:0;letter-spacing:-.01em}
  .sub{font-size:clamp(15px,2vw,19px);margin-top:3px;color:var(--ink)}
  .note{color:var(--muted);font-size:13px;margin-top:6px}

  .main{display:flex;gap:20px;align-items:flex-start;margin-top:22px}
  .stage{flex:1;min-width:0;overflow-x:auto}
  svg#loop{display:block;width:100%;min-width:620px;height:auto;font-family:var(--font)}
  .node:focus{outline:none}
  .node:focus-visible .nodebox{stroke-width:3}
  .nodebox{cursor:pointer;transition:stroke-width .15s}
  .nodebox:hover{stroke-width:2.5}
  .sel .nodebox{stroke-width:3}
  .lbl{font-size:15px;font-weight:500;fill:var(--ink)}
  .slbl{font-size:12.5px;fill:var(--muted)}
  .rlbl{font-size:12.5px;fill:var(--muted)}

  #panel{flex:none;width:330px;border:1px solid var(--rule);border-radius:12px;
         padding:16px 18px 20px;font-size:14px;line-height:1.45;position:sticky;top:12px;
         max-height:calc(100vh - 24px);overflow-y:auto;background:var(--bg)}
  #panel[hidden]{display:none}
  #panel .close{float:right;border:0;background:var(--tab-bg);border-radius:999px;
                width:26px;height:26px;font-size:15px;line-height:1;cursor:pointer;color:var(--ink)}
  #panel h2{font-size:19px;margin:0;font-weight:500}
  #panel .where{font-size:12px;color:var(--muted);margin-top:2px}
  #panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
            font-weight:500;margin:17px 0 6px}
  #panel p{margin:9px 0 0}
  .gate{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;margin-bottom:7px}
  .gate b{font-weight:500}
  .gate .gid{color:var(--muted);font-size:12px;margin-right:5px}
  .gate dl{margin:6px 0 0;font-size:12.5px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
  .gate dt{color:var(--muted)} .gate dd{margin:0}
  .gate .by{color:var(--muted);font-size:11.5px;margin-top:5px}
  ul.plain{list-style:none;padding:0;margin:0}
  ul.plain li{padding:3px 0;display:flex;gap:8px;align-items:baseline}
  .chip{font-size:11px;border:1px solid var(--rule);border-radius:999px;padding:1px 7px;color:var(--muted);flex:none}
  .open li{padding:4px 0;color:var(--ink)}
  .legend{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:center;
          align-items:center;font-size:13px;margin-top:16px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .sw{width:13px;height:13px;border-radius:3px;border:1px solid}
  .hint{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}
  .nav{text-align:center;font-size:13px;margin-top:10px}
  .nav a{color:var(--muted)}
  .nav a:hover{color:var(--ink)}
  /* --- the user-facing blocks --- */
  section.band{margin-top:34px}
  .bandhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .bandhead h2{font-size:19px;font-weight:500;margin:0;letter-spacing:-.01em}
  .bandhead .lede{color:var(--muted);font-size:13px;max-width:62ch}
  .checks{display:grid;gap:8px;margin-top:14px}
  .chk{border:1px solid var(--rule);border-radius:10px;padding:0}
  .chk>summary{list-style:none;cursor:pointer;display:grid;
       grid-template-columns:22px minmax(0,1fr) auto;gap:4px 11px;padding:11px 14px;align-items:start}
  .chk>summary::-webkit-details-marker{display:none}
  .chk .box{width:20px;height:20px;border:2px solid var(--rule);border-radius:5px;margin-top:1px;
       display:grid;place-items:center;font-size:13px;color:#fff;transition:background .15s,border-color .15s}
  .chk.on .box{background:#009E73;border-color:#009E73}
  .chk .ask{font-size:14.5px;font-weight:500}
  .chk .need{grid-column:2;color:var(--muted);font-size:13px}
  .chk .more{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;
       align-self:center;white-space:nowrap}
  .chk .why{padding:0 14px 13px 47px;font-size:13px;color:var(--muted);max-width:70ch}
  .chk[open] .more{opacity:.4}
  .score{margin-top:14px;border:1px solid var(--rule);border-radius:10px;padding:13px 15px;
       display:flex;gap:13px;align-items:baseline;flex-wrap:wrap}
  .score .n{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .score .lab{font-weight:500}
  .score .say{color:var(--muted);font-size:13.5px;flex:1 1 320px;min-width:0}
  .twoup{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}
  .kv{display:grid;gap:0}
  .kv .r{display:grid;gap:2px;padding:9px 0;border-top:1px solid var(--rule)}
  .kv .r:first-child{border-top:0}
  .kv .k{font-weight:500;font-size:14px}
  .kv .v{color:var(--muted);font-size:13px}
  .limits{margin-top:12px;display:grid;gap:7px}
  .limits li{color:var(--muted);font-size:13.5px;padding-left:19px;position:relative;list-style:none}
  .limits li::before{content:"\00d7";position:absolute;left:3px;top:-1px;color:#D55E00;font-size:15px}
  .limits ul{margin:0;padding:0}
  @media (max-width:720px){ .twoup{grid-template-columns:1fr} }
  @media (max-width:860px){ .main{flex-direction:column} .stage{width:100%;max-width:100%}
       #panel{width:100%;position:static;max-height:none} }
</style>
</head>

  <section class="band">

  <div class="main">

    </div>
    <aside id="panel" hidden><button class="close" aria-label="Close">&times;</button><div id="pc"></div></aside>

  <div class="twoup">
    <section class="band"><div class="bandhead"><h2 id="pv-t"></h2></div>
      <div class="kv" id="pv"></div></section>
    <section class="band"><div class="bandhead"><h2 id="rt-t"></h2></div>
      <div class="kv" id="rt"></div></section>
  </div>

  <section class="band">
    <div class="bandhead"><h2 id="lm-t"></h2><span class="lede" id="lm-note"></span></div>
    <div class="limits"><ul id="lm"></ul></div>
  </section>
</div>

   },
   "by": "agent",
   "note": "Set 2026-11-17. Three things changed here and the reasons matter. CONCENTRATION is read by GFP11 complementation, not A280. At the 2 ug floor in a 50 ug/mL eluate a typical design (1 Trp, 2 Tyr, eps280 ~8730) gives A280 = 0.012 against ~0.005 AU of reader noise - unmeasurable, and it varies several-fold design to design with aromatic content, which would make designs incomparable. GFP11 reads the same way for every design and on the same curve as D1. A280 is still recorded alongside, as a cross-check, where the design's own computed eps280 puts it above about 0.05 AU. The A260/A280 CHECK IS DROPPED from this gate: it is a ratio of two near-noise numbers here, and residual nucleic acid does not interfere with NanoBiT or HTRF. It belongs on the structure path, where it does. The FP WINDOW IS NARROW and that is physics, not a tuning problem. With GFP's ~3 ns lifetime on a ~41 kDa complemented species, Perrin gives 427 mP for the monomer against a 490 mP ceiling: dimer +29, trimer +40, gross aggregate +63. So 25 mP is most of the way to a dimer and the gate detects aggregation, not oligomer-level change. Confirm the monomer control's actual mP on the first real plate at D3. THE WINDOW IS TWO-SIDED, added 2026-11-17. Both the reporter and the purification tag sit C-terminal to the design in the standing cassette, so a design proteolysed off its tag leaves a GFP11-Strep peptide that still complements GFP1-10 and still binds the beads: the concentration read passes and the well is labelled as 2 ug of a design it does not contain. DTU excluded 2 of 30 designs for exactly this, by gel. The cleaved species is ~27 kDa against the intact 41 kDa, which puts it 27 mP BELOW the monomer - about 6 sigma, the same size as the dimer shift above it. The read was already being taken; it just has to look down as well as up. See reference/design-quality-invariants.md."
  },
  "D3": {
   "id": "D3",
   "name": "Does the assay have a window?",
   "measure": "Z' and signal/background on a known binder plus no-binder control",
   "pass": "Z' >= 0.5 and S/B >= 3",
   "fail": "Z' < 0.3",
   "ambiguous": "0.3 <= Z' < 0.5",
   "then": {
    "pass": "release designs",
    "fail": "reformat assay, commit nothing",
    "ambiguous": "repeat on fresh target prep"
   },
   "by": "agent_proposes_human_confirms",
   "note": "no design batch is committed before this gate passes"
  },
  "D4": {
   "id": "D4",
   "name": "Which designs bind?",
   "measure": "fold-activation per design - its own +target well over its own -target well, which cancels expression - then a robust z of those folds across the plate, z = (fold - median) / (1.4826 * MAD). Counter-target and non-binder controls are on the same plate and are recorded, not gated on here",
   "pass": "z >= 3.0 AND fold >= 2.0, in >=2 of 3 replicates, with all decoys silent",
   "fail": "below both, with the -target well at floor",
   "ambiguous": "clears one condition but not the other (z >= 3.0 with fold 1.5-2.0, or fold >= 2.0 with z 2.0-3.0), or -target elevated, or any decoy fired, or the design was below the D1 floor",
   "then": {
    "pass": "to dose-response",
    "fail": "record as measured negative",
    "ambiguous": "to dose-response"
   },
   "by": "agent",
   "note": "Set 2026-11-17. The AND is strict and the routing is permissive, on purpose: the strict pass keeps the TRAINING LABEL clean, while the ambiguous band still goes to D5, so recall is not lost. That matters because the two error types are not symmetric here. A false positive costs one dose-response on a plate that holds 24 of them - about 11 minutes. A false negative enters the Aim 2 training set as a measured negative and teaches the model that a real binder is not one. Across 1,000 designs at an 8% hit rate the whole z=2 to z=4 range differs by ~21 dose-responses and ~10 minutes of reader time, so strictness buys very little and the ambiguous route is what protects recall. The comparator is PER DESIGN, not a plate-level non-binder control, because expression varies design to design - the DTU cell-free study names unnormalised expression as the reason an earlier method missed a low-micromolar binder. Fold >= 2.0 is the CF2H precedent and it is still arbitrary; the robust z is what makes it noise-aware. Counter-target fold is recorded per design and carried to D6; a design that fires as hard on the counter-target is flagged promiscuous and still goes to D5, because cross-reactivity against MD2/MD3 is a result worth measuring rather than discarding. THE STANDING PROMISCUITY PANEL, added 2026-11-17. Every design is also read against three unrelated proteins that never change between campaigns or labs - lysozyme, ubiquitin and MBP, chosen to span charge and size - in triplicate, at the same concentration as the target. Record the fold on each, the PANEL-FIRE FRACTION, and the SPECIFICITY INDEX = target fold / max panel fold. This RECORDS, it does not gate: a promiscuous design still goes to D5. The counter-target above is a campaign-specific homolog and its number means nothing to another lab; the panel is the same measurement on every design the foundry ever makes, which is what makes it the experimental analogue of ipAE. DECOYS ARE NOT THIS - a decoy here is a control DESIGN, and designs are never read against decoys. Costs 0.25 ug per design, which is why D2's floor is 2.25 ug and not 2. See reference/design-quality-invariants.md. Failures are training data, never discarded."
  },
  "D5": {
   "id": "D5",
   "name": "Are the hits real?",
   "measure": "four-parameter logistic on a 12-point, 3-fold titration topping at 1 uM, in triplicate. Report K_D with its 95% CI, the Hill slope and R2",
   "pass": "fit converges, R2 >= 0.95, Hill slope 0.7-1.5, and dose dependence established. K_D is reported as a VALUE when it falls inside the determined window of 0.5-100 nM, and as a LOWER BOUND above it",
   "fail": "no dose dependence - the fit is no better than a flat line",
   "ambiguous": "R2 0.90-0.95, or Hill slope outside 0.7-1.5, or bi-phasic, or K_D below 0.5 nM, which is the tight-binding limit rather than a real number",
   "then": {
    "pass": "to selectivity if K_D determined, else to affinity maturation with the bound",
    "fail": "drop, record as measured negative",
    "ambiguous": "expand concentration series"
   },
   "by": "agent",
   "note": "Set 2026-11-17. THE DETERMINED WINDOW IS 0.5-100 nM and it is set by the D2 mass floor, not by the assay chemistry. The lower limit is half the fixed component (1 nM target); the upper is the top of the titration over ten, because you need the plateau. Raising the top to 10 uM would put the window at 0.5-1000 nM but costs 12.6 ug of protein per design against D2's 2 ug floor, so it is a per-design exception, not the default. A WEAK BINDER IS STILL A BINDER. Real dose dependence with K_D above 100 nM passes with a lower bound and goes to affinity maturation, which is what the maturation loop is for. Failing it would put a true binder into the Aim 2 training set as a negative - the same error D4 is built to avoid. ON R2, HONESTLY: Sofia chose R2 >= 0.95 as the fit gate on 2026-11-17. It should be read as a gross-misfit catch and not as evidence that a K_D is determined. Simulated 12-point titrations at 5% noise return R2 = 0.997 for K_D = 1 nM and R2 = 0.997 for K_D = 2 uM, where only the foot of the curve is visible - R2 >= 0.95 passes both. What separates them is the 95% CI on K_D: 1.2x against 12.2x. The CI is therefore REPORTED on every fit even though it does not gate, and the explicit 0.5-100 nM window above is what actually catches the undetermined case. One case neither statistic catches: at K_D = 500 nM the fit returned 334 nM with a 1.3x CI and R2 = 0.9985 - tight-looking and a third low, because the plateau was never reached. That is the window's whole job."
  },
  "D6": {
   "id": "D6",
   "name": "Does it bind where it was designed to?",
   "measure": "single-point signal against a HOTSPOT ALANINE POINT-MUTANT of the target itself, beside wild-type target on the same plate, with each design read at ITS OWN K_D from D5. Homolog panel recorded alongside for selectivity",
   "pass": ">= 70% signal loss against the mutant, with the mutant-target control still active",
   "fail": "< 25% loss - indistinguishable from no contact, so it binds a different face",
   "ambiguous": "25-70% loss, or the mutant-target control is dead or weakened",
   "then": {
    "pass": "to structure queue",
    "fail": "drop, feed back to design filters",
    "ambiguous": "second mutant"
   },
   "by": "agent_proposes_human_confirms",
   "note": "Set 2026-11-17. A generic counter-target cannot catch a wrong-face binder. This gate is why, and md1_baseline is the reason it exists - both of its ranked designs had Hotspot_Contact_Fraction = 0.00 against an off-epitope median of 0.71. READ EACH DESIGN AT ITS OWN K_D. This matters as much as the threshold: the same 10x affinity shift shows 82% signal loss at K_D but only 22% at 30x K_D, so a fixed plate-wide concentration would fail tight binders for being tight. D5 has just measured every K_D and the Echo sets the concentration per well, so this costs nothing. THE NUMBERS. At [design] = K_D the wild-type occupancy is 0.5, so signal loss maps onto energy: 0.5 kcal/mol gives 40%, 1.0 gives 69%, 1.5 gives 85%, and the Clackson-Wells 2 kcal/mol hotspot definition gives 93%. 70% is therefore about 1 kcal/mol and a 5.4x K_D shift - a real contact, and 5 sigma clear of zero at the ~10% noise of the assay. The 25% floor is ~2.5 sigma, which is as close to \"no drop\" as the plate can resolve. THE CONTROL IS NOT OPTIONAL. With a single mutant, a target that the mutation has unfolded or inactivated gives total signal loss for every design, and every design passes. The mutant plate must therefore carry a reference ligand or a known binder and show it is still engaged; if that control is dead or weakened, the gate is ambiguous, not pass. One mutant is the default by decision; a partial drop escalates to a second mutant rather than being resolved by guessing which residue of a patch the design actually used. Weak binders do not normally arrive here - D5 routes a K_D known only as a lower bound to affinity maturation, and without a real K_D the read-at-K_D rule above cannot be applied."
  },
  "D7": {
   "id": "D7",
   "name": "Which hits earn a structure?",
   "measure": "rank on K_D determined at D5, selectivity from D6's mutant drop and the homolog panel, and whether the design can be made offline at milligram scale and 10 mg/mL",
   "pass": "top 4 per campaign round, by the capacity rule in the note",
   "fail": "below the top 4 - hold, do not drop",
   "ambiguous": "high affinity but no evidence it can be made at scale",
   "then": {
    "pass": "crystallisation screen",
    "fail": "hold",
    "ambiguous": "re-express at scale"
   },
   "by": "human",
   "note": "Set 2026-11-17. N IS CAPACITY, NOT QUALITY. Everything that follows this gate is offline: the RAC does not make crystallography protein, it screens it, so each design needs 1-2 bench days of expression to milligram scale at 10 mg/mL, and about 3 trays. The binding constraint today is HAND IMAGING at 48.9 h per 80 trays, about 0.61 h a tray. At a sustainable 12 trays a week that is 4 designs a round. Tray residency is not the limit - the AmbiStore holds 100-150 standard positions, which is 33-50 designs resident - and Echo drop setting is not the limit either, at 9 min a tray, 11.5 h for 80 trays against 48.9 h of hand scoring. So n = 4 is a statement about hands, not about designs. RECOMPUTE IT when the imagers and automated scoring arrive, which are still unquoted; the rule is trays-imaged-per-week divided by 3. Below the top 4 is HOLD, not drop. These are confirmed, epitope-verified binders and the constraint is this round's capacity."
  },
  "D8": {
   "id": "D8",
   "name": "Does the solved interface match the model?",
   "measure": "contact overlap and interface RMSD, solved vs designed",
   "pass": "designed hotspots present in the solved interface",
   "fail": "different interface",
   "ambiguous": "partial overlap",
   "then": {
    "pass": "retrain, promote filters",
    "fail": "retrain, demote filters",
    "ambiguous": "flag for review"
   },
   "by": "human"
  }
 }
};
</script>
<script>
(() => {
  const F = window.FOUNDRY, S = F.stages;
  const WHERE = {
    compute:  {c:'#0072B2', label:'yours to build'},
    rac:      {c:'#009E73', label:'on the Ginkgo'},
    offrac:   {c:'#999999', label:'not there yet'}
  };
  const esc = t => String(t).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

  document.getElementById('t').textContent = F.title;
  document.getElementById('s').textContent = F.subtitle;
  document.getElementById('n').textContent = F.note;

  const svg = document.getElementById('loop');
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a) => { const e = document.createElementNS(NS, n);
    for (const k in a) e.setAttribute(k, a[k]); return e; };

  const W = 170, H = 64, Y = 58, N = S.length;
  const GAP = (820 - N * W) / (N - 1);
  const xOf = i => 40 + i * (W + GAP);

  svg.appendChild((() => { const d = el('defs');
    const m = el('marker', {id:'ar', viewBox:'0 0 10 10', refX:'8', refY:'5',
      markerWidth:'7', markerHeight:'7', orient:'auto-start-reverse'});
    m.appendChild(el('path', {d:'M2 1L8 5L2 9', fill:'none', stroke:'var(--muted)',
      'stroke-width':'1.6', 'stroke-linecap':'round', 'stroke-linejoin':'round'}));
    d.appendChild(m); return d; })());

  S.forEach((st, i) => {
    const x = xOf(i), col = WHERE[st.where].c;
    const g = el('g', {class:'node', tabindex:'0', role:'button',
      'aria-label':st.label, 'data-id':st.id});
    const r = el('rect', {x, y:Y, width:W, height:H, rx:10, class:'nodebox',
      fill:col, 'fill-opacity':'var(--fillop)', stroke:col, 'stroke-width':'1.2'});
    g.appendChild(r);
    const tx = x + W / 2;
    const t1 = el('text', {x:tx, y:Y + 26, 'text-anchor':'middle', class:'lbl'});
    t1.textContent = st.label; g.appendChild(t1);
    const t2 = el('text', {x:tx, y:Y + 46, 'text-anchor':'middle', class:'slbl'});
    t2.textContent = st.sub; g.appendChild(t2);
    const t3 = el('text', {x:tx, y:Y + H + 20, 'text-anchor':'middle', class:'rlbl'});
    t3.textContent = st.gates.join(' · '); g.appendChild(t3);
    g.addEventListener('click', () => open(st.id));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ')
      { e.preventDefault(); open(st.id); } });
    svg.appendChild(g);
    if (i < N - 1) svg.appendChild(el('line', {x1:x + W + 7, y1:Y + H / 2,
      x2:x + W + GAP - 7, y2:Y + H / 2, stroke:'var(--muted)', 'stroke-width':'1.4',
      'marker-end':'url(#ar)'}));
  });

  const cx0 = xOf(0) + W / 2, cxN = xOf(N - 1) + W / 2, by = Y + H + 46;
  svg.appendChild(el('path', {d:`M${cxN} ${Y + H + 28} L${cxN} ${by} L${cx0} ${by} L${cx0} ${Y + H + 30}`,
    fill:'none', stroke:'var(--muted)', 'stroke-width':'1.4', 'marker-end':'url(#ar)'}));
  const rt = el('text', {x:450, y:by + 26, 'text-anchor':'middle', class:'rlbl'});
  rt.textContent = 'every result goes back into the models, failures included';
  svg.appendChild(rt);

  document.getElementById('legend').innerHTML = Object.values(WHERE).map(w =>
    `<span><i class="sw" style="background:${w.c};border-color:${w.c};opacity:.65"></i>${w.label}</span>`).join('');

  const panel = document.getElementById('panel'), pc = document.getElementById('pc');
  panel.querySelector('.close').addEventListener('click', () => {
    panel.hidden = true;
    document.querySelectorAll('#loop .node').forEach(n => n.classList.remove('sel'));
  });

  // ---- intake: the first question a foundry user has ----
  const IK = F.intake;
  document.getElementById('ik-q').textContent = IK.question;
  document.getElementById('ik-note').textContent = IK.note;
  let ticked = new Set();
  try { ticked = new Set(JSON.parse(localStorage.getItem('foundry-intake') || '[]')); } catch (e) {}

  document.getElementById('ik-checks').innerHTML = IK.checks.map(c =>
    `<details class="chk${ticked.has(c.id) ? ' on' : ''}" data-id="${esc(c.id)}">
       <summary>
         <span class="box" role="checkbox" tabindex="0"
               aria-checked="${ticked.has(c.id)}" aria-label="${esc(c.ask)}">&#10003;</span>
         <span class="ask">${esc(c.ask)}</span>
         <span class="more">why</span>
         <span class="need">${esc(c.need)}</span>
       </summary>
       <div class="why">${esc(c.why)}</div>
     </details>`).join('');

  function score() {
    const n = ticked.size, v = IK.verdicts;
    const pick = n === IK.checks.length ? v[0] : n === IK.checks.length - 1 ? v[1] : v[2];
    document.getElementById('ik-score').innerHTML =
      `<span class="n">${n}/${IK.checks.length}</span>
       <span class="lab">${esc(pick.label)}</span>
       <span class="say">${esc(pick.say)}</span>`;
    try { localStorage.setItem('foundry-intake', JSON.stringify([...ticked])); } catch (e) {}
  }
  document.querySelectorAll('.chk .box').forEach(box => {
    const d = box.closest('.chk'), id = d.dataset.id;
    const flip = ev => {
      ev.preventDefault(); ev.stopPropagation();
      ticked.has(id) ? ticked.delete(id) : ticked.add(id);
      d.classList.toggle('on', ticked.has(id));
      box.setAttribute('aria-checked', String(ticked.has(id)));
      score();
    };
    box.addEventListener('click', flip);
    box.addEventListener('keydown', ev => { if (ev.key === ' ' || ev.key === 'Enter') flip(ev); });
  });
  score();

  // ---- what you hand over, what comes back, what it cannot do ----
  const rows = items => items.map(i =>
    `<div class="r"><span class="k">${esc(i.k)}</span><span class="v">${esc(i.v)}</span></div>`).join('');
  document.getElementById('pv-t').textContent = F.provide.title;
  document.getElementById('pv').innerHTML = rows(F.provide.items);
  document.getElementById('rt-t').textContent = F.returns.title;
  document.getElementById('rt').innerHTML = rows(F.returns.items);
  document.getElementById('lm-t').textContent = F.limits.title;
  document.getElementById('lm-note').textContent = F.limits.note || '';
  document.getElementById('lm').innerHTML = F.limits.items.map(x => `<li>${esc(x)}</li>`).join('');

  function open(id) {
    const st = S.find(s => s.id === id);
    document.querySelectorAll('#loop .node').forEach(n =>
      n.classList.toggle('sel', n.dataset.id === id));
    const gates = st.gates.map(gid => {
      const g = F.gates[gid]; if (!g) return '';
      return `<div class="gate"><b><span class="gid">${esc(gid)}</span>${esc(g.name)}</b>
        <dl><dt>pass</dt><dd>${esc(g.pass)}</dd>
            <dt>fail</dt><dd>${esc(g.fail)}</dd>
            <dt>unclear</dt><dd>${esc(g.ambiguous)}</dd></dl>
        <div class="by">decided by ${esc(String(g.by).replace(/_/g, ' '))}</div></div>`;
    }).join('');
    const protos = st.protocols.map(p =>
      `<li><span class="chip">${esc(p.status)}</span>${esc(p.id)}</li>`).join('');
    const open = (st.open || []).map(o => `<li>${esc(o)}</li>`).join('');
    pc.innerHTML = `<h2>${esc(st.label)}</h2>
      <div class="where">${esc(WHERE[st.where].label)} &middot; ${esc(st.instruments.join(', '))}</div>
      <p>${esc(st.body)}</p>
      <h3>What decides here</h3>${gates}
      <h3>Protocols</h3><ul class="plain">${protos}</ul>
      ${open ? `<details><summary style="cursor:pointer;color:var(--muted);font-size:12.5px;
         margin-top:12px">still being settled &middot; ${st.open.length}</summary>
         <ul class="plain open">${open}</ul></details>` : ''}`;
    panel.hidden = false;
  }
})();
</script>
</body>
</html>
